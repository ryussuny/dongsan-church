<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>함께 자라요 — 자비스와 함께하는 발달 놀이</title>
<meta name="description" content="발달이 늦은 아이를 위한 집에서 하는 놀이 치료 — 말하기·손놀이·그리기·생각·마음·몸놀이·쉬어가기. 언어·작업·미술치료를 집에서 이어 갑니다.">
<link rel="manifest" href="grow-manifest.json">
<meta name="theme-color" content="#4f8cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="함께 자라요">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/grow-180.png">
<link rel="icon" href="icons/grow-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   함께 자라요 — 공통 모양
   발달이 늦은 아이를 위해: 크게, 한 화면에 하나, 조용한 색, 실패 없는 반응.
   =========================================================== */
:root{
  --bg:#f3f7fc; --surface:#ffffff; --ink:#24344a; --soft:#64748b; --line:#e2e9f3;
  --accent:#4f8cff; --on-accent:#ffffff; --good:#22b07d; --warn:#ff9f43;
  --jv:#5aa9ff; --jv2:#bfe3ff; --jv-face:#173a63; --jv-eye:#8ff3ff; --jv-cheek:#ff9db8;
  --shadow:0 6px 22px rgba(36,52,74,.09); --r:24px;
  --area:#4f8cff;
  --tap:clamp(64px,16vw,120px);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121a26; --surface:#1b2534; --ink:#edf3fb; --soft:#a3b3c8; --line:#2b394d;
    --jv-face:#0d2443; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a26; --surface:#1b2534; --ink:#edf3fb; --soft:#a3b3c8; --line:#2b394d;
  --jv-face:#0d2443; --shadow:0 6px 22px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.6;word-break:keep-all;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
h1,h2,h3,.jua{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
.screen{display:none;min-height:100%}
.screen.on{display:block}
[hidden]{display:none!important}

/* ---------- 단추 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:16px;
  background:var(--accent);color:var(--on-accent);font-size:17px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.12);transition:transform .1s}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:none}
.btn.big{min-height:64px;padding:14px 26px;font-size:21px;border-radius:22px;font-family:'Jua',sans-serif;font-weight:400}
.btn.soft{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--soft);box-shadow:none}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:12px}
.btn.green{background:var(--good)}
.btn:disabled{opacity:.45}

/* ---------- 자비스 얼굴 ---------- */
.jv{width:100%;height:100%;overflow:visible}
.jv-head{fill:var(--jv)} .jv-ear{fill:var(--jv)} .jv-face{fill:var(--jv-face)}
.jv-ant{stroke:var(--jv);stroke-width:4;stroke-linecap:round}
.jv-bulb{fill:#ffd54f;transition:fill .2s}
.jv-eye{fill:var(--jv-eye);transform-box:fill-box;transform-origin:center;animation:jvBlink 5s infinite}
.jv-shine{fill:#fff}
.jv-cheek{fill:var(--jv-cheek);opacity:.7}
.jv-smile{fill:none;stroke:var(--jv-eye);stroke-width:4;stroke-linecap:round}
.jv-mouth{fill:var(--jv-eye);opacity:0;transform-box:fill-box;transform-origin:center}
@keyframes jvBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.jv-talk .jv-smile{opacity:0}
.jv-talk .jv-mouth{opacity:1;animation:jvTalk .26s infinite alternate}
@keyframes jvTalk{from{transform:scaleY(.3)}to{transform:scaleY(1.1)}}
.jv-talk .jv-bulb{fill:#7cf7a3}
.jv-listen .jv-bulb{fill:#ff6b81;animation:jvPulse .8s infinite alternate}
.jv-listen .jv-ear{fill:#ff8fa3}
@keyframes jvPulse{from{opacity:.4}to{opacity:1}}
.jv-bob{animation:jvBob 3s ease-in-out infinite}
@keyframes jvBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ---------- 홈 ---------- */
#home{padding:calc(12px + var(--safe-t)) 16px calc(24px + var(--safe-b));max-width:980px;margin:0 auto}
.hm-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hm-jv{width:84px;height:84px;flex:none}
.hm-hi{flex:1;min-width:0}
.hm-hi small{color:var(--soft);font-size:14px}
.hm-hi h1{font-size:clamp(22px,5.4vw,32px);line-height:1.25}
.hm-parent{position:relative;width:52px;height:52px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:24px;flex:none}
.hm-parent i{position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--accent);clip-path:inset(0 100% 0 0);transition:clip-path 0s}
.hm-parent.hold i{clip-path:inset(0 0 0 0);transition:clip-path 1.2s linear}
.hm-today{width:100%;display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:28px;color:#fff;text-align:left;
  background:linear-gradient(135deg,#4f8cff,#7c6cff);box-shadow:0 10px 26px rgba(79,140,255,.35);margin-bottom:14px}
.hm-today .tp{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.hm-today b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(24px,6vw,34px);line-height:1.2}
.hm-today small{opacity:.92;font-size:14px}
.hm-today.done{background:linear-gradient(135deg,#22b07d,#4fc3a1);box-shadow:0 10px 26px rgba(34,176,125,.3)}
.hm-quick{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.hm-quick button{background:var(--surface);border-radius:20px;padding:10px 4px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px}
.hm-quick .qe{font-size:clamp(28px,7vw,40px);line-height:1.1}
.hm-quick .ql{font-size:clamp(11px,2.9vw,15px);font-weight:700;white-space:nowrap}
.hm-areas{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.hm-areas{grid-template-columns:repeat(4,1fr)}}
.area-tile{position:relative;border-radius:26px;padding:16px 14px 14px;min-height:132px;color:#fff;text-align:left;overflow:hidden;
  background:var(--c);box-shadow:0 8px 20px color-mix(in srgb,var(--c) 35%,transparent)}
.area-tile .ai{font-size:clamp(40px,10vw,56px);line-height:1}
.area-tile b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:clamp(20px,5vw,26px);margin-top:6px}
.area-tile small{font-size:12.5px;opacity:.95}
.area-tile::after{content:'';position:absolute;right:-24px;top:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.16)}
.hm-grow{display:flex;gap:12px;align-items:center;margin-top:16px;flex-wrap:wrap;justify-content:center}
.hm-tree{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:22px;padding:8px 16px 8px 10px;box-shadow:var(--shadow);text-align:left}
.hm-tree .tr-e{font-size:46px;line-height:1;position:relative}
.hm-tree .tr-e i{position:absolute;font-style:normal;font-size:14px}
.hm-tree b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:18px}
.hm-tree small{color:var(--soft);font-size:12.5px}
.tip-ef{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.tip-ef span{background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.md-card .tip-sec{text-align:left;margin-top:10px;font-size:14.5px;line-height:1.7}
.md-card .tip-sec b{display:block;font-size:13px;color:var(--soft)}
.hm-foot{margin-top:18px;text-align:center;color:var(--soft);font-size:12.5px;line-height:1.7}
.hm-streak{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.hm-streak i{width:26px;height:26px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.hm-streak i.on{background:#ffe08a}

/* ---------- 영역 화면 ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 14px 10px;background:var(--bg)}
.topbar .back{width:48px;height:48px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:22px;flex:none}
.topbar h2{font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar small{display:block;font-family:'Gowun Dodum',sans-serif;font-size:12.5px;color:var(--soft)}
.act-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 14px calc(24px + var(--safe-b));max-width:980px;margin:0 auto}
.act-card{background:var(--surface);border-radius:24px;padding:16px 12px;box-shadow:var(--shadow);text-align:center;border-bottom:6px solid var(--c)}
.act-card .ae{font-size:clamp(46px,12vw,64px);line-height:1.15}
.act-card b{display:block;font-family:'Jua',sans-serif;font-weight:400;font-size:19px;margin-top:6px}
.act-card small{display:block;color:var(--soft);font-size:12.5px;line-height:1.45;margin-top:2px}
.act-card .need{display:inline-block;margin-top:6px;font-size:11px;color:var(--soft);background:var(--bg);border-radius:999px;padding:1px 8px}

/* ---------- 놀이 무대 ---------- */
#stage.on{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:30}
.st-top{display:flex;align-items:center;gap:8px;padding:calc(8px + var(--safe-t)) 10px 6px}
.st-talk{width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:19px;flex:none}
.talk-strip{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + var(--safe-t));z-index:60;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  background:var(--surface);border-radius:24px;padding:10px;box-shadow:0 12px 34px rgba(0,0,0,.2);width:min(560px,calc(100% - 20px));animation:fade .2s}
.talk-strip button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:84px;border-radius:18px;font-family:'Jua',sans-serif;font-size:15px;background:var(--bg)}
.talk-strip button span{font-size:34px;line-height:1.1}
.talk-strip .t-stop{background:#ffd9d9}.talk-strip .t-help{background:#fff1bf}.talk-strip .t-rest{background:#d8f3dc}.talk-strip .t-more{background:#dbe9ff}
.quit-ask .md-opts{grid-template-columns:1fr 1fr}
.quit-ask .md-opts .btn{min-height:96px;flex-direction:column;font-family:'Jua',sans-serif;font-weight:400}
.quit-ask .md-opts .btn span{font-size:40px;line-height:1.1}
.st-tip{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:17px;flex:none;opacity:.8}
.st-x,.st-say{width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:20px;flex:none}
.st-title{flex:1;min-width:0;display:flex;align-items:center;gap:5px;font-family:'Jua',sans-serif;font-size:clamp(17px,4.6vw,22px);white-space:nowrap;overflow:hidden}
.st-title>span{flex:none}
.st-title .tt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* 단계 ★ · 칸 ●●○ — 자비스 말풍선 줄 오른쪽 (머리말이 좁은 휴대폰에서도 보이게) */
.st-lv{margin-left:auto;align-self:center;flex:none}
.st-lv:empty{display:none}
.st-lv .lv{display:inline-flex;align-items:center;gap:4px;font-family:'Jua',sans-serif;color:#f5b700;font-size:clamp(14px,3.8vw,17px);letter-spacing:-1px;padding:4px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.st-lv .lv-st{font-style:normal;font-size:.8em;letter-spacing:1px;color:var(--area,#8a94a6)}
.st-lv .lv-n{font-weight:400;font-size:.85em;letter-spacing:0;color:#ff7a1a}
.rw-up{margin:10px auto 0;padding:8px 14px;border-radius:14px;background:linear-gradient(90deg,#fff6d6,#ffe9a8);color:#7a4b00;font-weight:800;font-size:clamp(15px,4vw,19px);max-width:420px;animation:rwUp .6s ease-out both}
.rw-up small{display:block;font-weight:600;font-size:.78em;color:#9a6a10;margin-top:2px}
.reward.hero .rw-up{background:linear-gradient(90deg,rgba(255,213,79,.18),rgba(79,195,247,.18));color:#ffe082;border:1px solid rgba(255,213,79,.45)}
.reward.hero .rw-up small{color:#b3e5fc}
@keyframes rwUp{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.st-dots{display:flex;gap:5px;flex:none}
.st-dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.st-dots .dots-n{font-family:'Jua',sans-serif;font-weight:400;font-size:15px;color:var(--area)}
.st-dots i.done{background:var(--area)} .st-dots i.now{background:var(--area);transform:scale(1.4);opacity:.6}
.st-sess{height:6px;margin:0 14px 4px;border-radius:9px;background:var(--line);overflow:hidden}
.st-sess b{display:block;height:100%;background:linear-gradient(90deg,#4f8cff,#7c6cff);border-radius:9px;transition:width .4s}
.st-jv{display:flex;align-items:flex-end;gap:8px;padding:2px 12px 6px;min-height:58px}
.st-jv .jvm{width:54px;height:54px;flex:none}
.st-bubble{position:relative;background:var(--surface);border-radius:18px 18px 18px 6px;padding:8px 14px;font-size:clamp(15px,4vw,19px);line-height:1.45;box-shadow:var(--shadow);
  max-width:calc(100% - 70px);opacity:0;transform:translateY(6px);transition:.25s}
.st-bubble.on{opacity:1;transform:none}
.st-body{flex:1;min-height:0;position:relative;overflow:auto;padding:6px 12px calc(14px + var(--safe-b));display:flex;flex-direction:column;align-items:center}
.st-body > *{max-width:960px;width:100%}

/* 그림 고르기 */
.choices{display:grid;gap:clamp(10px,2.6vw,18px);width:100%;margin:auto 0}
.choices.c1{grid-template-columns:1fr;max-width:340px}
.choices.c2{grid-template-columns:repeat(2,1fr);max-width:620px}
.choices.c3{grid-template-columns:repeat(3,1fr)}
.choices.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:520px){.choices.c4{grid-template-columns:repeat(2,1fr)}}
.choice{background:var(--surface);border-radius:26px;padding:clamp(10px,3vw,20px) 6px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;min-height:var(--tap);border:4px solid var(--cc,transparent);transition:transform .15s,border-color .2s}
.choice:active{transform:scale(.95)}
.choice .ce{font-size:clamp(46px,13vw,104px);line-height:1.1}
.choices.md .choice .ce{font-size:clamp(36px,10vw,72px)}
.choices.xl .choice .ce{font-size:clamp(64px,18vw,140px)}
.choice .cl{font-size:clamp(16px,4.4vw,24px);font-family:'Jua',sans-serif}
.choice img{width:100%;max-width:160px;aspect-ratio:1;object-fit:cover;border-radius:18px}
.choice.right{border-color:var(--good);animation:pop .5s}
.choice.dim{opacity:.35}
.choices.locked .choice:not(.right){opacity:.5}
.hint{animation:glow 1s ease-in-out 3;outline:5px solid #ffd54f;outline-offset:2px}
.calm .hint{animation:none!important;box-shadow:0 0 0 8px #ffd54f,0 0 24px #ffd54f!important}
@keyframes glow{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 8px color-mix(in srgb,#ffd54f 80%,transparent),0 0 30px #ffd54f}}
.wiggle{animation:wig .45s}
@keyframes wig{0%,100%{transform:none}20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.big-pic{font-size:clamp(110px,34vw,230px);line-height:1.1;text-align:center;margin:auto 0 8px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.12))}
.big-word{font-family:'Jua',sans-serif;font-size:clamp(36px,10vw,64px);text-align:center;letter-spacing:2px}
.judge{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.judge .btn{flex:1;max-width:260px}
.mic-btn{width:clamp(96px,26vw,140px);height:clamp(96px,26vw,140px);border-radius:50%;background:#ff6b81;color:#fff;font-size:clamp(40px,11vw,60px);
  box-shadow:0 8px 0 #d94b62,0 12px 24px rgba(255,107,129,.35);margin:10px auto;display:flex;align-items:center;justify-content:center}
.jv-listen .mic-btn{animation:micPulse 1s infinite}
@keyframes micPulse{0%{box-shadow:0 8px 0 #d94b62,0 0 0 0 rgba(255,107,129,.6)}100%{box-shadow:0 8px 0 #d94b62,0 0 0 26px rgba(255,107,129,0)}}
.heard{min-height:30px;text-align:center;color:var(--soft);font-size:18px}
.gcv{display:block;touch-action:none;border-radius:20px}
.dragging{z-index:50;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2))}

/* 상 화면 */
.reward{position:fixed;inset:0;z-index:80;background:rgba(18,26,38,.55);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .25s}
.rw-card{background:var(--surface);border-radius:34px;padding:24px 20px 20px;width:min(440px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .5s}
.rw-stars span{display:inline-block;font-size:50px;animation:starIn .5s backwards}
.rw-stars span:nth-child(2){font-size:64px;animation-delay:.15s} .rw-stars span:nth-child(3){animation-delay:.3s}
@keyframes starIn{from{transform:scale(0) rotate(-90deg);opacity:0}}
.rw-jv{width:110px;height:110px;margin:4px auto}
.rw-msg{font-family:'Jua',sans-serif;font-size:22px;line-height:1.4;margin:6px 0 10px}
.rw-stk{display:inline-flex;align-items:center;gap:10px;background:var(--bg);border-radius:18px;padding:6px 16px;margin-bottom:14px}
.rw-stk b{font-size:44px;animation:pop .6s .5s backwards}
.rw-stk small{color:var(--soft)}
.rw-btns{display:flex;flex-direction:column;gap:10px}
@keyframes fade{from{opacity:0}}

/* 효과 */
.fx-star{position:fixed;z-index:90;pointer-events:none;font-size:28px;transform:translate(-50%,-50%);animation:fxStar .9s ease-out forwards}
@keyframes fxStar{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.4);opacity:0}}
.fx-conf{position:fixed;top:-12px;z-index:90;width:10px;height:14px;border-radius:3px;pointer-events:none;animation:fxFall 2s ease-in forwards}
@keyframes fxFall{to{transform:translateY(105vh) rotate(var(--rx));opacity:.8}}

/* 알림·대화상자 */
#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,30px);background:#24344a;color:#fff;padding:12px 18px;border-radius:16px;
  font-size:15px;z-index:100;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:95;background:rgba(18,26,38,.5);display:flex;align-items:center;justify-content:center;padding:18px}
.md-card{background:var(--surface);border-radius:26px;padding:22px;width:min(420px,100%);text-align:center}
.md-card h3{font-size:22px;margin-bottom:4px} .md-card p{color:var(--soft);font-size:14.5px}
.md-q{font-size:40px;font-family:'Jua',sans-serif;margin:12px 0}
.md-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.md-opts .btn{font-size:22px}

/* 스티커북 */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;padding:8px 14px calc(24px + var(--safe-b));max-width:900px;margin:0 auto}
.book-grid i{aspect-ratio:1;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:40px}
.book-grid i.no{filter:grayscale(1) opacity(.18)}
.book-sum{text-align:center;font-family:'Jua',sans-serif;font-size:20px;margin:4px 0 10px}

/* 부모 화면 공통 */
#parent{background:var(--bg);user-select:text;-webkit-user-select:text}
.pbody{max-width:900px;margin:0 auto;padding:0 14px calc(90px + var(--safe-b))}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{font-size:19px;margin-bottom:8px}
.card p,.card li{font-size:14.5px;line-height:1.7}
.muted{color:var(--soft);font-size:13px}
.inp{width:100%;min-height:46px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);font-size:16px}
textarea.inp{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border-radius:999px;background:var(--bg);border:2px solid var(--line);font-size:14px;font-weight:700}
.chip.on{background:color-mix(in srgb,var(--c,var(--accent)) 16%,var(--surface));border-color:var(--c,var(--accent))}
.ptabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
.ptabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11.5px;font-weight:700;color:var(--soft);padding:4px 0;border-radius:12px}
.ptabs button span{font-size:22px;line-height:1.2}
.ptabs button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}

/* 감각 예민 모드 — 움직임 줄이기 */
.calm *,.calm *::before,.calm *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
.calm .jv-talk .jv-mouth{animation:none;transform:scaleY(.7)}
@media (prefers-reduced-motion:reduce){.jv-eye,.jv-bob{animation:none}}

/* =========================================================
   히어로 테마 — 홈·격납고·상 화면 (변신 로봇 히어로 느낌)
   ========================================================= */
.hero-scr{background:
  radial-gradient(900px 520px at 10% -8%,rgba(59,130,246,.45),transparent 62%),
  radial-gradient(700px 480px at 105% 6%,rgba(139,92,246,.35),transparent 60%),
  radial-gradient(600px 400px at 50% 110%,rgba(14,165,233,.25),transparent 65%),
  linear-gradient(180deg,#081127,#0d1a3a 55%,#0a1530);color:#eaf2ff;min-height:100vh;position:relative}
.hero-scr::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 78% 12%,#cfe3ff 50%,transparent 51%),
  radial-gradient(1px 1px at 40% 42%,#fff 50%,transparent 51%),radial-gradient(1.6px 1.6px at 88% 58%,#fff 50%,transparent 51%),
  radial-gradient(1px 1px at 22% 72%,#bcd6ff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 62% 86%,#fff 50%,transparent 51%),
  linear-gradient(rgba(120,170,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.06) 1px,transparent 1px);
  background-size:auto,auto,auto,auto,auto,auto,44px 44px,44px 44px}
.hero-scr > *{position:relative}
.hero-t{font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;letter-spacing:.5px}
#home.hero-scr .hm-hi small{color:#9fb6e0}
#home.hero-scr .hm-hi h1{font-family:'Black Han Sans','Jua',sans-serif;color:#fff;text-shadow:0 0 18px rgba(90,169,255,.55)}
#home.hero-scr .hm-jv{width:104px;height:124px;filter:drop-shadow(0 0 16px rgba(80,180,255,.6))}
#home.hero-scr .hm-parent{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);box-shadow:none}
#home.hero-scr .hm-today{position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%),linear-gradient(135deg,#1b2a4e,#0f1a33 60%,#142447);
  border:1px solid rgba(94,234,255,.55);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),inset 0 0 28px rgba(56,189,248,.18),0 0 22px rgba(56,189,248,.35),0 12px 30px rgba(0,0,0,.45);
  clip-path:polygon(0 12px,12px 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px))}
#home.hero-scr .hm-today .tp{background:linear-gradient(135deg,#ff9a3c,#ff5f1f);box-shadow:0 0 18px rgba(255,140,60,.6);border-radius:16px;color:#fff}
#home.hero-scr .hm-today b{letter-spacing:1px;text-shadow:0 0 14px rgba(94,234,255,.6)}
#home.hero-scr .hm-today small{color:#9fdcff}
#home.hero-scr .hm-today::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}55%,100%{left:130%}}
#home.hero-scr .hm-today b{font-family:'Black Han Sans','Jua',sans-serif}
#home.hero-scr .hm-today.done{border-color:rgba(52,211,153,.7);box-shadow:inset 0 0 28px rgba(52,211,153,.18),0 0 22px rgba(52,211,153,.35),0 12px 30px rgba(0,0,0,.45)}
#home.hero-scr .hm-quick button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);box-shadow:none;color:#eaf2ff}
#home.hero-scr .area-tile{min-height:150px;border-radius:16px;color:#eaf2ff;
  border:1px solid color-mix(in srgb,var(--c) 55%,rgba(255,255,255,.12));
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 35%),
    radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,var(--c) 28%,transparent),transparent 60%),
    linear-gradient(160deg,#1a2540,#0e1729);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 0 0 1px rgba(0,0,0,.35),0 0 18px color-mix(in srgb,var(--c) 22%,transparent),0 10px 24px rgba(0,0,0,.4);
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
#home.hero-scr .area-tile::before{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--c),transparent);opacity:.9;pointer-events:none}
#home.hero-scr .area-tile::after{display:none}
#home.hero-scr .area-tile small{color:#a9bbdb;opacity:1}
#home.hero-scr .area-tile .ai{display:block;width:68px;height:68px}
#home.hero-scr .area-tile .ai svg{width:100%;height:100%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}
#home.hero-scr .area-tile b{font-family:'Black Han Sans','Jua',sans-serif;letter-spacing:.5px;text-shadow:0 0 12px color-mix(in srgb,var(--c) 60%,transparent)}
#home.hero-scr .hm-tree{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);box-shadow:none;color:#eaf2ff}
#home.hero-scr .hm-tree small{color:#9fb6e0}
#home.hero-scr .hm-tree .tr-e{width:58px;height:78px;font-size:0}
#home.hero-scr .hm-tree .tr-e .rart{width:58px;border-radius:8px}
#home.hero-scr .hm-tree .tr-e svg{width:100%;height:100%}
#home.hero-scr .hm-streak i{background:rgba(255,255,255,.09);color:#cfe0ff}
#home.hero-scr .hm-streak i.on{background:linear-gradient(135deg,#ffd54f,#ff9f1c);color:#3b2600}
#home.hero-scr .hm-foot{color:#8ea4cb}
/* 로봇 격납고 */
#book.hero-scr .topbar,#journey.hero-scr .topbar{background:transparent}
#book.hero-scr .topbar h2,#journey.hero-scr .topbar h2{color:#fff;font-family:'Black Han Sans','Jua',sans-serif}
#book.hero-scr .topbar .back,#journey.hero-scr .topbar .back{background:rgba(255,255,255,.1);color:#fff;box-shadow:none}
.hangar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:6px 14px calc(24px + var(--safe-b));max-width:980px;margin:0 auto}
.hg-card{position:relative;border-radius:22px;padding:10px 8px 12px;text-align:center;background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);color:#eaf2ff;overflow:hidden}
.hg-card.done{border-color:color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 30px color-mix(in srgb,var(--c) 18%,transparent)}
.hg-card.lock{opacity:.55}
.hg-art{height:170px;display:flex;align-items:center;justify-content:center}
.hg-art svg{height:100%;width:auto;max-width:100%}
.hg-card b{display:block;font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;font-size:18px;margin-top:4px}
.hg-card small{display:block;font-size:12.5px;color:#a9bde3;line-height:1.4}
.hg-bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);margin:6px 10px 0;overflow:hidden}
.hg-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),#fff);border-radius:9px}
.hg-sum{text-align:center;margin:0 14px 8px;color:#cfe0ff;font-family:'Jua',sans-serif;font-size:18px}
.transform{animation:tf 1.3s cubic-bezier(.3,1.4,.5,1)}
@keyframes tf{0%{transform:scale(.6) rotateY(0);filter:brightness(2.2) drop-shadow(0 0 30px #fff)}50%{transform:scale(1.15) rotateY(180deg)}100%{transform:scale(1) rotateY(360deg);filter:none}}
/* 상 화면 — 히어로 */
.reward.hero .rw-card{background:linear-gradient(165deg,#13244f,#0c1733);color:#eaf2ff;border:1px solid rgba(120,180,255,.35);box-shadow:0 0 40px rgba(80,160,255,.35),0 20px 60px rgba(0,0,0,.4)}
.reward.hero .rw-msg{font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;text-shadow:0 0 14px rgba(120,190,255,.5)}
.rw-note{max-width:440px;margin:0 auto 8px;padding:6px 12px;border-radius:12px;font-weight:800;font-size:14px;text-align:center}
.rw-note small{font-weight:600;opacity:.8}
.rw-note.rec{background:rgba(255,213,79,.16);color:#ffe082;border:1px solid rgba(255,213,79,.45)}
.rw-note.day{background:rgba(125,249,255,.12);color:#b3f3ff;border:1px solid rgba(125,249,255,.4)}
.rw-note.combo{background:rgba(255,159,28,.2);color:#ffe0a3;border:1px solid rgba(255,190,80,.6)}
.rw-note.badge{background:rgba(200,40,60,.25);color:#ffd0d6;border:1px solid rgba(255,140,160,.45)}
.rw-en{max-width:440px;margin:0 auto 14px;text-align:center}
.rw-en>b{font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;font-size:clamp(24px,7vw,32px);color:#ffd54f;text-shadow:0 0 14px rgba(255,213,79,.55)}
.rw-en>small{display:block;color:#cfe0ff;font-size:13px;margin:2px 0 4px}
.en-box{text-align:left;background:rgba(255,213,79,.10);border:1px solid rgba(255,213,79,.42);border-radius:14px;padding:8px 12px;margin-top:6px}
.en-box b{font-family:'Jua',sans-serif;font-weight:400;color:#ffd54f;font-size:17px}
.en-box small{display:block;color:#cfe0ff;font-size:12.5px;line-height:1.4}
.en-bar{height:9px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:6px;overflow:hidden}
.en-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd54f,#ff9f1c);transition:width .8s}
.en-box.locked{background:rgba(148,163,184,.14);border-color:rgba(148,163,184,.45)}
.en-box.locked b{color:#e2e8f0}.en-box.locked .en-bar i{background:linear-gradient(90deg,#94a3b8,#cbd5e1)}
.reward.hero .rw-part{display:flex;align-items:center;gap:12px;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:8px 12px;margin-bottom:14px}
.reward.hero .rw-part .rp-art{width:110px;height:130px}
.reward.hero .rw-part .rp-art svg{width:100%;height:100%}
.reward.hero .rw-part small{display:block;color:#a9bde3;font-size:13px}
.reward.hero .rw-part b{display:block;font-family:'Black Han Sans','Jua',sans-serif;font-weight:400;font-size:19px;line-height:1.3}
.reward.hero .btn.soft{background:rgba(255,255,255,.08);color:#eaf2ff;border-color:rgba(255,255,255,.2)}
.new-part{animation:partFlash 1s ease-in-out 3}
@keyframes partFlash{0%,100%{filter:none}50%{filter:brightness(1.8) drop-shadow(0 0 8px #fff)}}
.calm .hero-scr::before{opacity:.25}
/* 녹음 중 표시 — 아이와 부모가 알 수 있게 */
.rec-on .st-title::after{flex:none;content:'● 녹음';color:#ff4d6d;font-size:.6em;vertical-align:middle;animation:jvPulse .8s infinite alternate}
/* 실사 자비스 — 말할 때 청록 빛, 들을 때 붉은 빛 */
.jvi{position:relative;display:block;width:100%;height:100%}
.jvi img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%;border:2px solid rgba(94,234,255,.55);box-shadow:0 0 12px rgba(56,189,248,.4);transition:box-shadow .2s,border-color .2s;background:#0a1430}
.jvi-full img{border-radius:16px;object-position:center top}
.jv-talk .jvi img{border-color:#5eeaff;box-shadow:0 0 0 3px rgba(94,234,255,.6),0 0 24px #38bdf8}
.jv-listen .jvi img{border-color:#ff6b81;box-shadow:0 0 0 3px rgba(255,107,129,.6),0 0 24px #ff6b81}
.jvi-eq{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);display:flex;gap:2px;align-items:flex-end;height:12px;opacity:0;transition:opacity .2s}
.jv-talk .jvi-eq{opacity:1}
.jvi-eq b{width:3px;height:100%;background:#5eeaff;border-radius:2px;box-shadow:0 0 6px #5eeaff;animation:jvEq .45s ease-in-out infinite alternate}
.jvi-eq b:nth-child(2){animation-delay:.1s}.jvi-eq b:nth-child(3){animation-delay:.2s}.jvi-eq b:nth-child(4){animation-delay:.05s}.jvi-eq b:nth-child(5){animation-delay:.15s}
@keyframes jvEq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
#home.hero-scr .hm-jv{width:96px;height:128px}
.hm-quick .qe .jvi{width:clamp(30px,8vw,44px);height:clamp(30px,8vw,44px);margin:0 auto}
.reward.hero .rw-part .rp-art{width:108px;height:auto}
.reward.hero .rp-name{font-size:15px!important;color:#ffd54f;margin-top:2px}
.rp-dots{display:flex;gap:4px;margin:7px 0 3px}
.rp-dots i{width:15px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.rp-dots i.on{background:#5eeaff;box-shadow:0 0 6px #5eeaff}
.rp-dots i.new{background:#ffd54f;box-shadow:0 0 8px #ffd54f;animation:partFlash 1s ease-in-out 3}
.reward.hero .rp-rank{color:#ffd54f!important;font-weight:700;margin-top:4px}
.calm #home.hero-scr .hm-today::after{display:none}

@media print{
  body{background:#fff;color:#000}
  .screen{display:none!important}
  #parent.on{display:block!important}
  .ptabs,.topbar,.noprint{display:none!important}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
}
</style>
</head>
<body>

<!-- ============ 홈 ============ -->
<section id="home" class="screen on hero-scr">
  <header class="hm-top">
    <div class="hm-jv jv-bob" id="hmJv"></div>
    <div class="hm-hi"><small id="hmDate"></small><h1 id="hmHello">안녕! 나는 자비스야</h1></div>
    <button id="parentBtn" class="hm-parent" aria-label="부모 화면 — 길게 누르세요">👨‍👩‍👦<i></i></button>
  </header>
  <button id="todayBtn" class="hm-today"><span class="tp">▶</span><span><b>오늘의 놀이</b><small id="todaySub">15분 · 자비스가 골라 줘요</small></span></button>
  <div class="hm-quick">
    <button data-go="talkboard"><span class="qe">💬</span><span class="ql">말판</span></button>
    <button data-go="chat"><span class="qe">🤖</span><span class="ql">자비스랑</span></button>
    <button data-go="schedule"><span class="qe">📅</span><span class="ql">오늘 할 일</span></button>
    <button data-go="timer"><span class="qe">⏳</span><span class="ql">기다리기</span></button>

  </div>
  <button class="hm-journey" id="hmJourney" aria-label="1년 여정"></button>

    <div class="hm-streak" id="hmStreak"></div>
  </div>
  <p class="hm-foot">언어·작업·미술치료 선생님과 함께하는 <b>집 놀이</b>예요. 치료를 대신하지 않아요.<br>
  아이 기록은 이 기기에만 저장돼요. · 부모 화면은 오른쪽 위 👨‍👩‍👦 를 <b>길게</b> 누르세요.</p>
</section>

<section id="area" class="screen">

<section id="parent" class="screen">
  <div class="topbar"><button class="back" data-home aria-label="아이 화면으로">←</button><h2 id="pTitle">부모 화면<small>기록 · 일지 · 자비스 코치 · 설정</small></h2></div>
