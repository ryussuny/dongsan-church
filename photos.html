<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진첩 — 동산감리교회</title>
<meta name="description" content="동산감리교회의 예배와 행사, 함께한 시간들을 사진으로 담았습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brick:#1a2f5c; --brick2:#2f4d85; --brick-deep:#0f1b33;
  --moss:#b8862e; --moss2:#8f6a1f; --gold:#c9a24c;
  --cream:#f6f7fb; --paper:#ffffff; --warm:#eef1f7; --stone:#dde3ef;
  --text:#171b2a; --text2:#4c5468; --text3:#8891a5; --white:#ffffff; --border:#e1e5ef;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--text);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1020px;margin:0 auto;padding:0 1.75rem}

nav{position:sticky;top:0;z-index:300;background:rgba(251,243,231,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);height:70px;display:flex;align-items:center}
.nav-inner{width:100%;max-width:1120px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-mark{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(145deg,var(--brick2),var(--brick-deep));display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:'Gowun Batang',serif;font-weight:700;font-size:1.05rem}
.nav-name{font-family:'Gowun Batang',serif;font-size:1.05rem;font-weight:700;color:var(--brick-deep)}
.nav-sub{font-size:.66rem;color:var(--moss2);letter-spacing:.04em;margin-top:1px}
.nav-back{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.86rem;font-weight:700;color:var(--text2);padding:.55rem 1.1rem;border-radius:999px;border:1px solid var(--border);background:var(--white)}
.nav-back:hover{color:var(--brick-deep);border-color:var(--brick2)}

.hero{padding:3.4rem 0 1.6rem;text-align:center}
.hero h1{font-family:'Gowun Batang',serif;font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;margin-bottom:.6rem}
.hero p{color:var(--text2);font-size:.98rem}

.cats{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;margin:1.6rem 0 .4rem}
.cat{font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;padding:.6rem 1.2rem;
  border-radius:999px;border:1px solid var(--border);background:var(--paper);color:var(--text2)}
.cat:hover{border-color:var(--brick2)}
.cat.active{background:var(--brick);border-color:var(--brick);color:#fff}
.cat span{font-weight:500;opacity:.7;margin-left:.35rem}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem;padding:1.8rem 0 4rem}
.shot{background:var(--white);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;
  transition:box-shadow .2s,border-color .2s,transform .2s}
.shot:hover{box-shadow:0 12px 30px rgba(15,27,51,.13);border-color:var(--brick2);transform:translateY(-2px)}
.shot-img{aspect-ratio:4/3;background:var(--warm);display:block;width:100%;object-fit:cover}
.shot-cap{padding:.85rem 1rem}
.shot-title{font-size:.9rem;font-weight:700;color:var(--text);line-height:1.5}
.shot-date{font-size:.76rem;color:var(--text3);margin-top:.2rem}

.empty{text-align:center;color:var(--text3);padding:4rem 1rem;font-size:.94rem;line-height:2}
.empty b{display:block;color:var(--text2);font-size:1.02rem;margin-bottom:.7rem}
.empty code{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:.15rem .45rem;font-size:.9em;color:var(--brick2)}

/* ── 크게 보기 ── */
.viewer{position:fixed;inset:0;z-index:500;background:rgba(9,14,26,.93);display:none;
  align-items:center;justify-content:center;padding:2.5rem 1.5rem}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:80vh;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.viewer-cap{position:absolute;bottom:1.6rem;left:0;right:0;text-align:center;color:#fff;font-size:.92rem;padding:0 1.5rem}
.viewer-cap span{display:block;font-size:.8rem;opacity:.65;margin-top:.25rem}
.viewer-x{position:absolute;top:1.2rem;right:1.4rem;width:44px;height:44px;border:none;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;font-size:1.3rem;cursor:pointer;font-family:inherit}
.viewer-x:hover{background:rgba(255,255,255,.26)}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border:none;border-radius:50%;
  background:rgba(255,255,255,.14);color:#fff;font-size:1.4rem;cursor:pointer;font-family:inherit}
.viewer-nav:hover{background:rgba(255,255,255,.26)}
.viewer-prev{left:1.2rem}.viewer-next{right:1.2rem}

@media(max-width:860px){.grid{grid-template-columns:repeat(2,1fr);gap:.8rem}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.viewer-nav{width:42px;height:42px}}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-mark">동</div>
      <div><div class="nav-name">동산감리교회</div><div class="nav-sub">DONGSAN METHODIST CHURCH</div></div>
    </a>
    <a href="index.html" class="nav-back">← 홈으로</a>
  </div>
</nav>

<header class="hero wrap">
  <h1>사진첩</h1>
  <p>함께 예배하고 함께 웃던 시간들을 담았습니다.</p>
</header>

<div class="wrap">
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="viewer" id="viewer">
  <button type="button" class="viewer-x" id="vClose" aria-label="닫기">✕</button>
  <button type="button" class="viewer-nav viewer-prev" id="vPrev" aria-label="이전 사진">‹</button>
  <img id="vImg" alt="">
  <button type="button" class="viewer-nav viewer-next" id="vNext" aria-label="다음 사진">›</button>
  <div class="viewer-cap" id="vCap"></div>
</div>

<script>
// 사진첩 — photos.json 은 photos 폴더를 훑어 scripts/build-photos.js 가 만든다.
let cats = [], cur = '', shots = [], at = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/</g, '&lt;').replace(/"/g, '&quot;');

async function load() {
  try {
    const r = await fetch('photos.json', { cache: 'no-store' });
    const d = r.ok ? await r.json() : null;
    cats = (d && Array.isArray(d.categories)) ? d.categories.filter(c => c.photos && c.photos.length) : [];
  } catch (e) { cats = []; }
  cur = cats.length ? cats[0].key : '';
  render();
}

function render() {
  const catWrap = $('cats'), grid = $('grid');

  if (!cats.length) {
    catWrap.innerHTML = '';
    grid.style.display = 'block';
    grid.innerHTML = `<div class="empty">
      <b>아직 올라온 사진이 없습니다.</b>
      깃허브 저장소의 <code>photos</code> 폴더 안 카테고리 폴더에 사진을 올리시면<br>
      1~2분 뒤 이곳에 저절로 나타납니다.
    </div>`;
    return;
  }

  grid.style.display = 'grid';
  catWrap.innerHTML = cats.map(c =>
    `<button type="button" class="cat${c.key === cur ? ' active' : ''}" data-key="${esc(c.key)}">${esc(c.label)}<span>${c.photos.length}</span></button>`
  ).join('');
  catWrap.querySelectorAll('.cat').forEach(b => {
    b.addEventListener('click', () => { cur = b.dataset.key; render(); });
  });

  const c = cats.find(x => x.key === cur) || cats[0];
  shots = c.photos;
  grid.innerHTML = shots.map((p, i) => `<figure class="shot" data-i="${i}">
    <img class="shot-img" src="${esc(p.src)}" alt="${esc(p.title)}" loading="lazy">
    <figcaption class="shot-cap">
      <div class="shot-title">${esc(p.title)}</div>
      ${p.date ? `<div class="shot-date">${esc(p.date.replace(/-/g, '.'))}</div>` : ''}
    </figcaption>
  </figure>`).join('');
  grid.querySelectorAll('.shot').forEach(el => {
    el.addEventListener('click', () => open(Number(el.dataset.i)));
  });
}

function open(i) {
  at = i;
  const p = shots[at];
  if (!p) return;
  $('vImg').src = p.src;
  $('vImg').alt = p.title;
  $('vCap').innerHTML = esc(p.title) + (p.date ? `<span>${esc(p.date.replace(/-/g, '.'))}</span>` : '');
  $('viewer').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function close() { $('viewer').classList.remove('on'); document.body.style.overflow = ''; }
function step(d) { if (shots.length) open((at + d + shots.length) % shots.length); }

$('vClose').addEventListener('click', close);
$('vPrev').addEventListener('click', e => { e.stopPropagation(); step(-1); });
$('vNext').addEventListener('click', e => { e.stopPropagation(); step(1); });
$('viewer').addEventListener('click', e => { if (e.target === $('viewer')) close(); });
document.addEventListener('keydown', e => {
  if (!$('viewer').classList.contains('on')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

load();
</script>
</body>
</html>
