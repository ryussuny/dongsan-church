<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<title>묵상집 · 처음 신앙, 매일 한 걸음 — 동산감리교회</title>
<meta name="description" content="신앙을 시작하는 성도를 위한 74일 아침 묵상집. 어른용과 어린이용을 책처럼 넘겨 보고 인쇄할 수 있습니다. 앱과 같은 날 같은 말씀입니다.">
<meta name="theme-color" content="#8f4531">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--brick:#8f4531;--brick2:#b3593f;--gold:#c99a3f;--ink:#2f2a26;--ink2:#5a4b3c;--ink3:#8a795f;--paper:#fffdf8;--line:#e6d3b4;--cream:#fbf3e7;
  --sky:#3d8fca;--sun:#f0b429;--leaf:#5f9e4f;--desk:#ece3d6}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#1f1b17}}
:root[data-theme="dark"]{--desk:#1f1b17}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--desk)}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
/* ---------- 화면: 책 넘겨 보기 ---------- */
.bar{position:sticky;top:0;z-index:5;background:#2f2a26;color:#f4e6d3;padding:10px 12px 8px}
.bar .row{display:flex;align-items:center;gap:8px;max-width:1200px;margin:0 auto}
.bar a.back{color:#e6d3b4;text-decoration:none;font-size:13px;white-space:nowrap}
.bar .ttl{flex:1;min-width:0;font-family:'Gowun Batang',serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.tabs button{border:0;background:transparent;color:#e6d3b4;font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:#f4e6d3;color:#2f2a26;font-weight:700}
.tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:1200px;margin:8px auto 0}
.tools button,.tools select,.tools a{font:inherit;font-size:13px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#f4e6d3;
  border-radius:10px;padding:7px 10px;cursor:pointer;text-decoration:none;min-height:36px}
.tools select{max-width:46vw}
.tools select option{color:#2f2a26}
.tools .pg{font-size:12.5px;color:#e6d3b4;min-width:64px;text-align:center}
.tools .sp{flex:1}
.stage{display:flex;justify-content:center;gap:10px;padding:14px 12px 40px}
.slot{display:none;position:relative;box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:3px;overflow:hidden;background:#fff}
.slot.cur{display:block}
.slot>.page{transform-origin:0 0;position:absolute;left:0;top:0}
.loading{color:var(--ink3);text-align:center;padding:60px 20px;font-size:14px}
.hint{text-align:center;color:var(--ink3);font-size:12px;padding:0 12px 30px}
.preload .slot{display:block!important;position:absolute;left:-9999px;top:0}
.measure .slot{display:none!important}
.measure .slot.m{display:block!important;position:absolute;left:-9999px;top:0;box-shadow:none}
/* ---------- 책 한 쪽 (A5) ---------- */
.page{width:148mm;height:210mm;background:var(--paper);color:var(--ink);overflow:hidden;position:relative}
.inner{position:absolute;left:14mm;right:14mm;top:13mm;bottom:15mm;display:flex;flex-direction:column;overflow:hidden;font-size:10.5pt;line-height:1.72}
.pno{position:absolute;bottom:7mm;font-size:7.5pt;color:var(--ink3);font-family:'Noto Sans KR',sans-serif;letter-spacing:.04em}
.page.even .pno{left:14mm}.page.odd .pno{right:14mm;text-align:right}
.serif{font-family:'Gowun Batang',serif}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:7.8pt;color:var(--ink3);letter-spacing:.03em;
  border-bottom:.6pt solid var(--line);padding-bottom:1.6mm;margin-bottom:3.4mm;line-height:1.4}
.hd b{color:var(--brick);font-weight:700}
.fe{display:inline-block;background:var(--gold);color:#2f2a26;font-size:7.6pt;font-weight:700;border-radius:99px;padding:.4mm 2.6mm;margin-bottom:1.6mm;line-height:1.5}
h2.dttl{font-family:'Gowun Batang',serif;font-size:17pt;line-height:1.3;margin:.5mm 0 1mm}
.ref{font-size:9pt;color:var(--brick);font-weight:700;margin-bottom:3mm}
.bible{font-family:'Gowun Batang',serif;text-align:left}
.bible sup{font-family:'Noto Sans KR',sans-serif;font-size:.6em;color:var(--brick);font-weight:700;margin-right:.6mm;vertical-align:.45em}
.lab{display:block;font-family:'Noto Sans KR',sans-serif;font-size:8pt;font-weight:700;color:var(--brick);letter-spacing:.04em;margin-bottom:.8mm}
.med p{font-family:'Gowun Batang',serif;margin-bottom:1.6mm}
.gos{background:#fbf3e7;border-left:1.4pt solid var(--brick);border-radius:0 2mm 2mm 0;padding:2mm 3mm;margin:2mm 0;font-family:'Gowun Batang',serif}
.rem{background:var(--brick);color:#fff;border-radius:2.4mm;padding:2.4mm 3.4mm;margin:2mm 0;font-family:'Gowun Batang',serif;font-weight:700}
.rem .lab{color:#f4e6d3}
.qa{margin-top:2.2mm}
.qa ol{padding-left:4.6mm;margin:.6mm 0 1.6mm}
.qa li{margin-bottom:.6mm}
.qa .pr{font-family:'Gowun Batang',serif}
.memo{flex:1;min-height:0;display:flex;flex-direction:column;margin-top:2.4mm}
.memo .ln{flex:1;background:repeating-linear-gradient(to bottom,transparent 0,transparent 8.4mm,#d9c7a8 8.4mm,#d9c7a8 calc(8.4mm + .5pt))}
.memo.off{display:none}
/* 앞뒤 쪽 */
.cover{background:linear-gradient(160deg,#3a2e22,#8f4531 70%,#b3593f);color:#fff}
.cover .inner{justify-content:space-between;text-align:center;top:22mm;bottom:22mm}
.cover .mk{font-size:30pt;color:#e9c77d}
.cover h1{font-family:'Gowun Batang',serif;font-size:27pt;line-height:1.35;margin-top:4mm}
.cover .sub{font-size:10.5pt;color:#f4e6d3;margin-top:3mm}
.cover .per{font-size:9.5pt;color:#e6d3b4;letter-spacing:.06em}
.cover .ch{font-family:'Gowun Batang',serif;font-size:13pt;font-weight:700}
.logo-w,.logo-c{display:block;height:7mm;width:auto;margin:0 auto}
.cover .logo-w{height:7.5mm;opacity:.95}
.small .logo-c{height:6mm;margin:0 0 2mm}
.spread .blogo{height:5.5mm;width:auto;display:block;margin-bottom:3mm;opacity:.95}
.titlep .foot-logo{position:absolute;left:0;right:0;bottom:16mm}
.cover .ed{display:inline-block;margin-top:3mm;border:1pt solid rgba(255,255,255,.5);border-radius:99px;padding:.6mm 4mm;font-size:9pt}
.cover.kid{background:linear-gradient(160deg,#3d8fca,#7fc4f0 60%,#ffe08a)}
.cover.kid h1{font-family:'Gowun Dodum',sans-serif;font-size:26pt}
h3.st{font-family:'Gowun Batang',serif;font-size:15pt;margin-bottom:3mm;color:var(--ink)}
.small{font-size:8.6pt;color:var(--ink2)}
.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding-left:8mm;margin-bottom:2mm}
.steps li::before{content:counter(s);position:absolute;left:0;top:.5mm;width:5.4mm;height:5.4mm;border-radius:50%;background:var(--brick);color:#fff;
  font-size:8pt;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.qr{display:flex;gap:4mm;align-items:center;background:#fbf3e7;border-radius:3mm;padding:3mm;margin-top:3mm}
.qr svg{width:24mm;height:24mm;flex:none;background:#fff;padding:1.4mm;border-radius:1.4mm}
.plan{width:100%;border-collapse:collapse;font-size:7.6pt;line-height:1.35}
.plan td{padding:.75mm 1mm;border-bottom:.4pt solid #eadbc3;vertical-align:top}
.plan td.d{white-space:nowrap;color:var(--ink3);width:16mm}
.plan td.r{white-space:nowrap;color:var(--brick);text-align:right}
.plan tr.wk td{background:#fbf3e7;color:var(--brick);font-weight:700;padding-top:1.2mm}
.plan tr.sun td.t{font-weight:700}
.wkno{font-family:'Gowun Batang',serif;font-size:40pt;font-weight:700;color:var(--brick);line-height:1}
.wkth{font-family:'Gowun Batang',serif;font-size:19pt;line-height:1.35;margin:3mm 0 4mm}
.wklist{margin-top:4mm;border-top:.6pt solid var(--line)}
.wklist div{display:flex;gap:2mm;padding:1.4mm 0;border-bottom:.4pt solid #eadbc3;font-size:8.8pt;line-height:1.45}
.wklist .d{color:var(--ink3);width:17mm;flex:none}.wklist .r{margin-left:auto;color:var(--brick);white-space:nowrap;padding-left:2mm}
.mv{margin:14mm 0 10mm;text-align:center}
.mv .q{font-family:'Gowun Batang',serif;font-size:15pt;line-height:1.8;font-weight:700}
.mv .r{color:var(--brick);font-weight:700;margin-top:3mm;font-size:10pt}
.lines{flex:1;min-height:20mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 8.4mm,#d9c7a8 8.4mm,#d9c7a8 calc(8.4mm + .5pt))}
.prompt{font-family:'Gowun Batang',serif;font-weight:700;margin-top:3mm}
.prompt+.lines{flex:none;height:26mm}
.vlist div{padding:1.6mm 0;border-bottom:.4pt solid #eadbc3}
.vlist .r{color:var(--brick);font-weight:700;font-size:8.4pt}
.vlist .t{font-family:'Gowun Batang',serif}
/* 어린이 쪽 */
.k .inner{font-family:'Gowun Dodum','Noto Sans KR',sans-serif;font-size:11.5pt;line-height:1.6;top:11mm;bottom:13mm;left:12mm;right:12mm}
.k .khd{display:flex;align-items:center;gap:3mm;margin-bottom:2.4mm}
.k .emo{width:13mm;height:13mm;border-radius:50%;background:#e8f3fb;display:flex;align-items:center;justify-content:center;font-size:19pt;flex:none}
.k .kd{font-size:8.5pt;color:var(--ink3)}
.k .kt{font-size:15.5pt;font-weight:700;line-height:1.3;font-family:'Noto Sans KR',sans-serif}
.k .kv{background:#e8f3fb;border-radius:3mm;padding:2.4mm 3.4mm;margin-bottom:2.4mm}
.k .kv .vt{font-family:'Gowun Batang',serif;font-weight:700}
.k .kv .vr{font-size:8.4pt;color:var(--sky);font-weight:700;margin-top:.8mm}
.k .box{border:.8pt solid #d8e6f0;border-radius:3mm;padding:2mm 3.2mm;margin-bottom:2.2mm}
.k .box b.h{display:block;font-family:'Noto Sans KR',sans-serif;font-size:8.6pt;color:var(--sky);margin-bottom:.4mm}
.k .box.sun{border-color:#f6dc9a;background:#fff9ea}.k .box.sun b.h{color:#b07d00}
.k .box.leaf{border-color:#cfe5c6;background:#f4faf1}.k .box.leaf b.h{color:var(--leaf)}
.k .ch{display:flex;flex-wrap:wrap;gap:1.4mm 4mm;margin-top:.6mm}
.k .ch span::before{content:'○ ';color:var(--sky)}
.k .chk::before{content:'□ ';font-family:'Noto Sans KR',sans-serif}
.k .draw{flex:1;min-height:15mm;border:1pt dashed #b9cfe0;border-radius:3mm;position:relative;margin-top:.4mm}
.k .draw small{position:absolute;left:3mm;top:2mm;font-size:8pt;color:#8aa9c0}
.k .foot{display:flex;align-items:center;gap:3mm;margin-top:2mm;font-size:8.4pt;color:var(--ink2)}
.k .foot .stamp{margin-left:auto;width:15mm;height:15mm;border:1pt dashed #e0a43a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7pt;color:#c08a2a;text-align:center;line-height:1.2}
.k .ans{position:absolute;left:0;right:0;bottom:5.2mm;text-align:center;font-size:6.8pt;color:#b8a98f;transform:rotate(180deg)}
.k.wkp .wkno{color:var(--sky)}
.k .stk{display:grid;grid-template-columns:repeat(7,1fr);gap:2mm;margin-top:4mm}
.k .stk div{aspect-ratio:1;border:1pt dashed #b9cfe0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7.5pt;color:#8aa9c0}
.cert{border:2pt solid var(--gold);border-radius:4mm;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8mm}
.cert h3{font-family:'Gowun Batang',serif;font-size:24pt;color:var(--brick);margin:3mm 0 6mm}
/* ---------- 인쇄소에 넘기는 파일 ----------
   ?press=1 : 내지만. 사방 3mm 도련(재단 여백)을 둔 154×216mm, 1쪽은 표지 대신 속표지
   ?cover=1&spine=10 : 표지 펼침면(뒷표지·책등·앞표지, 사방 3mm 도련) */
.titlep .inner{justify-content:center;text-align:center}
.titlep h1{font-family:'Gowun Batang',serif;font-size:24pt;line-height:1.4;color:var(--ink)}
.titlep .sub{color:var(--ink2);margin-top:3mm}
.titlep .ch{margin-top:30mm;font-family:'Gowun Batang',serif;font-weight:700;color:var(--brick)}
.spread{position:relative;height:216mm;overflow:hidden;color:#fff;background:linear-gradient(160deg,#3a2e22,#8f4531 60%,#b3593f)}
.spread.kid{background:linear-gradient(160deg,#3d8fca,#7fc4f0 60%,#ffe08a)}
.spread .face{position:absolute;top:0;height:216mm;width:151mm}
.spread .face .inner{left:17mm;right:17mm;top:25mm;bottom:25mm}
.spread .back{left:0}.spread .back .inner{left:17mm;right:14mm}
.spread .front{right:0}.spread .front .inner{left:14mm;right:17mm}
.spread .spine{position:absolute;top:0;height:216mm;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.12)}
.spread .spine span{writing-mode:vertical-rl;font-family:'Gowun Batang',serif;font-weight:700;white-space:nowrap;letter-spacing:.06em}
.spread .blurb{font-family:'Gowun Batang',serif;font-size:10pt;line-height:1.85}
.spread .bv{margin-top:8mm;padding:4mm;border:.8pt solid rgba(255,255,255,.5);border-radius:3mm;font-family:'Gowun Batang',serif;font-size:10pt;line-height:1.75}
.spread .bq{display:flex;gap:4mm;align-items:center;margin-top:auto;font-size:8.5pt;line-height:1.6}
.spread .bq svg{width:22mm;height:22mm;background:#fff;padding:1.4mm;border-radius:1.4mm;flex:none}
@media print{
  .press .slot{width:154mm!important;height:216mm!important;padding:3mm;box-sizing:border-box;overflow:hidden}
  .cover-only .slot{padding:0;overflow:hidden}
}
/* 확인용 표지: 재단선(빨강 점선)·책등선(파랑 점선)·안전선(초록 점선) */
.guide .gl{position:absolute;top:0;bottom:0;border-left:.5pt dashed;pointer-events:none}
.guide .gh{position:absolute;left:0;right:0;border-top:.5pt dashed;pointer-events:none}
.guide .gtag{position:absolute;font:600 6.5pt 'Noto Sans KR',sans-serif;background:#fff;color:#c00;padding:.3mm 1mm;border-radius:.6mm}
/* ---------- 인쇄 ---------- */
@page{size:148mm 210mm;margin:0}
@media print{
  html,body{background:#fff}
  .bar,.hint,#themeBtn{display:none!important}
  .stage{display:block;padding:0}
  .slot{display:block!important;width:auto!important;height:auto!important;box-shadow:none;border-radius:0;overflow:visible;break-after:page;page-break-after:always}
  .slot>.page{position:relative;transform:none!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar">
  <div class="row">
    <a class="back" href="word.html">← 말씀</a>
    <div class="ttl" id="bookTtl">처음 신앙, 매일 한 걸음</div>
    <div class="tabs" role="tablist">
      <button id="tabA" class="on" onclick="setBook('adult')">어른용</button>
      <button id="tabK" onclick="setBook('kids')">어린이</button>
    </div>
  </div>
  <div class="tools">
    <button onclick="flip(-1)" aria-label="앞 쪽">◀</button>
    <span class="pg" id="pgNo">–</span>
    <button onclick="flip(1)" aria-label="다음 쪽">▶</button>
    <select id="toc" onchange="jumpTo(this.value)" aria-label="목차"></select>
    <button onclick="goToday()">오늘</button>
    <span class="sp"></span>
    <button onclick="window.print()">🖨 인쇄</button>
    <a id="pdfLink" href="book/first-faith-adult.pdf" target="_blank" rel="noopener">PDF</a>
  </div>
</div>
<div class="stage" id="stage"><div class="loading" id="loading">성경 본문과 묵상을 책으로 엮는 중입니다…</div></div>
<div class="hint" id="hint">화면을 옆으로 밀거나 ◀ ▶ 를 눌러 넘겨 보세요. 앱의 ‘오늘의 말씀’과 같은 날 같은 말씀입니다.<br>휴대폰에서 글씨가 작으면 <a href="word-easy.html" style="color:inherit;font-weight:700">큰 글씨 화면</a>으로 같은 말씀을 보실 수 있습니다.</div>

<script src="word-data.js"></script>
<script src="word-config.js"></script>

<script>

var S=WORD_SERIES,BOOK='adult',pages=[],cur=0,spread=false,scale=1;

function esc(s){return wEsc(s)}
function dKo(ds){var p=ds.split('-'),w=WordData.weekday(ds);return (+p[1])+'월 '+(+p[2])+'일 '+(w==='주일'?'주일':w+'요일')}
function dShort(ds){var p=ds.split('-');return (+p[1])+'/'+(+p[2])+' ('+WordData.weekday(ds)+')'}
function days(){var out=[];for(var d=S.from;d<=S.to;d=WordData.shift(d,1))out.push(d);return out}
function info(ds){return WORD_PLAN[ds]}
function weekOf(ds){var w=null,n=0;S.weeks.forEach(function(x,i){if(x.mon<=ds){w=x;n=i+1}});return {w:w,n:n}}
function weekDays(w){return days().filter(function(d){return weekOf(d).w===w})}
function verseText(ref){return WordBible.one(ref,true)}
function bibleHtml(passage){
  return WordBible.verses(passage,true).map(function(v){return '<sup>'+v.v+'</sup>'+esc(v.t)}).join(' ');
}
function paras(t){return String(t).split(/\n\n+/).map(function(p){return '<p>'+esc(p)+'</p>'}).join('')}

/* ---------- 쪽 만들기 ---------- */
function pg(cls,html,opt){opt=opt||{};pages.push({cls:cls,html:html,date:opt.date||'',toc:opt.toc||'',fit:opt.fit||null,base:opt.base,min:opt.min})}
function filler(kind){
  if(BOOK==='kids')pg('k','<div class="inner"><h3 class="st" style="font-family:\'Gowun Dodum\'">🎨 나의 그림 · 나의 기도</h3><div class="draw"><small>마음껏 그리고 써 보아요</small></div></div>');
  else pg('','<div class="inner"><h3 class="st">'+(kind||'메모')+'</h3><div class="lines"></div></div>');
}
/* 펼친 면을 왼쪽(짝수 쪽)에서 시작하게 맞춘다 */
function evenStart(){if((pages.length+1)%2===1)filler('기도 노트')}

  pg('','<div class="inner"><h3 class="st">들어가며</h3><div class="med">'+

    '<p>하나님은 어떤 분이신지에서 시작해 사람과 죄, 예수님의 십자가와 부활, 은혜와 믿음, 말씀과 기도, 성령님, 교회와 성례, 섬김과 전도를 차례로 묵상하고, 대림절과 성탄으로 한 해를 마무리합니다.</p>'+
    '<p>어른들은 이 책으로, 젊은 세대는 앱으로, 어린이들은 어린이 묵상집으로 같은 날 같은 말씀을 읽습니다. 저녁 식탁에서 그날의 질문으로 이야기를 나누면 온 가족이 한 말씀 안에서 함께 자랄 것입니다.</p>'+
    '<p>날마다 펼치는 이 작은 책이 주님을 만나는 아침 자리가 되기를 기도합니다.</p></div>'+
    '<div class="rem" style="margin-top:auto"><span class="lab">이 책의 첫 말씀</span>“이것들이 아침마다 새로우니 주의 성실하심이 크시도소이다”<div style="font-size:8pt;font-weight:400;margin-top:1mm">예레미야애가 3:23</div></div>'+
    '<div class="small" style="text-align:right;margin-top:4mm">2026년 가을, 동산감리교회</div></div>',{toc:'들어가며'});
  pg('','<div class="inner"><h3 class="st">하루 15분, 이렇게 읽어요</h3><ol class="steps">'+
    '<li>조용히 기도로 시작합니다. ‘주님, 오늘 말씀으로 저를 만나 주세요.’</li>'+
    '<li>왼쪽 쪽의 성경 본문을 천천히, 할 수 있으면 소리 내어 읽습니다.</li>'+

    '<div class="qr">'+QR_ADULT+'<div><b>앱과 함께 보기</b><div class="small">같은 날 같은 말씀이 앱 ‘오늘의 말씀’에도 올라옵니다. 앱에서는 본문 듣기, 읽음 확인, 은혜 나눔을 할 수 있습니다. 교회 밖 누구나 이름 없이 읽을 수 있습니다.</div></div></div>'+

  S.weeks.forEach(function(w,i){
    var n=i+1,list=weekDays(w);
    evenStart();
    pg('','<div class="inner"><div class="wkno">'+n+'<span style="font-size:15pt">주</span></div><div class="wkth">'+esc(w.th)+'</div>'+

function WordExtra_shuffle(arr,key){
  var a=arr.slice(),h=2166136261;key=String(key);for(var i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619)}
  for(var j=a.length-1;j>0;j--){h^=h<<13;h^=h>>>17;h^=h<<5;var k=(h>>>0)%(j+1);var t=a[j];a[j]=a[k];a[k]=t}

}

function over(el){return el.scrollHeight>el.clientHeight+1}

/* 쪽 글자 크기 맞추기 — i 번째 쪽들만 (이미 맞춘 쪽은 건너뜀) */
var fitGen=0;
function fitPages(list){
  var st=document.getElementById('stage'),todo=list.filter(function(i){return pages[i]&&pages[i].fit&&!pages[i].fitted});
  if(!todo.length)return;
  st.classList.add('measure');

  st.classList.remove('measure');
}

function fitIdle(){
  var gen=++fitGen,i=0;
  var idle=window.requestIdleCallback||function(f){return setTimeout(function(){f({timeRemaining:function(){return 8}})},30)};
  (function step(dl){
    if(gen!==fitGen)return;
    var n=0;
    while(i<pages.length&&(n<2||dl.timeRemaining()>6)){fitPages([i]);i++;n++}
    if(i<pages.length)idle(step);
  })({timeRemaining:function(){return 0}});
}

function fitOne(slots,i){
  /* 한 쪽(또는 펼친 두 쪽)씩만 화면에 올려 재야 빠르다 — 전부 올리면 쪽마다 문서 전체를 다시 잰다 */
  var p=pages[i];
  {
    var on=[slots[i]];if(p.fit==='med'&&slots[i-1])on.push(slots[i-1]);
    on.forEach(function(s){s.classList.add('m')});
    var inner=slots[i].querySelector('.inner');
    if(p.fit==='med'){
      /* 묵상 쪽이 넘치면 질문·기도를 왼쪽(본문) 쪽 아래로 옮긴다 */
      var fs=p.base;setFs(inner,fs);
      var memo=inner.querySelector('.memo');
      if(over(inner)||hRaw(memo)<14*3.78){
        var left=slots[i-1]&&slots[i-1].querySelector('.slotq');
        var qa=inner.querySelector('.qwrap');
        if(left&&qa){left.appendChild(qa);fitText(slots[i-1].querySelector('.inner'),pages[i-1])}
      }
      while(over(inner)&&fs>p.min){fs-=.2;setFs(inner,fs)}
      if(hRaw(memo)<12*3.78)memo.classList.add('off');
    }else if(p.fit==='text')fitText(inner,p);
    else{var f=p.base;setFs(inner,f);while(over(inner)&&f>p.min){f-=.2;setFs(inner,f)}}
    on.forEach(function(s){s.classList.remove('m')});
  }
}

  fitGen++; // 앞 책의 남은 맞추기를 멈춘다
  /* 책을 엮는 동안 화면이 멈춘 것처럼 보이지 않게, 안내를 먼저 그린 뒤 엮는다 */
  document.getElementById('stage').innerHTML='<div class="loading">'+(b==='kids'?'어린이 묵상집':'어른 묵상집')+'을 엮는 중입니다…</div>';
  document.getElementById('pgNo').textContent='–';
  new Promise(function(r){requestAnimationFrame(function(){setTimeout(r,30)})}).then(render).then(function(){
    var i=keep?findDate(keep.replace(/r$/,'')):-1;
    if(i>=0)jumpTo(i);else{cur=0;show()}
  });
  if(location.hash.indexOf('kids')>=0&&b!=='kids')history.replaceState(null,'',location.pathname+location.search);
}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')flip(1);if(e.key==='ArrowLeft')flip(-1)});
(function(){var x0=null,y0=0;
  document.getElementById('stage').addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  document.getElementById('stage').addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy))flip(dx<0?1:-1);x0=null},{passive:true});
})();
var rT=null;window.addEventListener('resize',function(){clearTimeout(rT);rT=setTimeout(layout,150)});

/* 주소 뒤에 #2026-11-01 이 있으면 그날 쪽을, #kids 가 있으면 어린이 책을 연다 */
function start(){
  /* 「← 말씀」은 들어온 화면(어린이 앱·큰 글씨 등)으로 돌아간다 */
  try{var rf=new URL(document.referrer);if(rf.origin===location.origin&&/\/word(-[a-z]+)?\.html$/.test(rf.pathname))document.querySelector('.bar .back').href=rf.pathname.split('/').pop()}catch(e){}
  var h=decodeURIComponent(location.hash.slice(1)),q=new URLSearchParams(location.search);
  var b=q.get('v')||(h.indexOf('kids')>=0?'kids':'');
  if(!b){try{b=localStorage.getItem('dongsan_book_ver')||''}catch(e){}}
  BOOK=b==='kids'?'kids':'adult';
  document.getElementById('tabA').classList.toggle('on',BOOK==='adult');
  document.getElementById('tabK').classList.toggle('on',BOOK==='kids');
  document.getElementById('bookTtl').textContent=BOOK==='kids'?'어린이 말씀 묵상집':S.title;
  document.getElementById('pdfLink').href='book/first-faith-'+(BOOK==='kids'?'kids':'adult')+'.pdf';
  render().then(function(){
    if(COVER){imgsReady().then(function(){window.BOOK_READY=true});return}
    var m=h.match(/\d{4}-\d{2}-\d{2}/);
    if(m&&findDate(m[0])>=0)jumpTo(findDate(m[0]));
    else if(q.get('print')!=='1')goToday();
    imgsReady().then(function(){window.BOOK_READY=true});
  });
}
/* 성경 전체(4.8MB) 대신 묵상집에 쓰는 장만 담은 book-bible.js 를 먼저 읽는다 (scripts/build-book-bible.js 가 만든다).
   그 파일이 없거나, 묵상 본문이 바뀌어 빠진 장이 있으면 전체 성경을 읽는다. */
function loadScript(src){return new Promise(function(res){var s=document.createElement('script');s.src=src;s.onload=function(){res(true)};s.onerror=function(){res(false)};document.head.appendChild(s)})}
function bookBible(){
  if(new URLSearchParams(location.search).get('fullbible')==='1')return WordBible.load();
  return loadScript('book-bible.js').then(function(ok){
    if(ok&&typeof BIBLE_DATA!=='undefined'&&days().every(function(d){var x=info(d);return !x||WordBible.verses(x.passage).length}))return WordBible.load();
    try{delete window.BIBLE_DATA}catch(e){}window.BIBLE_DATA=undefined;
    return loadScript('dongsan_bible.js').then(function(){return WordBible.load()});
  });
}
Promise.all([bookBible(),document.fonts?document.fonts.ready:Promise.resolve()]).then(function(r){
  if(!r[0]){document.getElementById('loading').textContent='성경 본문을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';return}
  var fonts=['10pt "Gowun Batang"','bold 10pt "Gowun Batang"','10pt "Gowun Dodum"','10pt "Noto Sans KR"','bold 10pt "Noto Sans KR"'];
  return Promise.all(fonts.map(function(f){return document.fonts?document.fonts.load(f,'가나다').catch(function(){}):0})).then(start);
});
</script>
