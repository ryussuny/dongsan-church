<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>설교 보관함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brick:#1a2f5c; --brick2:#2f4d85; --brick-deep:#0f1b33;
  --moss:#b8862e; --moss2:#8f6a1f; --gold:#c9a24c;
  --cream:#f6f7fb; --paper:#ffffff; --warm:#eef1f7; --stone:#dde3ef;
  --text:#171b2a; --text2:#4c5468; --text3:#8891a5; --white:#ffffff; --border:#e1e5ef;
  --danger:#b3261e;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--text);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:0 1.75rem}

nav{position:sticky;top:0;z-index:300;background:rgba(251,243,231,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);height:70px;display:flex;align-items:center}
.nav-inner{width:100%;max-width:1120px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-mark{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(145deg,var(--brick2),var(--brick-deep));display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:'Gowun Batang',serif;font-weight:700;font-size:1.05rem}
.nav-name{font-family:'Gowun Batang',serif;font-size:1.05rem;font-weight:700;color:var(--brick-deep)}
.nav-sub{font-size:.66rem;color:var(--moss2);letter-spacing:.04em;margin-top:1px}
.nav-back{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.86rem;font-weight:700;color:var(--text2);padding:.55rem 1.1rem;border-radius:999px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-family:inherit}
.nav-back:hover{color:var(--brick-deep);border-color:var(--brick2)}

.hero{padding:3.4rem 0 1.6rem;text-align:center}
.hero h1{font-family:'Gowun Batang',serif;font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;margin-bottom:.6rem}
.hero p{color:var(--text2);font-size:.98rem}

/* ── 잠금 화면 ── */
.gate{max-width:430px;margin:2.4rem auto 5rem;background:var(--white);border:1px solid var(--border);border-radius:20px;padding:2.4rem 2rem;text-align:center}
.gate-ico{font-size:2.4rem;line-height:1}
.gate h2{font-family:'Gowun Batang',serif;font-size:1.25rem;font-weight:700;margin:.9rem 0 .5rem}
.gate p{font-size:.9rem;color:var(--text2);margin-bottom:1.5rem}
.gate input{width:100%;padding:.85rem 1.1rem;border-radius:12px;border:1px solid var(--border);background:var(--cream);font-family:inherit;font-size:.95rem;color:var(--text);text-align:center}
.gate input:focus{outline:none;border-color:var(--brick2);background:var(--white)}
.gate button{width:100%;margin-top:.7rem;padding:.85rem;border-radius:12px;border:none;background:var(--brick);color:var(--paper);font-family:inherit;font-size:.95rem;font-weight:700;cursor:pointer}
.gate button:hover{background:var(--brick-deep)}
.gate button:disabled{opacity:.55;cursor:default}
.gate-msg{margin-top:.9rem;font-size:.86rem;min-height:1.3em;color:var(--danger)}
.gate-msg.ok{color:var(--moss2)}

.tools{position:sticky;top:70px;z-index:200;background:var(--cream);padding:1.2rem 0;border-bottom:1px solid var(--border)}
.search{position:relative}
.search input{width:100%;padding:.85rem 1.1rem .85rem 2.6rem;border-radius:12px;border:1px solid var(--border);background:var(--white);font-family:inherit;font-size:.95rem;color:var(--text)}
.search input:focus{outline:none;border-color:var(--brick2)}
.search .ico{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);opacity:.5}

.list{padding:1.6rem 0 4rem;display:flex;flex-direction:column;gap:.9rem}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.4rem;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:0 10px 26px rgba(15,27,51,.1);border-color:var(--brick2)}
.card-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.card-date{font-size:.78rem;font-weight:700;color:var(--gold)}
.card-series{font-size:.78rem;color:var(--text3)}
.card-title{font-family:'Gowun Batang',serif;font-size:1.12rem;font-weight:700;color:var(--text);margin-top:.4rem}
.card-scripture{font-size:.86rem;color:var(--text3);margin-top:.3rem}
.card-body{display:none;margin-top:1rem;padding-top:1rem;border-top:1px dashed var(--border);font-size:.92rem;color:var(--text2);line-height:1.8}
.card.open .card-body{display:block}
.card-body h4{font-size:.82rem;color:var(--moss2);font-weight:700;margin:.9rem 0 .4rem}
.card-body h4:first-child{margin-top:0}
.card-body ul{padding-left:1.2rem}
.card-body li{margin-bottom:.35rem}
.empty{text-align:center;color:var(--text3);padding:3rem 1rem;font-size:.92rem;line-height:1.9}
.cats{display:flex;gap:.5rem;flex-wrap:wrap;margin:.9rem 0 .2rem}
.cat{font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;padding:.55rem 1.1rem;
  border-radius:999px;border:1px solid var(--border);background:var(--paper);color:var(--text2)}
.cat.active{background:var(--brick);border-color:var(--brick);color:#fff}
.hidden{display:none !important}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-mark">동</div>
      <div><div class="nav-name">동산감리교회</div><div class="nav-sub">DONGSAN METHODIST CHURCH</div></div>
    </a>
    <button type="button" class="nav-back hidden" id="lockBtn">🔒 다시 잠그기</button>
  </div>
</nav>

<header class="hero wrap">
  <h1>설교 보관함</h1>
  <p id="heroSub">담임목사 전용 — 암호를 넣어야 열립니다.</p>
</header>

<!-- ── 잠금 화면 ── -->
<div class="wrap" id="gateWrap">
  <div class="gate">
    <div class="gate-ico">🔒</div>
    <h2>암호를 넣어 주세요</h2>
    <p>지난 설교 기록은 암호로 잠겨 있습니다.<br>암호는 이 기기에만 잠시 기억되고, 홈페이지에는 저장되지 않습니다.</p>
    <input type="password" id="pass" placeholder="암호" autocomplete="current-password">
    <button type="button" id="openBtn">열기</button>
    <div class="gate-msg" id="gateMsg"></div>
  </div>
</div>

<!-- ── 보관함 ── -->
<div id="vaultWrap" class="hidden">
  <div class="tools wrap">
    <div class="search">
      <span class="ico">🔍</span>
      <input type="text" id="searchInput" placeholder="제목이나 본문(성경구절)으로 검색해보세요">
    </div>
  </div>
  <div class="wrap">
    <div class="cats" id="cats"></div>
    <div class="list" id="list"></div>
  </div>
</div>

<script>
// 설교 보관함은 sermons-archive.enc 에 암호로 잠겨 있다.
// 암호를 넣으면 브라우저 안에서 풀어 보여 준다 — 암호는 서버로 전송되지 않는다.
const SS_KEY = 'dongsan_vaultPass';
let vault = [], books = [], book = '';

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pack, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(pack.salt), iterations: pack.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(pack.iv) }, key, b64(pack.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function unlock(pass, quiet) {
  const msg = $('gateMsg'), btn = $('openBtn');
  if (!pass) { msg.textContent = '암호를 넣어 주세요.'; return false; }
  if (!crypto.subtle) { msg.textContent = '이 브라우저에서는 열 수 없습니다. 주소가 https 로 시작하는지 확인해 주세요.'; return false; }

  btn.disabled = true;
  if (!quiet) { msg.className = 'gate-msg ok'; msg.textContent = '여는 중…'; }

  let pack;
  try {
    const r = await fetch('sermons-archive.enc', { cache: 'no-store' });
    if (!r.ok) throw new Error('no file');
    pack = await r.json();
  } catch (e) {
    msg.className = 'gate-msg';
    msg.textContent = '잠긴 보관함 파일(sermons-archive.enc)이 없습니다.';
    btn.disabled = false;
    return false;
  }

  let db;
  try {
    db = await decrypt(pack, pass);
  } catch (e) {
    msg.className = 'gate-msg';
    msg.textContent = '암호가 맞지 않습니다.';
    btn.disabled = false;
    sessionStorage.removeItem(SS_KEY);
    return false;
  }

  vault = Array.isArray(db.sermons) ? db.sermons : [];
  books = (Array.isArray(db.categories) && db.categories.length)
    ? db.categories.map(c => c.key)
    : [...new Set(vault.map(x => x.book))];
  book = books[0] || '';

  try { sessionStorage.setItem(SS_KEY, pass); } catch (e) { /* 사생활 보호 모드 등 */ }

  $('gateWrap').classList.add('hidden');
  $('vaultWrap').classList.remove('hidden');
  $('lockBtn').classList.remove('hidden');
  $('heroSub').textContent = '지난 설교 기록 ' + vault.length + '편 · 담임목사 전용';
  btn.disabled = false;
  render();
  return true;
}

function lock() {
  sessionStorage.removeItem(SS_KEY);
  vault = []; books = []; book = '';
  $('pass').value = '';
  $('gateMsg').textContent = '';
  $('vaultWrap').classList.add('hidden');
  $('lockBtn').classList.add('hidden');
  $('gateWrap').classList.remove('hidden');
  $('heroSub').textContent = '담임목사 전용 — 암호를 넣어야 열립니다.';
}

function esc(s) { return String(s || '').replace(/</g, '&lt;'); }

function card(s, i) {
  const points = (s.keyPoints || []).filter(Boolean);
  const day = (s.date || '').replace(/-/g, '.');
  return `<div class="card" data-i="${i}">
    <div class="card-top">
      <span class="card-date">${esc(s.series || s.book || '')}</span>
      <span class="card-series">· ${esc(day)}${s.type ? ' · ' + esc(s.type) : ''}</span>
    </div>
    <div class="card-title">${esc(s.title || '제목 없음')}</div>
    <div class="card-scripture">📖 ${esc(s.scripture) || '본문 미기재'}</div>
    <div class="card-body">
      ${s.body ? `<h4>말씀</h4>${s.body.split(/\n{2,}/).map(t => `<p>${esc(t)}</p>`).join('')}` : ''}
      ${points.length ? `<h4>말씀의 흐름</h4><ul>${points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
      ${s.conclusion ? `<h4>맺는 말씀</h4><p>${esc(s.conclusion)}</p>` : ''}
      ${(s.hymns || []).length ? `<h4>찬송</h4><p>${(s.hymns || []).map(esc).join(' · ')}</p>` : ''}
      ${!s.body && !points.length && !s.conclusion ? `<p style="color:var(--text3)">제목과 본문만 남아 있는 기록입니다.</p>` : ''}
    </div>
  </div>`;
}

function renderCats() {
  const wrap = $('cats');
  wrap.style.display = books.length ? 'flex' : 'none';
  wrap.innerHTML = books
    .map(b => `<button type="button" class="cat${b === book ? ' active' : ''}" data-book="${esc(b)}">${esc(b)}</button>`)
    .join('');
  wrap.querySelectorAll('.cat').forEach(btn => {
    btn.addEventListener('click', () => { book = btn.dataset.book; render(); });
  });
}

function render() {
  const q = $('searchInput').value.trim().toLowerCase();
  const list = $('list');
  renderCats();
  const source = vault.filter(x => !books.length || x.book === book);
  const filtered = !q ? source : source.filter(x =>
    (x.title || '').toLowerCase().includes(q) ||
    (x.scripture || '').toLowerCase().includes(q)
  );
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">${q ? '검색 결과가 없습니다.' : esc(book) + ' 설교가 보관함에 없습니다.'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(card).join('');
  list.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('open'));
  });
}

$('openBtn').addEventListener('click', () => unlock($('pass').value));
$('pass').addEventListener('keydown', e => { if (e.key === 'Enter') unlock($('pass').value); });
$('lockBtn').addEventListener('click', lock);
$('searchInput').addEventListener('input', render);

// 같은 탭에서 새로고침하면 다시 묻지 않는다. 탭을 닫으면 지워진다.
const saved = (() => { try { return sessionStorage.getItem(SS_KEY); } catch (e) { return null; } })();
if (saved) unlock(saved, true);
</script>
</body>
</html>
