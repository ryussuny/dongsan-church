<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="robots" content="noindex,nofollow">
<title>어린이 나눔 보기 — 동산감리교회</title>
<meta name="theme-color" content="#4aa3df">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(170deg,#eaf4fc,#f7fbff);
  min-height:100vh;padding:24px 18px 48px;color:#26364a;word-break:keep-all}
.wrap{width:100%;max-width:560px;margin:0 auto}
.top{text-align:center;margin-bottom:20px}
.top .emo{font-size:34px}
h1{font-family:'Gowun Batang',serif;font-size:24px;margin:6px 0 4px}
.sub{font-size:12.5px;color:#6b7d92;line-height:1.8}

.lock{background:#fff;border:1px solid #d5e5f3;border-radius:16px;padding:20px 18px;text-align:center;
  box-shadow:0 6px 18px rgba(74,163,223,.12)}
.lock p{font-size:13px;color:#5a6e84;line-height:1.9;margin-bottom:14px}
.lock input{width:100%;padding:12px 14px;border:1px solid #cfe1f1;border-radius:12px;font-size:16px;
  font-family:inherit;text-align:center;outline:none;background:#f7fbff}
.lock input:focus{border-color:#4aa3df}
.lock button{margin-top:10px;width:100%;padding:12px;border:none;border-radius:12px;cursor:pointer;
  background:linear-gradient(135deg,#4aa3df,#7fc4f0);color:#fff;font-size:15px;font-weight:700;font-family:inherit}
.err{color:#c0392b;font-size:12.5px;margin-top:10px;line-height:1.7}

.bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bar select,.bar button{padding:8px 12px;border:1px solid #cfe1f1;border-radius:10px;background:#fff;
  font-family:inherit;font-size:12.5px;color:#26364a;cursor:pointer}
.bar .count{margin-left:auto;font-size:12px;color:#6b7d92}

.day{font-family:'Gowun Batang',serif;font-size:15px;font-weight:700;color:#2f6f9e;
  margin:18px 0 8px;padding-left:2px}
.note{background:#fff;border:1px solid #dcebf7;border-radius:14px;padding:14px 16px;margin-bottom:10px}
.note .head{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.note .who{font-weight:700;font-size:14.5px;color:#1f4f74}
.note .mood{font-size:18px}
.note .text{font-size:14px;line-height:1.9;color:#33465c;white-space:pre-wrap}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;padding:3px 9px;border-radius:999px;background:#eef6fd;color:#3d7ba8;font-weight:500}
.tag.ok{background:#e9f7ee;color:#2d7d46}
.empty{text-align:center;color:#7b8ca0;font-size:13.5px;line-height:2;padding:30px 0}
.foot{text-align:center;font-size:11.5px;color:#8b9cae;margin-top:26px;line-height:2}
.foot a{color:#2f6f9e;font-weight:700;text-decoration:none}
.foot .warn{color:#a9744a}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="emo">🧒</div>
    <h1>어린이 나눔 보기</h1>
    <div class="sub">아이들이 오늘의 말씀을 읽고 적어 둔 글입니다.<br>홈페이지에는 나가지 않고, 이 자리에서만 보입니다.</div>
  </div>

  <!-- 잠금 화면 -->
  <div class="lock" id="lock">
    <p>열쇠말을 넣어 주세요.</p>
    <input id="key" type="password" inputmode="text" autocomplete="off" placeholder="열쇠말" aria-label="열쇠말">
    <button id="go">열기</button>
    <div class="err" id="err" hidden></div>
  </div>

  <!-- 목록 -->
  <div id="view" hidden>
    <div class="bar">
      <select id="who"><option value="">모든 어린이</option></select>
      <button id="reload">새로 받기</button>
      <button id="lockBtn">잠그기</button>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </div>

  <div class="foot">
    <span class="warn">아이들의 글입니다. 열쇠말과 이 주소는 나누지 말아 주세요.</span><br>
    <a href="word.html">오늘의 말씀으로</a> · <a href="index.html">교회 홈페이지</a>
  </div>
</div>

<script src="word-config.js"></script>
<script>
(function () {
  'use strict';

  var API  = (typeof WORD_API === 'string' ? WORD_API : '').trim();
  var SAVE = 'dongsan_kids_key';          /* 열쇠말은 이 기기에만 남는다 */

  var lock = document.getElementById('lock');
  var view = document.getElementById('view');
  var keyIn = document.getElementById('key');
  var err = document.getElementById('err');
  var list = document.getElementById('list');
  var who = document.getElementById('who');
  var count = document.getElementById('count');

  var rows = [];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function say(msg) { err.textContent = msg; err.hidden = !msg; }

  function saved() { try { return localStorage.getItem(SAVE) || ''; } catch (e) { return ''; } }
  function keep(k) { try { localStorage.setItem(SAVE, k); } catch (e) {} }
  function forget() { try { localStorage.removeItem(SAVE); } catch (e) {} }

  /* 2026-08-27 → 8월 27일 (목) */
  var DAY = ['일', '월', '화', '수', '목', '금', '토'];
  function prettyDay(d) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
    if (!m) return d || '';
    var dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return Number(m[2]) + '월 ' + Number(m[3]) + '일 (' + DAY[dt.getDay()] + ')';
  }

  function paint() {
    var pick = who.value;
    var show = pick ? rows.filter(function (r) { return r.name === pick; }) : rows;

    count.textContent = show.length ? show.length + '편' : '';

    if (!show.length) {
      list.innerHTML = '<div class="empty">아직 올라온 글이 없습니다.</div>';
      return;
    }

    var html = '', day = '';
    show.forEach(function (r) {
      if (r.date !== day) {
        day = r.date;
        html += '<div class="day">' + esc(prettyDay(day)) + '</div>';
      }
      var tags = '';
      if (r.quizOk)    tags += '<span class="tag ok">퀴즈 맞힘</span>';
      if (r.missionOk) tags += '<span class="tag ok">미션 함</span>';
      if (r.parent)    tags += '<span class="tag">보호자 ' + esc(r.parent) + '</span>';

      html += '<div class="note">'
            +   '<div class="head">'
            +     '<span class="who">' + esc(r.name) + '</span>'
            +     (r.mood ? '<span class="mood">' + esc(r.mood) + '</span>' : '')
            +   '</div>'
            +   '<div class="text">' + esc(r.text) + '</div>'
            +   (tags ? '<div class="tags">' + tags + '</div>' : '')
            + '</div>';
    });
    list.innerHTML = html;
  }

  function fillWho() {
    var seen = {}, names = [];
    rows.forEach(function (r) { if (r.name && !seen[r.name]) { seen[r.name] = 1; names.push(r.name); } });
    names.sort(function (a, b) { return a.localeCompare(b, 'ko'); });
    who.innerHTML = '<option value="">모든 어린이</option>'
      + names.map(function (n) { return '<option>' + esc(n) + '</option>'; }).join('');
  }

  function load(key, quiet) {
    if (!API) { say('나눔터 주소가 아직 연결되지 않았습니다.'); return; }
    if (!quiet) say('');

    fetch(API + '?action=kids&key=' + encodeURIComponent(key) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) {
          forget();
          lock.hidden = false; view.hidden = true;
          say((d && d.error) || '글을 받아 오지 못했습니다.');
          return;
        }
        keep(key);
        rows = d.shares || [];
        lock.hidden = true; view.hidden = false;
        fillWho();
        paint();
      })
      .catch(function () {
        say('인터넷이 잠시 끊긴 것 같습니다. 다시 눌러 주세요.');
      });
  }

  document.getElementById('go').addEventListener('click', function () {
    var k = keyIn.value.trim();
    if (!k) { say('열쇠말을 넣어 주세요.'); return; }
    load(k);
  });
  keyIn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('go').click();
  });

  who.addEventListener('change', paint);
  document.getElementById('reload').addEventListener('click', function () { load(saved(), true); });
  document.getElementById('lockBtn').addEventListener('click', function () {
    forget(); rows = []; list.innerHTML = '';
    view.hidden = true; lock.hidden = false; keyIn.value = ''; say('');
  });

  /* 전에 넣어 둔 열쇠말이 있으면 바로 연다 */
  if (saved()) load(saved(), true);
})();
</script>
</body></html>
