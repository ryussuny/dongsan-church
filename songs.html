<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="동산 말씀">
<meta name="mobile-web-app-capable" content="yes">
<title>찬양 — 동산감리교회</title>
<meta name="description" content="동산감리교회 찬양. 직접 만든 곡과 찬송가, 성가대 특송을 들으실 수 있습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --brick:#1a2f5c; --brick2:#2f4d85; --brick-deep:#0f1b33;
  --moss:#b8862e; --moss2:#8f6a1f; --gold:#c9a24c;
  --cream:#f6f7fb; --paper:#ffffff; --warm:#eef1f7; --stone:#dde3ef;
  --text:#171b2a; --text2:#4c5468; --text3:#8891a5; --white:#ffffff; --border:#e1e5ef;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--text);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:17px;line-height:1.7;overflow-x:hidden;word-break:keep-all;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 1.75rem}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease}
.reveal.on{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}

nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(13,21,38,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.08);height:70px;display:flex;align-items:center;transition:box-shadow .3s}
nav.scrolled{box-shadow:0 4px 24px rgba(6,10,20,.35)}
.nav-inner{width:100%;max-width:1120px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-mark{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(145deg,var(--gold),var(--moss2));display:flex;align-items:center;justify-content:center;color:var(--brick-deep);font-family:'Gowun Batang',serif;font-weight:700;font-size:1.05rem;box-shadow:0 3px 10px rgba(6,10,20,.4)}
.nav-name{font-family:'Gowun Batang',serif;font-size:1.05rem;font-weight:700;color:#f2f4f9}
.nav-sub{font-size:.66rem;color:var(--gold);letter-spacing:.04em;margin-top:1px}
.nav-back{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.86rem;font-weight:700;color:#c7cede;padding:.55rem 1.1rem;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06)}
.nav-back:hover{color:var(--gold);border-color:var(--gold)}

.hero{position:relative;padding:9rem 0 4rem;text-align:center;background:radial-gradient(ellipse 70% 60% at 85% 0%,rgba(201,162,76,.16),transparent 60%),radial-gradient(ellipse 80% 60% at 10% 100%,rgba(47,77,133,.35),transparent 60%),linear-gradient(160deg,var(--brick) 0%,var(--brick-deep) 100%)}
.hero-eyebrow{display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:.5rem 1.1rem;font-size:.82rem;font-weight:700;color:#e7ebf5;margin-bottom:1.6rem}
h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(2rem,5vw,3rem);line-height:1.35;color:#f7f8fb;margin-bottom:1.1rem}
h1 em{font-style:normal;color:var(--gold)}
.hero p{color:#aab3cc;max-width:520px;margin:0 auto;font-size:1.04rem}

section{padding:3.5rem 0}

/* 아직 올린 곡이 없을 때 — 빈 화면을 그냥 두지 않는다 */
.empty{background:var(--white);border:1px solid var(--border);border-radius:18px;padding:2.6rem 2rem;text-align:center}
.empty .ico{font-size:2.4rem;margin-bottom:.9rem}
.empty h2{font-family:'Gowun Batang',serif;font-size:1.25rem;color:var(--brick-deep);margin-bottom:.7rem}
.empty p{font-size:.92rem;color:var(--text2);line-height:1.9}
.empty code{background:var(--warm);border-radius:6px;padding:.1rem .45rem;font-size:.86em;color:var(--brick-deep)}

.cat{margin-bottom:2.6rem}
.cat-h{display:flex;align-items:baseline;gap:.7rem;margin-bottom:1.1rem;padding-bottom:.7rem;border-bottom:2px solid var(--stone)}
.cat-h b{font-family:'Gowun Batang',serif;font-size:1.4rem;color:var(--brick-deep)}
.cat-h span{font-size:.82rem;color:var(--text3)}

.song{display:flex;align-items:center;gap:.95rem;background:var(--white);border:1px solid var(--border);
  border-radius:14px;padding:.85rem 1rem;margin-bottom:.6rem;transition:border-color .2s,box-shadow .2s}
.song.playing{border-color:var(--gold);box-shadow:0 4px 18px rgba(201,162,76,.18)}
.play{flex:none;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,var(--brick2),var(--brick-deep));color:#fff;font-size:15px;
  display:flex;align-items:center;justify-content:center;padding-left:2px}
.song.playing .play{background:linear-gradient(145deg,var(--gold),var(--moss2));color:var(--brick-deep);padding-left:0}
.play:hover{filter:brightness(1.12)}
.si{flex:1;min-width:0}
.si .t{font-weight:700;font-size:.98rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .m{font-size:.78rem;color:var(--text3);margin-top:1px}
.si .m i{font-style:normal}
.dl{flex:none;font-size:.75rem;color:var(--text3);border:1px solid var(--border);border-radius:999px;padding:.28rem .7rem}
.dl:hover{color:var(--brick-deep);border-color:var(--gold)}

/* 아래에 붙어 따라다니는 재생 막대 */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:200;background:rgba(13,21,38,.96);backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,.1);padding:.8rem 0;transform:translateY(110%);transition:transform .3s}
.bar.on{transform:none}
.bar-in{max-width:900px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center;gap:.9rem}
.bar .n{flex:1;min-width:0;color:#f2f4f9;font-size:.9rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .n small{display:block;font-weight:400;font-size:.74rem;color:#8b93b0;margin-top:1px}
.bar audio{flex:2;min-width:0;height:38px}
.bar .x{flex:none;background:none;border:none;color:#8b93b0;font-size:1.15rem;cursor:pointer;padding:.2rem .4rem}
.bar .x:hover{color:#fff}
@media(max-width:640px){
  .bar-in{flex-wrap:wrap;gap:.5rem}
  .bar .n{flex:1 1 100%;order:1}
  .bar audio{flex:1;order:2}
  .bar .x{order:3}
}
body.bar-on{padding-bottom:120px}

.note{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:1.3rem 1.4rem;margin-top:.5rem;
  font-size:.85rem;color:var(--text2);line-height:1.9}
.note b{color:var(--brick-deep)}

footer{background:#0d1526;color:#c7cede;padding:2.6rem 0;text-align:center;font-size:.82rem}
footer a{color:#8a93b0}
footer a:hover{color:var(--paper)}
</style>
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-mark">동</div>
      <div><div class="nav-name">동산감리교회</div><div class="nav-sub">DONGSAN METHODIST CHURCH</div></div>
    </a>
    <a href="index.html" class="nav-back">← 홈으로</a>
  </div>
</nav>

<header class="hero">
  <div class="wrap">
    <div class="hero-eyebrow">🎵 PRAISE</div>
    <h1>주께 드리는<br><em>우리의 찬양</em></h1>
    <p>직접 만든 곡과 찬송가, 성가대의 특송을 함께 들으실 수 있습니다.</p>
  </div>
</header>

<section>
  <div class="wrap">
    <div id="list"></div>
  </div>
</section>

<div class="bar" id="bar">
  <div class="bar-in">
    <div class="n" id="barName">—</div>
    <audio id="player" controls preload="none"></audio>
    <button class="x" id="barClose" aria-label="닫기">✕</button>
  </div>
</div>

<footer>
  <div class="wrap">동산감리교회 · 강원도 태백시 계산 4길 25 · <a href="index.html">홈으로 돌아가기</a></div>
</footer>

<script>
(function(){
  var listEl=document.getElementById('list');
  var bar=document.getElementById('bar'),player=document.getElementById('player'),
      barName=document.getElementById('barName');
  var flat=[],cur=-1;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

  function empty(){
    listEl.innerHTML=
      '<div class="empty reveal on"><div class="ico">🎼</div>'+
      '<h2>아직 올린 찬양이 없습니다</h2>'+
      '<p><code>songs</code> 폴더에 노래 파일을 넣으면 이 자리에 저절로 올라옵니다.<br>'+
      '넣는 법은 그 폴더의 <b>README</b> 에 적어 두었습니다.</p></div>';
  }

  /* 날짜·만든이는 있을 때만 적는다 */
  function meta(s){
    var p=[];
    if(s.by) p.push(esc(s.by));
    if(s.date){var d=s.date.split('-');p.push(Number(d[1])+'월 '+Number(d[2])+'일');}
    if(s.mb) p.push(s.mb+'MB');
    return p.join(' · ');
  }

  function render(cats){
    var html='',i=0;
    cats.forEach(function(c){
      html+='<div class="cat reveal"><div class="cat-h"><b>'+esc(c.label)+'</b>'+
            '<span>'+c.songs.length+'곡</span></div>';
      c.songs.forEach(function(s){
        flat.push(s);
        html+='<div class="song" data-i="'+i+'">'+
          '<button class="play" aria-label="듣기">▶</button>'+
          '<div class="si"><div class="t">'+esc(s.title)+'</div>'+
          '<div class="m">'+meta(s)+'</div></div>'+
          '<a class="dl" href="'+esc(s.src)+'" download>받기</a></div>';
        i++;
      });
      html+='</div>';
    });
    html+='<div class="note reveal">한 곡이 끝나면 <b>다음 곡</b>이 이어서 나옵니다. '+
          '아래 막대에서 멈추거나 닫으실 수 있습니다.</div>';
    listEl.innerHTML=html;

    listEl.addEventListener('click',function(e){
      var row=e.target.closest('.song'); if(!row) return;
      if(e.target.closest('.dl')) return;            /* 받기는 그대로 둔다 */
      var i=Number(row.dataset.i);
      if(i===cur && !player.paused){ player.pause(); return; }
      if(i===cur){ player.play(); return; }
      play(i);
    });
  }

  function mark(){
    [].forEach.call(document.querySelectorAll('.song'),function(el){
      var on=Number(el.dataset.i)===cur;
      el.classList.toggle('playing',on);
      el.querySelector('.play').textContent=(on&&!player.paused)?'❚❚':'▶';
    });
  }

  function play(i){
    var s=flat[i]; if(!s) return;
    cur=i;
    player.src=s.src;
    barName.innerHTML=esc(s.title)+(meta(s)?'<small>'+meta(s)+'</small>':'');
    bar.classList.add('on'); document.body.classList.add('bar-on');
    player.play().catch(function(){});           /* 자동재생을 막는 브라우저도 있다 */
    mark();
  }

  player.addEventListener('play',mark);
  player.addEventListener('pause',mark);
  player.addEventListener('ended',function(){
    if(cur+1<flat.length) play(cur+1); else mark();
  });
  document.getElementById('barClose').addEventListener('click',function(){
    player.pause(); bar.classList.remove('on'); document.body.classList.remove('bar-on');
    cur=-1; mark();
  });

  fetch('songs.json?'+Date.now())
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(d){
      var cats=(d&&d.categories||[]).filter(function(c){return c.songs&&c.songs.length});
      if(!cats.length){ empty(); return; }
      render(cats);
      var io=new IntersectionObserver(function(es){
        es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('on'); io.unobserve(e.target); } });
      },{threshold:.08});
      document.querySelectorAll('.reveal').forEach(function(el){ io.observe(el); });
    })
    .catch(empty);                                /* 목록 파일이 아직 없어도 화면은 멀쩡하다 */

  addEventListener('scroll',function(){
    document.getElementById('nav').classList.toggle('scrolled',scrollY>10);
  },{passive:true});
})();
</script>

</body>
</html>
