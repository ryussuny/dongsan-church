name: 설교문 자동 요약·등록

# sermons-src 폴더에 설교 원고(.docx/.txt/.md)를 올리면
# 자동으로 요약을 만들어 sermons.json 에 등록하고 홈페이지에 반영한다.
on:
  push:
    paths:
      - 'sermons-src/**'
      - 'scripts/import-sermons.js'
      - 'sermon-summary.js'
  workflow_dispatch:          # 손으로도 돌릴 수 있게 둔다

permissions:
  contents: write

concurrency:
  group: sermon-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 설교문 읽어 요약 등록
        # ANTHROPIC_API_KEY 를 저장소 Secrets 에 넣어 두면 AI 가 문장을 다듬는다.
        # 없으면 원고의 짜임(제목/본문/본론/결론)을 읽는 규칙 기반 요약만 쓴다.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/import-sermons.js

      - name: 설교 본문 성경 구절 뽑기
        run: node scripts/build-sermon-verses.js

      - name: 등록 결과 게시
        run: |
          git config user.name  "동산교회 말씀봇"
          git config user.email "actions@github.com"
          if git diff --quiet -- sermons.json sermon-verses.json; then
            echo "새로 등록된 설교 없음 — 게시 생략"
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./sermons.json').sermons.length)")
          git add sermons.json sermon-verses.json
          git commit -m "설교 자동 등록 (전체 ${COUNT}편)"
          for i in 1 2 3 4; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "재시도 ${i}..."; sleep $((2 ** i))
          done
          exit 1
