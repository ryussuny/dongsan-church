name: 오늘의 말씀 자동 게시

# 매일 아침 5시(한국시간)에 그날의 말씀 페이지를 만들어 홈페이지에 올린다.
# GitHub 예약 실행은 UTC 기준이라 19:41 UTC = 다음 날 04:41 KST 이다.
#
# 왜 정각을 피하고 세 번이나 거는가
#   깃허브의 예약 실행은 "그 시각에 반드시"가 아니라 "그 시각 이후 여유가 생기면"이다.
#   정각(0분)은 온 세상이 몰리는 시간이라 줄이 길다. 실제로 0 20 * * * 로 두었더니
#   25분쯤 늦던 것이 2시간 50분, 다시 8시간 5분까지 밀려 그날 새벽 게시를 놓쳤다.
#
#   그래서 (1) 정각을 피해 어중간한 분에 걸고
#         (2) 5시보다 조금 일찍 걸어 웬만한 밀림은 5시 안에 들어오게 하고
#         (3) 혹시 첫 번째가 크게 밀리거나 걸러도 뒤의 두 번이 받아 주게 했다.
#
#   여러 번 돌아도 탈이 없다 — 같은 날을 다시 만들면 파일이 한 글자도
#   달라지지 않아 "변경 없음"으로 그냥 끝난다(아래 게시 단계 참고).
on:
  schedule:
    - cron: '41 19 * * *'   # 04:41 KST — 본 게시
    - cron: '23 21 * * *'   # 06:23 KST — 첫 번째가 밀렸을 때 받는 그물
    - cron: '11 0 * * *'    # 09:11 KST — 마지막 그물
  workflow_dispatch:        # 필요할 때 손으로도 실행할 수 있게 둔다

permissions:
  contents: write

concurrency:
  group: daily-word
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 오늘의 말씀 페이지 생성
        run: node scripts/build-today.js

      - name: 지난 말씀 모음 갱신
        run: node scripts/build-word-archive.js

      # 조용히 어긋나는 것이 가장 무섭다. 만들어진 날짜가 오늘이 아니면
      # 여기서 빨갛게 세운다 — 아무 일 없었던 듯 지나가지 않게.
      - name: 오늘 날짜로 만들어졌는지 확인
        run: |
          WANT=$(date -u -d '+9 hours' +%Y-%m-%d)
          GOT=$(node -e "process.stdout.write(require('./word-today.json').date)")
          if [ "$WANT" != "$GOT" ]; then
            echo "::error::오늘의 말씀 날짜가 어긋납니다 — 오늘은 ${WANT} 인데 ${GOT} 로 만들어졌습니다"
            exit 1
          fi
          echo "확인 — ${GOT} 로 만들어졌습니다"

      - name: 변경 사항 게시
        run: |
          git config user.name  "동산교회 말씀봇"
          git config user.email "actions@github.com"
          if git diff --quiet -- today.html word-today.json word-archive.json; then
            echo "오늘의 말씀에 변경 없음 — 게시 생략"
            exit 0
          fi
          TODAY=$(date -u -d '+9 hours' +%Y-%m-%d)
          git add today.html word-today.json word-archive.json
          git commit -m "오늘의 말씀 자동 게시 ${TODAY}"
          for i in 1 2 3 4; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            echo "재시도 ${i}..."; sleep $((2 ** i))
          done
          exit 1
