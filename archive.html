<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --brick:#b3593f; --brick2:#c96f52; --brick-deep:#8f4531;
  --moss:#7c9a68; --moss2:#5f7d4d; --gold:#c99a3f;
  --cream:#fbf3e7; --paper:#fffaf2; --warm:#f4e6d3; --stone:#e7d6bd;
  --text:#3a2e22; --text2:#6b5a45; --text3:#95836b; --white:#ffffff; --border:#e0cca9;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--text);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:0 1.75rem}

nav{position:sticky;top:0;z-index:300;background:rgba(251,243,231,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);height:70px;display:flex;align-items:center}
.nav-inner{width:100%;max-width:1120px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-mark{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(145deg,var(--brick2),var(--brick-deep));display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:'Gowun Batang',serif;font-weight:700;font-size:1.05rem}
.nav-name{font-family:'Gowun Batang',serif;font-size:1.05rem;font-weight:700;color:var(--brick-deep)}
.nav-sub{font-size:.66rem;color:var(--moss2);letter-spacing:.04em;margin-top:1px}
.nav-back{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.86rem;font-weight:700;color:var(--text2);padding:.55rem 1.1rem;border-radius:999px;border:1px solid var(--border);background:var(--white)}
.nav-back:hover{color:var(--brick-deep);border-color:var(--brick2)}

.hero{padding:3.4rem 0 1.6rem;text-align:center}
.hero h1{font-family:'Gowun Batang',serif;font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;margin-bottom:.6rem}
.hero p{color:var(--text2);font-size:.98rem}

.tools{position:sticky;top:70px;z-index:200;background:var(--cream);padding:1.2rem 0;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:.6rem;margin-bottom:.9rem}
.tab{flex:1;text-align:center;padding:.75rem;border-radius:12px;border:1px solid var(--border);background:var(--white);font-weight:700;font-size:.92rem;color:var(--text2);cursor:pointer}
.tab.active{background:var(--brick);color:var(--paper);border-color:var(--brick)}
.search{position:relative}
.search input{width:100%;padding:.85rem 1.1rem .85rem 2.6rem;border-radius:12px;border:1px solid var(--border);background:var(--white);font-family:inherit;font-size:.95rem;color:var(--text)}
.search input:focus{outline:none;border-color:var(--brick2)}
.search .ico{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);opacity:.5}

.list{padding:1.6rem 0 4rem;display:flex;flex-direction:column;gap:.9rem}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.4rem;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:0 10px 26px rgba(143,69,49,.1);border-color:var(--brick2)}
.card-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.card-date{font-size:.78rem;font-weight:700;color:var(--gold)}
.card-series{font-size:.78rem;color:var(--text3)}
.card-title{font-family:'Gowun Batang',serif;font-size:1.12rem;font-weight:700;color:var(--text);margin-top:.4rem}
.card-scripture{font-size:.86rem;color:var(--text3);margin-top:.3rem}
.card-body{display:none;margin-top:1rem;padding-top:1rem;border-top:1px dashed var(--border);font-size:.92rem;color:var(--text2);line-height:1.8}
.card.open .card-body{display:block}
.card-body h4{font-size:.82rem;color:var(--moss2);font-weight:700;margin:.9rem 0 .4rem}
.card-body h4:first-child{margin-top:0}
.card-body ul{padding-left:1.2rem}
.card-body li{margin-bottom:.35rem}
.empty{text-align:center;color:var(--text3);padding:3rem 1rem;font-size:.92rem}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="church-home-new.html" class="nav-logo">
      <div class="nav-mark">동</div>
      <div><div class="nav-name">동산감리교회</div><div class="nav-sub">DONGSAN METHODIST CHURCH</div></div>
    </a>
    <a href="church-home-new.html" class="nav-back">← 홈으로</a>
  </div>
</nav>

<header class="hero wrap">
  <h1>설교·말씀 아카이브</h1>
  <p>지난 설교와 오늘의 말씀을 한눈에 찾아보세요.</p>
</header>

<div class="tools wrap">
  <div class="tabs">
    <div class="tab active" id="tabSermon">📖 설교말씀</div>
    <div class="tab" id="tabDaily">✝ 오늘의 말씀</div>
  </div>
  <div class="search">
    <span class="ico">🔍</span>
    <input type="text" id="searchInput" placeholder="제목이나 본문(성경구절)으로 검색해보세요">
  </div>
</div>

<div class="wrap">
  <div class="list" id="list"></div>
</div>

<script>
// 로컬 서버에서는 실시간 API로, 공개(정적) 사이트에서는 게시 시점에 구워 넣은
// window.__SERMONS__ / window.__DAILYWORDS__ 로 자동 대체된다 (publish-homepage.js).
window.__SERMONS__ = window.__SERMONS__ || [];
window.__DAILYWORDS__ = window.__DAILYWORDS__ || [];

let sermons = [];
let dailywords = [];
let tab = 'sermon';

async function loadData() {
  try {
    const r = await fetch('/api/public/sermons');
    sermons = r.ok ? await r.json() : window.__SERMONS__;
  } catch (e) { sermons = window.__SERMONS__; }
  if (!Array.isArray(sermons) || !sermons.length) sermons = window.__SERMONS__;

  try {
    const r = await fetch('/api/public/dailywords');
    dailywords = r.ok ? await r.json() : window.__DAILYWORDS__;
  } catch (e) { dailywords = window.__DAILYWORDS__; }
  if (!Array.isArray(dailywords) || !dailywords.length) dailywords = window.__DAILYWORDS__;

  render();
}

function esc(s) { return String(s || '').replace(/</g, '&lt;'); }

function sermonCard(s, i) {
  const points = (s.keyPoints || []).filter(Boolean);
  return `<div class="card" data-i="${i}">
    <div class="card-top">
      <span class="card-date">${esc((s.date || '').replace(/-/g, '.'))}</span>
      ${s.series ? `<span class="card-series">· ${esc(s.series)}</span>` : ''}
    </div>
    <div class="card-title">${esc(s.title || '제목 없음')}</div>
    <div class="card-scripture">📖 ${esc(s.scripture) || '본문 미기재'}</div>
    <div class="card-body">
      ${points.length ? `<h4>말씀의 흐름</h4><ul>${points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
      ${s.conclusion ? `<h4>맺는 말씀</h4><p>${esc(s.conclusion)}</p>` : ''}
      ${(s.hymns || []).length ? `<h4>찬송</h4><p>${(s.hymns || []).map(esc).join(' · ')}</p>` : ''}
    </div>
  </div>`;
}

function dailyCard(d, i) {
  return `<div class="card" data-i="${i}">
    <div class="card-top"><span class="card-date">${esc((d.date || '').replace(/-/g, '.'))}</span></div>
    <div class="card-title">${esc(d.title || '오늘의 말씀')}</div>
    <div class="card-scripture">📖 ${esc(d.passage) || ''}</div>
    <div class="card-body">
      ${d.scripture ? `<h4>말씀</h4><p>${esc(d.scripture)}</p>` : ''}
      ${d.meditation ? `<h4>묵상</h4><p>${esc(d.meditation)}</p>` : ''}
      ${d.practice ? `<h4>오늘의 실천</h4><p>${esc(d.practice)}</p>` : ''}
      ${d.prayer ? `<h4>기도</h4><p>${esc(d.prayer)}</p>` : ''}
      ${d.hymnTitle ? `<h4>찬송</h4><p>${esc(d.hymnTitle)}</p>` : ''}
    </div>
  </div>`;
}

function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const source = tab === 'sermon' ? sermons : dailywords;
  const filtered = !q ? source : source.filter(x =>
    (x.title || '').toLowerCase().includes(q) ||
    (x.scripture || '').toLowerCase().includes(q) ||
    (x.passage || '').toLowerCase().includes(q)
  );
  if (!filtered.length) {
    list.innerHTML = `<div class="empty">${q ? '검색 결과가 없습니다.' : (tab === 'sermon' ? '아직 등록된 설교가 없습니다.' : '아직 등록된 말씀이 없습니다.')}</div>`;
    return;
  }
  list.innerHTML = filtered.map((x, i) => tab === 'sermon' ? sermonCard(x, i) : dailyCard(x, i)).join('');
  list.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('open'));
  });
}

document.getElementById('tabSermon').addEventListener('click', () => {
  tab = 'sermon';
  document.getElementById('tabSermon').classList.add('active');
  document.getElementById('tabDaily').classList.remove('active');
  render();
});
document.getElementById('tabDaily').addEventListener('click', () => {
  tab = 'daily';
  document.getElementById('tabDaily').classList.add('active');
  document.getElementById('tabSermon').classList.remove('active');
  render();
});
document.getElementById('searchInput').addEventListener('input', render);

loadData();
</script>

엘하 강해","keyPoints":["1. 인간의 계산은 하나님의 뜻과 다릅니다","2. 다윗은 왜 공로를 물리쳤습니까?","3. 하나님께 맡길 때 참된 길이 열립니다"],"conclusion":"사랑하는 성도 여러분, 오늘 말씀의 핵심을 한마디로 요약하면 이것입니다. 복수는 하나님의 것이요, 때도 하나님의 것이요, 방법도 하나님의 것입니다. 바아나와 레갑은 하나님의 일을 사람의 방법으로 하려다가 멸망했습니다. 다윗은 억울하고 답답해도 하나님의 때를 기다렸고, 하나님은 더 크고 더 아름다운 방법으로 응답해 주셨습니다. 이번 한 주간, 부탁드립니다. ","hymns":["찬송가 461장 '참 아름다워라'","찬송가 375장 '예수 따라가며'"]},{"date":"2026-04-19","title":"기회를 잡되, 정직하게","scripture":"사무엘하 3:6-21","series":"사무엘하 강해","keyPoints":["아브넬은 왜 다윗에게 왔는가 — 사람의 계산 속에 담긴 하나님의 뜻","다윗은 어떻게 기회를 잡았는가 — 조건을 걸되 정직하게","잔치를 베풀다 — 원수까지 품는 너그러움"],"conclusion":"사랑하는 성도 여러분, 오늘 말씀을 정리하겠습니다. 하나님은 때가 되면 반드시 기회를 열어 주십니다. 아브넬이라는 생각지 못한 통로를 통해서도 하나님의 뜻은 이루어졌습니다. 중요한 것은 그 기회 앞에서 우리가 어떻게 행동하느냐입니다. 다윗은 기회가 왔을 때 움켜쥐지 않았습니다. 정당하게, 공개적으로, 정직하게 행동했습니다. 그리고 원수까지도 품는 너그러운 ","hymns":["찬송가 382장 '내 주를 가까이 하게 함은'","찬송가 460장 '지금까지 지내온 것'"]},{"date":"2026-04-14","title":"가장 작은 자에게 한 것이 곧 내게 한 것입니다","scripture":"마태복음 25:31-46","keyPoints":["1. 부활의 주님은 어디에 계십니까?","2. 왜 '작은 자'라고 하셨을까요?","3. 은혜를 받은 사람은 은혜를 흘려보냅니다"],"conclusion":"사랑하는 성도 여러분, 오늘 말씀의 핵심을 한 문장으로 정리하겠습니다. (잠시 멈추고) '가장 작은 자 하나에게 한 것이 곧 예수님께 한 것입니다.'\n\n부활하신 주님은 영광 중에 계시지만, 동시에 가장 낮은 곳, 가장 아픈 곳, 가장 외로운 곳에 계십니다. 우리가 그 작은 자를 돌아볼 때, 우리는 부활의 주님을 만나는 것입니다.\n\n이번 한 주간, 한 가지만","hymns":["찬송가 460장 '지금까지 지내온 것'","찬송가 430장 '사랑하는 주님 앞에'","찬송가 495장 '고통의 멍에 벗으려고'"]},{"date":"2025-05-11","title":"롯을 보내며","scripture":"창세기 13:1-13","series":"창세기 강해","keyPoints":[],"conclusion":"","hymns":[]}]; window.__DAILYWORDS__ = [{"date":"2026-08-19","title":"주님이 함께 하시는 성전","passage":"열왕기상 6:1-14","scripture":"솔로몬이 왕이 된 지 넉째 해 시브 월 곧 둘째 달에 주님의 집을 짓기 시작하였다. 솔로몬 왕이 주님께 지은 성전은 길이가 육십 규빗이요 너비가 이십 규빗이요 높이가 삼십 규빗이었다. 주님의 말씀이 솔로몬에게 임하였다. \"네가 지금 이 집을 짓고 있다. 네가 나의 규례를 따르고 나의 법도를 행하며 나의 모든 계명을 지켜 그대로 행하면 내가 너의 아버지 다윗에게 한 약속을 네게 이루겠다. 나는 이스라엘 자손 가운데 살면서 나의 백성 이스라엘을 버리지 않겠다.\"","meditation":"솔로몬이 성전을 짓기 시작했습니다. 이 성전은 단순히 크고 화려한 건물이 아니었습니다. 하나님께서 당신의 백성 가운데 함께 살겠다고 약속하신 곳이었습니다. 돌 하나, 나무 하나에 정성을 담아 쌓아 올린 것은 하나님을 향한 사랑의 표현이었습니다.\n\n우리 태백 동산교회도 마찬가지입니다. 이 작은 예배당은 세상에서 가장 크고 아름다운 성전은 아닐지 모릅니다. 그러나 하나님께서 함께하시겠다고 약속하신 곳입니다. 탄광촌의 힘든 세월을 견디며 믿음을 지켜온 우리의 삶 자체가 하나님의 성전입니다. 주름진 손으로 찬송가를 펴고, 갈라진 목소리로 기도하는 그 자리에 하나님이 계십니다.\n\n하나님은 솔로몬에게 \"나의 백성을 버리지 않겠다\"고 말씀하셨습니다. 이 약속은 오늘 우리에게도 똑같이 유효합니다. 세상이 아무리 변하고, 우리가 나이 들고 힘이 빠져도 하나님은 우리 곁을 떠나지 않으십니다. 우리가 매일 드리는 기도와 예배가 바로 하나님의 성전을 짓는 일입니다.","questions":["내 삶에서 하나님의 성전이라 할 수 있는 부분은 어디입니까?","하나님이 '버리지 않겠다'고 하신 약속이 내게 어떤 위로가 됩니까?","오늘 내가 정성을 담아 하나님께 드릴 수 있는 것은 무엇입니까?"],"practice":"오늘 하루, 내 몸과 마음이 하나님의 성전임을 기억하며 한 가지 일이라도 정성껏 해 보겠습니다.","prayer":"사랑하는 하나님, 우리 가운데 함께 살겠다고 약속해 주셔서 감사합니다. 비록 작고 부족한 우리이지만, 주님께서 우리를 버리지 않으시니 든든합니다. 오늘도 우리의 기도와 삶이 주님께 드리는 귀한 성전이 되게 하여 주시옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 383장 '내 영혼의 그윽히 깊은 데서'"},{"date":"2026-08-15","title":"주님이 주시는 참된 광복","passage":"이사야 61:1-3","scripture":"주 하나님의 영이 나에게 내리셨다. 주님께서 나에게 기름을 부으셨다. 가난한 사람에게 기쁜 소식을 전하게 하려고, 주님께서 나를 보내셨다. 마음이 상한 사람을 싸매어 주고, 포로에게 자유를, 갇힌 사람에게 석방을 선언하게 하려고, 주님께서 나를 보내셨다. 주님의 은혜의 해와 우리 하나님의 보복의 날을 선포하게 하려고, 슬퍼하는 모든 사람을 위로하게 하려고, 시온에서 슬퍼하는 사람들에게 재 대신에 화관을, 슬픔 대신에 기쁨의 기름을, 근심 대신에 찬양의 옷을 주게 하려고, 나를 보내셨다.","meditation":"오늘은 광복절입니다. 81년 전 우리 민족이 일제의 억압에서 풀려난 날을 기억합니다. 이 땅에서, 이 태백 탄광촌에서 묵묵히 살아오신 어르신들께서는 그 해방의 기쁨이 무엇인지 누구보다 잘 아실 것입니다. 나라를 되찾은 그 감격, 그것은 하나님이 우리 민족에게 베풀어주신 크나큰 은혜였습니다.\n\n이사야 선지자는 하나님께서 가난한 사람에게 기쁜 소식을 전하고, 마음이 상한 사람을 싸매어 주시며, 포로에게 자유를 선포하신다고 말합니다. 우리 민족이 경험한 광복도 놀라운 일이지만, 하나님께서는 더 깊은 해방을 약속하십니다. 죄의 사슬에서, 두려움에서, 외로움에서, 병의 고통에서 우리를 자유케 하시는 것입니다. 탄광의 깊은 어둠 속에서도 빛을 비추시는 하나님, 그분이 우리의 참된 해방자이십니다.\n\n하나님은 슬픔 대신 기쁨의 기름을, 근심 대신 찬양의 옷을 입혀주신다 하셨습니다. 오늘 광복절을 맞아 나라의 자유를 감사하면서, 동시에 예수 그리스도 안에서 우리 영혼이 누리는 참된 자유를 기억합시다. 우리를 자유케 하신 주님께 감사와 찬양을 올려드립시다.","questions":["나를 묶고 있는 두려움이나 걱정거리가 있다면 무엇인가요? 그것을 주님께 내려놓을 수 있나요?","광복의 기쁨처럼, 하나님께서 나를 자유롭게 해주셨던 경험이 있나요?","우리 주변에 아직 마음의 자유를 얻지 못한 이웃이 있다면, 어떻게 위로할 수 있을까요?"],"practice":"오늘 하루 나를 억누르는 걱정 하나를 기도로 주님께 내려놓고, 자유를 주시는 하나님께 감사의 기도를 드립시다.","prayer":"자유를 주시는 하나님, 81년 전 이 나라에 광복을 허락하신 은혜에 감사드립니다. 오늘도 우리 마음을 짓누르는 모든 무거운 짐에서 우리를 풀어주시고, 슬픔 대신 기쁨을, 근심 대신 찬양을 입혀 주시옵소서. 이 태백 땅에서 살아가는 우리 모두가 주님 안에서 참된 자유와 평화를 누리게 하여 주시옵소서. 예수 그리스도의 이름으로 기도드립니다. 아멘.","hymnTitle":"자유 해방 새 노래를(찬송가 498장)"},{"date":"2026-08-14","title":"주님이 주시는 참된 광복","passage":"이사야 61:1-3","scripture":"주 하나님의 영이 나에게 내리셨다. 주님께서 나에게 기름을 부으셨다. 주님께서 나를 보내셔서, 가난한 사람들에게 기쁜 소식을 전하게 하셨다. 주님께서 나를 보내셔서, 마음이 상한 사람들을 싸매 주고, 포로에게 자유를, 갇힌 사람에게 석방을 선포하게 하셨다. 주님의 은혜의 해와, 우리 하나님의 보복의 날을 선포하게 하셨다. 슬퍼하는 모든 사람을 위로하게 하셨다. 시온에서 슬퍼하는 사람들에게 재 대신 화관을, 슬픔 대신 기쁨의 기름을, 근심 대신 찬송의 옷을 주게 하셨다.","meditation":"내일은 광복절입니다. 81년 전 우리 민족이 일제의 억압에서 벗어난 그 기쁨을 기억합니다. 이 탄광촌에서 평생을 일하시며 살아오신 어르신들께서는 그 시절의 아픔을 직접 들으셨거나 부모님 세대를 통해 생생히 기억하고 계실 것입니다. 나라를 되찾은 그 감격이 얼마나 컸겠습니까.\n\n이사야 선지자는 포로 된 백성에게 자유를, 갇힌 자에게 석방을 선포하는 기쁜 소식을 전합니다. 하나님은 억눌린 자를 풀어주시고, 슬퍼하는 자를 위로하시는 분이십니다. 우리 민족의 광복도 하나님의 크신 은혜 가운데 이루어진 것입니다. 그러나 우리에게는 나라의 광복보다 더 깊은 해방이 있습니다. 예수 그리스도께서 우리를 죄와 절망에서 건져주신 참된 광복입니다.\n\n주님은 재 대신 화관을, 슬픔 대신 기쁨의 기름을, 근심 대신 찬송의 옷을 입혀주십니다. 살면서 힘들고 외롭고 몸이 아파 근심될 때가 많지만, 주님께서 우리 마음에 참된 자유와 기쁨을 채워주십니다. 광복절을 맞아 나라의 자유에 감사하고, 우리 영혼에 참된 해방을 주신 주님께 더 깊이 감사드립시다.","questions":["나를 억누르고 있는 근심이나 두려움이 있다면 무엇인가요?","하나님께서 나에게 주신 자유와 해방의 경험이 있다면 나누어 봅시다.","우리 주변에 위로와 격려가 필요한 이웃은 누구인가요?"],"practice":"오늘 태극기를 바라보며 나라의 자유를 위해 희생하신 분들과 우리 영혼을 해방하신 주님께 감사기도를 드립니다.","prayer":"자유를 주시는 하나님, 우리 민족에게 광복의 은혜를 베풀어 주시니 감사합니다. 또한 죄와 절망에서 우리를 건져주시고 참된 자유를 주신 예수님께 감사드립니다. 이 땅에 진정한 평화와 통일이 이루어지게 하시고, 우리 교회 식구들 한 분 한 분의 마음에 근심 대신 찬송의 기쁨을 넘치게 채워주시옵소서. 예수님 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 498장 (내 주를 가까이 하게 함은)"},{"date":"2026-08-13","title":"함께 힘 모아 성전을 짓다","passage":"열왕기상 5:13-18","scripture":"솔로몬 왕이 온 이스라엘에서 역군을 징발하였는데, 징발된 역군이 삼만 명이었다. 솔로몬이 그들을 한 달에 만 명씩 교대로 레바논에 보냈다. 한 달은 레바논에서 일하고, 두 달은 집에서 쉬게 하였다. 아도니람이 역군을 감독하였다. 솔로몬에게는 짐을 나르는 일꾼이 칠만 명이요, 산에서 돌을 떠내는 일꾼이 팔만 명이었다. 이 밖에도 공사를 감독하는 관리가 삼천삼백 명이나 되었는데, 그들이 일꾼들을 부렸다. 왕이 명령하여 크고 값진 돌을 떠내어서 다듬은 돌로 성전의 기초를 놓게 하였다. 솔로몬의 건축가들과 히람의 건축가들과 그발 사람들이 돌을 다듬고 성전을 지을 목재와 석재를 마련하였다.","meditation":"솔로몬이 하나님의 성전을 짓기 위해 온 이스라엘의 힘을 모았습니다. 삼만 명의 역군, 칠만 명의 짐꾼, 팔만 명의 석공이 함께했습니다. 혼자서는 절대 할 수 없는 일이었습니다. 하나님의 집은 한 사람의 능력이 아니라 여러 사람의 땀과 정성이 모여 지어지는 것입니다.\n\n여기서 눈여겨볼 것은 솔로몬이 일꾼들을 배려했다는 점입니다. 한 달 일하고 두 달 쉬게 하였습니다. 하나님의 일이라고 해서 사람을 함부로 부리지 않았습니다. 귀한 일에 쓰이는 사람도 귀하게 대우받아야 합니다. 하나님은 우리의 헌신도 기뻐하시지만, 서로를 아끼는 마음도 기뻐하십니다.\n\n우리 동산교회도 마찬가지입니다. 큰 교회는 아니지만, 한 분 한 분이 기도로 봉사로 헌신으로 힘을 모아 이 믿음의 집을 세워가고 있습니다. 누군가는 기도하고, 누군가는 찬양하고, 누군가는 조용히 교회 마당을 쓸어주십니다. 그 모든 수고가 모여 하나님이 기뻐하시는 성전이 됩니다. 오늘도 함께하는 우리가 참 감사합니다.","questions":["하나님의 교회를 세우기 위해 내가 기쁘게 감당하고 있는 역할은 무엇인가요?","함께 일하는 사람을 배려하고 격려한 경험이 있으신가요?","우리 교회에서 묵묵히 수고하시는 분에게 감사를 표현해 본 적이 있나요?"],"practice":"오늘 우리 교회에서 묵묵히 섬기시는 분 한 분에게 전화나 만남으로 감사 인사를 전해 봅시다.","prayer":"사랑의 하나님, 혼자가 아니라 함께 믿음의 집을 세워가게 하시니 감사합니다. 우리 동산교회 한 분 한 분의 수고와 헌신을 주님이 기억하여 주시고, 서로를 아끼고 격려하는 마음을 더해 주옵소서. 오늘도 이 작은 교회가 주님의 크신 사랑으로 가득 채워지게 하여 주시옵소서. 예수님의 이름으로 기도드립니다. 아멘.","hymnTitle":"성전을 사랑하는 자"},{"date":"2026-08-12","title":"성전을 세우는 아름다운 협력","passage":"열왕기상 5:1-12","scripture":"솔로몬이 히람에게 사람을 보내어 말하였다. \"당신도 아시다시피, 나의 아버지 다윗은, 사방에서 일어나는 전쟁 때문에, 주 자기의 하나님의 이름을 위하여 성전을 짓지 못하였습니다. … 그러므로 나는 이제, 주 나의 하나님의 이름을 위하여, 성전을 지으려고 합니다.\" (열왕기상 5:2-5)","meditation":"솔로몬은 하나님의 성전을 짓기로 결심했지만, 혼자 힘으로 하려 하지 않았습니다. 이웃 나라 두로 왕 히람에게 사람을 보내어 도움을 구했습니다. 아버지 다윗과 히람 사이에 오랜 우정이 있었기에 가능한 일이었습니다. 하나님의 일은 혼자가 아니라 함께할 때 이루어집니다.\n\n히람은 솔로몬의 부탁을 듣고 크게 기뻐하며 레바논의 좋은 백향목과 잣나무를 보내주었고, 솔로몬은 히람에게 밀과 기름을 보내주었습니다. 서로가 가진 것을 나누며 협력하는 모습이 참 아름답습니다. 우리 태백 교회도 마찬가지입니다. 누군가는 기도로, 누군가는 봉사로, 누군가는 따뜻한 말 한마디로 하나님의 집을 함께 세워가고 있습니다.\n\n성경은 \"주님께서 솔로몬에게 지혜를 주셨으므로, 히람과 솔로몬 사이에 평화가 있었다\"고 말합니다. 하나님이 주신 지혜는 다툼이 아니라 평화를 만들고, 경쟁이 아니라 협력을 이끌어냅니다. 오늘 우리도 이웃과 손을 맞잡고 하나님 나라를 세워가는 귀한 일꾼들이 되기를 소망합니다.","questions":["나는 하나님의 일을 위해 누군가와 기꺼이 협력한 경험이 있습니까?","내가 가진 것 중에 이웃과 나눌 수 있는 것은 무엇입니까?","교회 안에서 서로의 다른 은사를 존중하고 있습니까?"],"practice":"오늘 교회나 이웃을 위해 내가 가진 작은 것 하나를 기꺼이 나누어 봅시다.","prayer":"하나님, 혼자서는 할 수 없는 일도 함께하면 이루어짐을 감사합니다. 우리 교회가 서로 돕고 손잡으며 하나님의 집을 세워가게 하여 주시옵소서. 이웃과 평화를 이루는 지혜를 저희에게도 허락하여 주시옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"다 함께 손을 잡고 (찬송가 559장)"},{"date":"2026-08-11","title":"지혜의 근본이신 하나님","passage":"열왕기상 4:29-34","scripture":"하나님께서 솔로몬에게 지혜와 총명을 매우 많이 주시고, 넓은 마음을 주셨는데, 그것은 바닷가의 모래알같이 헤아릴 수 없을 만큼 많았다. 솔로몬의 지혜는 동쪽의 어떤 현인들의 지혜보다도, 이집트의 어떤 지혜보다도 뛰어났다. (열왕기상 4:29-30)","meditation":"솔로몬이 가진 지혜는 스스로 노력해서 얻은 것이 아니었습니다. 하나님께서 넉넉히 부어 주신 선물이었습니다. 바닷가 모래알처럼 많은 지혜를 주셨다는 말씀은, 하나님의 은혜가 얼마나 넘치는지를 잘 보여 줍니다. 우리가 아무리 똑똑하려고 애써도 한계가 있지만, 하나님께서 주시는 지혜는 끝이 없습니다.\n\n솔로몬은 이 지혜로 나무와 짐승과 새와 물고기에 대해서도 말할 수 있었습니다. 세상 만물을 깊이 이해하는 눈을 하나님께서 열어 주신 것입니다. 참된 지혜란 단순히 아는 것이 많은 것이 아니라, 하나님의 눈으로 세상을 바라보고, 이웃을 이해하며, 삶 속에서 바른 판단을 내리는 것입니다.\n\n우리 태백에서 오랜 세월 살아오신 어르신들의 삶의 경험 속에도 하나님의 지혜가 담겨 있습니다. 세상 학문이 없어도 하나님을 경외하는 마음으로 하루하루를 성실히 살아온 그 삶이 바로 지혜로운 삶입니다. 오늘도 하나님께 지혜를 구하며, 그분이 주시는 넓은 마음으로 이웃을 품는 하루가 되기를 소망합니다.","questions":["내가 살면서 하나님의 지혜가 필요하다고 느꼈던 순간은 언제였습니까?","하나님께서 주신 삶의 경험 중에 다른 사람에게 나눌 수 있는 지혜가 있다면 무엇입니까?","오늘 내가 판단하기 어려운 일이 있다면, 하나님께 먼저 여쭤보고 있습니까?"],"practice":"오늘 하루 중 판단이 필요한 순간에 잠깐 멈추고, \"하나님, 지혜를 주세요\" 하고 짧은 기도를 드린 뒤 결정합시다.","prayer":"지혜의 근본이 되시는 하나님, 오늘 하루도 저희에게 바른 판단과 넓은 마음을 허락하여 주옵소서. 세상 지식이 부족해도 하나님을 경외하는 마음으로 살아갈 수 있게 도와주시고, 이웃을 이해하고 사랑하는 지혜를 부어 주시옵소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"지혜의 왕이신 나의 주 하나님"},{"date":"2026-08-09","title":"하나님이 주시는 참 지혜","passage":"열왕기상 3:16-28","scripture":"온 이스라엘이 왕이 내린 판결을 전해 듣고, 왕을 두려워하였다. 하나님께서 주신 지혜가 왕에게 있어서, 공정하게 재판한다는 것을 알았기 때문이다. (열왕기상 3:28)","meditation":"솔로몬 왕 앞에 두 여인이 한 아기를 두고 서로 제 아이라고 다투었습니다. 솔로몬은 칼로 아이를 둘로 나누라고 명했고, 진짜 어머니는 차라리 아이를 살려서 상대에게 주라고 울부짖었습니다. 솔로몬은 그 마음을 알아보고 친어머니에게 아이를 돌려주었습니다. 이것이 하나님이 주신 지혜의 판결이었습니다.\n\n하나님의 지혜는 머리가 좋고 공부를 많이 한 것과는 다릅니다. 사람의 마음을 깊이 들여다보고, 약한 자의 편에 서서 진실을 가려내는 것이 참된 지혜입니다. 우리가 살아가면서 이웃과 부딪히고, 가족 간에 오해가 생기고, 무엇이 옳은지 판단하기 어려울 때가 많습니다. 그때 우리에게 필요한 것은 똑똑한 머리가 아니라, 하나님께 구하는 겸손한 마음입니다.\n\n태백에서 오랜 세월 함께 살아온 우리는 서로의 사정을 잘 압니다. 그래서 때로는 판단하기 쉽고, 때로는 더 어렵기도 합니다. 오늘 하나님께 지혜를 구합시다. 상대방의 마음을 헤아리는 따뜻한 지혜, 진실 앞에 정직한 지혜를 주님이 우리에게도 넉넉히 주실 줄 믿습니다.","questions":["나는 어려운 상황에서 내 판단만 믿었는지, 하나님께 지혜를 구했는지 돌아봅시다.","최근에 누군가의 마음을 깊이 헤아려 주지 못한 일이 있었습니까?","하나님의 지혜와 세상의 지혜가 어떻게 다른지 나눠 봅시다."],"practice":"오늘 만나는 사람의 말 뒤에 숨은 마음을 한 번 더 헤아려 보고, 따뜻한 말 한마디를 건네겠습니다.","prayer":"지혜의 근원이 되시는 하나님, 오늘도 저희에게 사람의 마음을 알아보는 따뜻한 지혜를 주옵소서. 내 생각만 앞세우지 않고 겸손히 주님께 여쭈는 하루가 되게 하시고, 이웃의 아픔을 함께 나누는 참된 지혜로 살아가게 하여 주옵소서. 예수 그리스도의 이름으로 기도드립니다. 아멘.","hymnTitle":"비둘기같이 온유한(찬송가 180장)"},{"date":"2026-08-08","title":"하나님께 지혜를 구하십시오","passage":"열왕기상 3:3-14","scripture":"솔로몬이 대답하였다. '주의 종 나의 아버지 다윗이 성실하고 의롭고 바른 마음으로 주와 함께 살았으므로, 주께서 그에게 큰 은총을 베풀어 주셨습니다. 주께서 그 큰 은총을 끝까지 지켜 주셔서, 오늘 그의 왕위를 이을 아들을 주셨습니다. 주 나의 하나님, 이제 주께서 이 종을 세워, 나의 아버지 다윗의 뒤를 잇게 하셨습니다. 그러나 나는 아직 어려서, 어떻게 처신해야 할지를 모릅니다. 이 종은, 주께서 친히 택하신 주의 백성 가운데 서 있습니다. 이 백성은 너무 많아서 셀 수도 없고 헤아릴 수도 없습니다. 이 종에게 듣고 분별하는 마음을 주셔서, 주의 백성을 재판할 수 있게 해주십시오. 그렇지 않으면 이 많은 주의 백성을 누가 재판할 수 있겠습니까?' 솔로몬이 이렇게 구하니, 주께서 기뻐하셨다.","meditation":"솔로몬이 왕이 되었을 때, 그는 하나님 앞에서 솔직하게 고백합니다. '나는 아직 어려서, 어떻게 처신해야 할지를 모릅니다.' 이 고백이 참으로 아름답습니다. 자기가 부족하다는 것을 아는 사람, 혼자 힘으로는 안 된다는 것을 아는 사람이 하나님 앞에 나아갈 수 있습니다. 솔로몬은 재물도, 긴 수명도, 원수의 멸망도 구하지 않았습니다.\n\n그가 구한 것은 '듣고 분별하는 마음'이었습니다. 하나님의 백성을 잘 돌보려면 무엇이 옳은지 분별할 줄 알아야 하고, 사람들의 이야기를 잘 들을 줄 알아야 합니다. 오늘 우리가 성만찬 상에 함께 모이고, 속장 인도자 교육을 하는 이 자리에서도 같은 마음이 필요합니다. 서로의 이야기를 귀 기울여 듣고, 무엇이 사랑의 길인지 분별하는 마음 말입니다.\n\n하나님은 솔로몬의 기도를 기뻐하셨습니다. 우리도 오늘 성찬의 떡과 잔을 나누며 고백합시다. '주님, 저는 부족합니다. 지혜를 주십시오.' 이 기도를 하나님은 반드시 기뻐 들으십니다. 탄광촌 이 작은 교회에서 서로를 돌보는 우리에게, 하나님이 듣고 분별하는 마음을 넉넉히 채워 주실 줄 믿습니다.","questions":["나는 하나님 앞에서 나의 부족함을 솔직하게 고백한 적이 있습니까?","지혜로운 삶이란 어떤 것이라고 생각합니까? 일상에서 지혜가 필요했던 경험을 나누어 봅시다.","속회에서 서로의 이야기를 잘 '듣고 분별하는' 마음을 가지려면 어떻게 해야 할까요?"],"practice":"오늘 하루, 누군가의 이야기를 끝까지 귀 기울여 들어주고, 판단보다 먼저 공감의 마음을 표현해 보겠습니다.","prayer":"사랑의 하나님, 오늘 성찬의 은혜 앞에 나아온 저희에게 듣고 분별하는 마음을 부어 주옵소서. 저희의 부족함을 아시는 주님, 지혜로 채워 주시어 서로를 따뜻하게 돌보는 교회가 되게 하여 주옵소서. 이 작은 교회가 주님의 사랑을 나누는 귀한 공동체가 되기를 간절히 기도드립니다. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 405장 나의 갈 길 다 가도록"},{"date":"2026-07-31","title":"하나님이 세우신 자리를 지키며","passage":"열왕기상 2:10-12","scripture":"다윗이 조상들과 함께 잠들어, 다윗 성에 묻혔다. 다윗이 이스라엘을 다스린 기간은 사십 년이었는데, 헤브론에서 칠 년, 예루살렘에서 삼십삼 년을 다스렸다. 솔로몬이 그의 아버지 다윗의 왕위에 올라앉으니, 그의 나라가 굳게 섰다.","meditation":"다윗은 목동에서 시작하여 이스라엘의 왕이 되었고, 사십 년 동안 나라를 다스린 뒤 조용히 눈을 감았습니다. 화려한 업적도, 뼈아픈 실수도 있었지만, 하나님은 끝까지 다윗과 함께하셨습니다. 한 사람의 인생이 마무리되는 모습 속에서 우리는 하나님의 신실하심을 봅니다.\n\n솔로몬이 아버지의 왕위에 올라앉자 \"그의 나라가 굳게 섰다\"고 성경은 말합니다. 사람의 힘이나 능력으로 나라가 선 것이 아닙니다. 하나님이 약속하시고, 하나님이 세워주셨기에 굳게 선 것입니다. 우리의 삶도 마찬가지입니다. 우리가 서 있는 자리, 맡겨진 일, 가정과 교회에서의 역할 모두 하나님이 세워주신 것입니다.\n\n사랑하는 교우 여러분, 우리 각자에게도 하나님이 맡기신 자리가 있습니다. 비록 세상이 알아주지 않는 작은 자리일지라도, 하나님이 세워주신 자리라면 그곳이 가장 귀한 곳입니다. 오늘도 그 자리에서 묵묵히 신실하게, 하나님을 의지하며 살아가는 우리 모두가 되기를 바랍니다.","questions":["하나님이 나를 세워주신 자리는 어디라고 생각하십니까?","다윗의 일생을 돌아보며, 내 인생에서 하나님의 신실하심을 경험한 때는 언제였습니까?","내가 맡은 자리에서 더 성실하게 섬기려면 무엇을 달리해야 할까요?"],"practice":"오늘 하루, 내가 있는 자리에서 불평 대신 감사의 고백을 하며 맡겨진 일에 최선을 다하겠습니다.","prayer":"하나님, 저를 이 자리에 세워주심을 감사합니다. 크고 작은 일에 상관없이 하나님이 맡기신 자리를 귀하게 여기며 신실하게 살아가게 하여 주십시오. 다윗의 생애를 통해 보여주신 하나님의 변함없는 사랑을 기억하며, 오늘도 주님만 의지하고 살겠습니다. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"섬김 (찬송가 364장 '반석 위에 내가 서니')"},{"date":"2026-07-30","title":"담대하게 걸어가는 믿음의 길","passage":"열왕기상 2:1-9","scripture":"다윗이 죽을 날이 가까워지자, 아들 솔로몬에게 유언하였다. \"나는 이제 세상 모든 사람이 가는 길로 간다. 너는 힘을 내어 대장부가 되어라. 주 너의 하나님이 명하신 것을 지켜서, 모세의 율법에 기록된 대로 하나님의 길을 걸으며, 하나님의 규례와 계명과 법도와 증거를 지켜라. 그래야 네가 무엇을 하든지, 어디로 가든지 잘 될 것이다.\" (열왕기상 2:1-3, 새번역)","meditation":"다윗 왕이 세상을 떠나기 전, 아들 솔로몬에게 남긴 마지막 말씀입니다. 한평생 전쟁터와 왕궁을 오가며 파란만장한 삶을 산 다윗이 마지막에 남긴 것은 재산 목록이 아니라 '하나님의 길을 걸으라'는 당부였습니다. 세상 모든 사람이 가는 길, 곧 죽음 앞에서 다윗이 가장 중요하게 여긴 것은 오직 하나님의 말씀을 붙잡는 것이었습니다.\n\n\"힘을 내어 대장부가 되어라.\" 이 말은 단순히 용감하라는 뜻이 아닙니다. 하나님의 말씀 앞에 흔들리지 않고, 어떤 어려움이 와도 믿음을 놓지 말라는 격려입니다. 우리 태백에서 오랜 세월 탄광의 먼지 속에서, 추운 겨울바람 속에서 묵묵히 살아오신 어르신들의 삶이 바로 그런 담대함이 아닐까 합니다. 세상이 알아주지 않아도 하루하루 성실하게 걸어온 그 발걸음이 하나님 보시기에 귀한 것입니다.\n\n다윗은 \"무엇을 하든지, 어디로 가든지 잘 될 것이다\"라고 약속합니다. 이것은 하나님의 길을 걷는 사람에게 주시는 축복의 말씀입니다. 오늘 우리도 이 약속을 붙잡고, 남은 삶의 날들을 하나님만 바라보며 담대하게 걸어가시길 바랍니다.","questions":["내가 사랑하는 사람에게 꼭 남기고 싶은 믿음의 유언은 무엇인가요?","지금 내 삶에서 '힘을 내어 담대해져야 할' 부분은 어디인가요?","하나님의 길을 걷고 있다는 확신이 들 때는 언제인가요?"],"practice":"오늘 가족이나 가까운 사람에게 \"힘내세요, 하나님이 함께하십니다\"라고 따뜻한 말 한마디를 건네 보겠습니다.","prayer":"사랑의 하나님, 한평생 우리를 지켜주시고 인도해 주셔서 감사합니다. 남은 날들도 주님의 말씀을 붙잡고 담대하게 걸어가게 하여 주시옵소서. 우리의 자녀와 이웃에게 믿음의 유산을 남기는 삶이 되게 하시고, 오늘도 이 태백 땅에서 주님의 사랑을 나누며 살게 하여 주시옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 370장 (나의 생명 드리니)"},{"date":"2026-07-29","title":"하나님이 세우시는 사람","passage":"열왕기상 1:28-40","scripture":"다윗 왕이 대답하였다. '밧세바를 이리로 불러들여라.' 밧세바가 왕 앞에 들어와서 서니, 왕이 맹세하여 말하였다. '나의 생명을 온갖 환난에서 건져 주신 살아 계신 주님을 두고 맹세하는데, 내가 이스라엘의 하나님 주님의 이름을 걸고 그대에게 맹세한 대로, 그대의 아들 솔로몬이 나를 이어서 왕이 될 것이고, 나를 대신하여 나의 왕좌에 앉을 것이오.' (열왕기상 1:28-30)","meditation":"늙은 다윗 왕에게 위기가 찾아왔습니다. 아도니야가 스스로 왕이 되겠다고 나섰지만, 다윗은 하나님 앞에서 한 약속을 기억합니다. 그리고 그 약속대로 솔로몬을 왕으로 세웁니다. 사람이 아무리 힘으로 자리를 차지하려 해도, 결국 하나님의 뜻대로 되는 것입니다.\n\n다윗은 '나의 생명을 온갖 환난에서 건져 주신 살아 계신 주님'이라고 고백합니다. 탄광에서 일하시며 온갖 어려움을 겪으신 우리 어르신들도 이 고백에 깊이 공감하실 것입니다. 돌이켜보면, 위험한 순간마다 우리를 지켜주신 분이 바로 살아 계신 하나님이셨습니다. 그 하나님이 우리의 삶도 인도하고 계십니다.\n\n솔로몬이 왕이 되자 온 백성이 기뻐하며 피리를 불고 크게 즐거워했습니다. 하나님의 뜻이 이루어질 때 참된 기쁨이 옵니다. 오늘도 내 힘으로 무엇을 이루려 애쓰기보다, 하나님의 뜻에 나를 맡기는 하루가 되면 좋겠습니다. 하나님은 우리 각자의 삶에도 좋은 계획을 가지고 계십니다.","questions":["살아오면서 '하나님이 나를 건져주셨구나' 하고 느낀 때가 있으셨습니까?","내 뜻대로 안 되어 속상했지만, 나중에 보니 하나님의 뜻이었던 경험이 있으신가요?","오늘 하나님께 맡기고 싶은 걱정거리가 있으시다면 무엇인가요?"],"practice":"오늘 하루, 내가 붙잡고 있는 걱정 하나를 \"하나님, 맡깁니다\"라고 말씀드리며 내려놓아 봅시다.","prayer":"살아 계신 하나님, 지나온 세월 동안 우리를 지켜주시고 이끌어주셔서 감사합니다. 오늘도 우리의 앞길을 주님의 뜻대로 인도하여 주옵소서. 힘으로 되지 않는 일 앞에서 조급해하지 않고, 주님의 때를 기다리는 믿음을 허락하여 주옵소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"모든 것이 주의 것(찬송가 50장)"},{"date":"2026-07-14","title":"때를 분별하는 믿음의 지혜","passage":"열왕기상 1:11-27","scripture":"나단이 밧세바에게 말하였다. '아도니야가 왕이 된 것을 모르십니까? 우리 주군 다윗 임금은 이것을 모르고 계십니다. 자, 이제 내가 부인에게 한 가지 방법을 일러 드릴 터이니, 부인의 목숨과 부인의 아들 솔로몬의 목숨을 건지십시오.' (열왕기상 1:11-12)","meditation":"늙고 쇠약해진 다윗 왕 곁에서 아도니야가 스스로 왕이 되겠다고 나섭니다. 이 위급한 때에 예언자 나단은 가만히 앉아 있지 않았습니다. 밧세바를 찾아가 지혜로운 방법을 알려주며 함께 행동합니다. 하나님의 뜻을 아는 사람은 어려운 상황 앞에서도 포기하지 않고 길을 찾습니다.\n\n나단은 하나님께서 솔로몬을 세우시겠다고 약속하신 말씀을 기억하고 있었습니다. 그래서 두려운 상황에서도 담대하게 나설 수 있었습니다. 우리도 마찬가지입니다. 하나님의 약속을 붙잡고 있으면 세상이 아무리 어수선해도 흔들리지 않습니다. 탄광이 문을 닫고 젊은이들이 떠나도, 하나님께서 우리 태백을 잊지 않으셨다는 믿음이 우리의 힘입니다.\n\n나단과 밧세바는 각자의 자리에서 할 수 있는 일을 했습니다. 하나님은 큰 일만 하시는 분이 아닙니다. 우리가 작은 용기를 내어 한 걸음 나아갈 때, 그 발걸음 위에 하나님의 크신 뜻을 이루어 가십니다. 오늘 우리에게도 지혜와 용기가 필요한 때입니다. 하나님께 구하면 넉넉히 주십니다.","questions":["내 앞에 놓인 어려운 상황에서 하나님의 약속을 기억하고 있는지 돌아봅시다.","나단처럼 내 주변에서 도움이 필요한 이웃에게 지혜로운 조언을 건넨 적이 있습니까?","두려움 때문에 해야 할 일을 미루고 있는 것은 없는지 생각해 봅시다."],"practice":"오늘 하루 어려운 일 앞에서 피하지 말고, 하나님께 지혜를 구하는 기도를 드린 뒤 작은 한 걸음을 내딛겠습니다.","prayer":"사랑의 하나님, 세상이 어수선하고 앞이 보이지 않을 때에도 주님의 약속을 굳게 붙잡게 하여 주옵소서. 나단에게 지혜를 주신 것처럼 저희에게도 때를 분별하는 믿음의 눈을 열어 주시고, 용기 있게 한 걸음 나아가는 하루가 되게 하여 주옵소서. 예수 그리스도의 이름으로 기도드립니다. 아멘.","hymnTitle":"지혜의 근본되신 주"},{"date":"2026-07-12","title":"하나님 뜻 앞에 겸손하기","passage":"열왕기상 1:1-10","scripture":"그런데 학깃의 아들 아도니야가 스스로 높여서 \"내가 왕이 되겠다\" 하고, 병거와 기병과 호위병 오십 명을 마련하였다. 그의 아버지가 살아 있는 동안에 \"너는 왜 이런 일을 하느냐?\" 하고 한 번도 꾸짖은 적이 없었다. (열왕기상 1:5-6a)","meditation":"다윗 왕이 늙어 기력이 쇠하자, 아들 아도니야가 스스로 왕이 되겠다고 나섭니다. 병거와 기병을 준비하고 호위병까지 세워 자기 힘으로 왕좌를 차지하려 했습니다. 하나님께서 세워주시는 것이 아니라, 자기가 스스로 높이려 한 것입니다.\n\n우리 삶에서도 이런 모습이 있습니다. 하나님의 때를 기다리지 못하고 내 힘으로, 내 방법으로 일을 이루려 할 때가 있습니다. 조급한 마음에 앞서 나가다 보면 하나님의 뜻과 어긋나게 됩니다. 아도니야는 겉으로 보기에 왕감이었지만, 하나님이 정하신 사람은 따로 있었습니다.\n\n사랑하는 교우 여러분, 우리의 자리와 역할은 하나님이 정해주십니다. 내가 원하는 것을 억지로 움켜쥐려 하지 말고, 하나님의 뜻 앞에 겸손히 서는 하루가 되면 좋겠습니다. 탄광에서 일하시던 시절, 윗분이 시키는 대로 묵묵히 따르던 그 순종의 마음으로 하나님 앞에 나아갑시다.","questions":["내가 하나님의 때를 기다리지 못하고 조급하게 앞서 나간 적은 없었나요?","스스로를 높이려는 마음이 내 안에 있지는 않은지 돌아봅시다.","겸손하게 하나님의 뜻을 구한다는 것은 내 일상에서 어떤 모습일까요?"],"practice":"오늘 하루, 내 뜻대로 하려는 마음이 올라올 때 잠시 멈추고 \"하나님, 당신의 뜻이 무엇입니까?\" 하고 여쭤보겠습니다.","prayer":"사랑의 하나님, 저희가 스스로 높아지려 하지 않고 하나님 앞에 겸손히 서게 해 주세요. 조급한 마음을 내려놓고 주님의 때를 기다리는 믿음을 주시옵소서. 오늘도 주님의 뜻 안에서 평안한 하루를 보내게 하여 주시옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"겸손히 주를 섬길 때(찬송가 453장)"},{"date":"2026-07-11","title":"값을 치르는 예배를 드립시다","passage":"사무엘하 24:18-25","scripture":"다윗이 아라우나에게 말하였다. '아닙니다. 내가 값을 치르고 사겠습니다. 거저 얻은 것을 나의 하나님 주님께 번제물로 드릴 수는 없습니다.' 다윗이 타작마당과 소를 은 오십 세겔에 샀다. 다윗이 거기에서 주님께 번제와 화목제를 드렸다. 주님께서 이 땅을 위한 기도를 들어주시니, 이스라엘에 내린 재앙이 그쳤다. (사무엘하 24:24-25, 새번역)","meditation":"다윗 왕은 하나님께 제사를 드리기 위해 아라우나의 타작마당을 사려고 합니다. 아라우나는 왕이시니 그냥 가져가시라고 했지만, 다윗은 단호하게 거절합니다. '거저 얻은 것을 하나님께 드릴 수 없습니다.' 이 한마디에 다윗의 예배하는 마음이 고스란히 담겨 있습니다.\n\n오늘은 성만찬 주일입니다. 우리가 받는 떡과 잔은 예수님께서 몸과 피를 값으로 치르신 은혜의 선물입니다. 주님은 거저 주신 것이 아니라 생명이라는 가장 큰 값을 치르셨습니다. 그 사랑 앞에 우리도 온 마음을 다해 응답하는 예배를 드려야 하지 않겠습니까. 형편이 넉넉하든 아니든, 하나님은 우리 마음의 정성을 보십니다.\n\n속장 인도자 교육도 오늘 함께합니다. 속회를 인도하는 일은 쉬운 일이 아닙니다. 시간과 기도와 마음을 드려야 합니다. 그러나 그 수고가 바로 값을 치르는 섬김이요 예배입니다. 탄광촌 이 작은 교회에서 서로를 돌보며 드리는 정성이야말로 하나님이 기뻐 받으시는 거룩한 제사입니다. 오늘 성찬상 앞에서 주님의 사랑에 감사하며, 온전한 마음으로 예배합시다.","questions":["나는 하나님께 예배드릴 때 어떤 마음으로 드리고 있습니까?","거저 받은 은혜에 감사하며 기꺼이 드린 경험이 있습니까?","속회 안에서 서로를 위해 내가 드릴 수 있는 것은 무엇입니까?"],"practice":"오늘 성만찬에 참여하며, 주님이 치르신 값을 생각하고 감사의 기도를 한 가지씩 마음에 담아 드립시다.","prayer":"사랑의 주님, 생명의 값을 치르시고 우리를 구원하여 주시니 감사합니다. 오늘 성찬상 앞에 나아가는 저희에게 온전한 마음을 허락하여 주시고, 속장 교육에 참여하는 인도자들에게 섬기는 기쁨을 더하여 주옵소서. 이 작은 교회가 주님 앞에 참된 예배 공동체로 세워지게 하여 주시옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 455장 '참 아름다워라'"},{"date":"2026-07-09","title":"목숨 걸고 길어 온 물 한 그릇","passage":"사무엘하 23:8-17","scripture":"세 용사가 블레셋 군대를 뚫고 들어가서, 베들레헴 성문 곁에 있는 우물에서 물을 길어다가, 다윗에게 가져왔다. 그러나 다윗은 그 물을 마시지 않고, 주님 앞에 부어 드리면서 말하였다. '주님, 이 물을 제가 어떻게 마시겠습니까? 목숨을 걸고 가서 길어 온 사람들의 피가 아니겠습니까?' 다윗은 그 물을 마시려고 하지 않았다. 이것은 이 세 용사가 한 일이다. (사무엘하 23:16-17)","meditation":"다윗이 목이 말라 '베들레헴 성문 곁 우물물을 누가 좀 가져다주면' 하고 혼잣말처럼 읊조렸습니다. 그런데 세 용사가 적진을 목숨 걸고 뚫고 들어가 정말 물을 길어 왔습니다. 작은 말 한마디에 목숨을 내놓은 것입니다. 이 충성이 얼마나 깊은지요.\n\n다윗은 그 물을 차마 마시지 못했습니다. 사람의 목숨보다 귀한 물이 어디 있겠습니까. 다윗은 그 물을 하나님 앞에 부어 드렸습니다. 용사들의 충성은 결국 하나님을 향한 것이었고, 다윗도 그 마음을 알았기에 하나님께 돌려 드린 것입니다. 서로의 마음이 하나님 안에서 통한 아름다운 장면입니다.\n\n우리 삶에도 누군가 목숨은 아니더라도, 자기 시간과 정성을 다해 건네주는 따뜻한 마음이 있습니다. 힘든 이웃에게 끓여 준 국 한 그릇, 홀로 사시는 어르신께 드린 전화 한 통, 그 작은 정성이 하나님 보시기에 얼마나 귀한 예물인지 모릅니다. 오늘도 서로를 향한 작은 충성이 하나님께 드리는 거룩한 예배가 되기를 바랍니다.","questions":["나를 위해 정성을 다해 준 사람이 있었나요? 그 마음에 감사를 표현한 적이 있습니까?","내가 누군가에게 기꺼이 수고를 감당한 적이 있다면, 그때 어떤 마음이었습니까?","일상의 작은 섬김도 하나님께 드리는 예배라는 것을 얼마나 느끼고 있습니까?"],"practice":"오늘 주변에 홀로 계신 이웃이나 어르신께 안부 전화 한 통을 드리며, 그 작은 정성을 하나님께 올리는 마음으로 섬기겠습니다.","prayer":"사랑의 하나님, 서로를 위해 정성을 쏟는 마음이 얼마나 귀한지 깨닫게 하여 주시니 감사합니다. 저희의 작은 섬김도 하나님 앞에 드리는 예배가 되게 하여 주십시오. 태백의 이웃들을 돌보는 충성된 마음을 허락하시고, 그 사랑 안에서 하나 되게 하여 주옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"섬김 (찬송가 430장 '너 예수께 조용히 나가')"},{"date":"2026-07-07","title":"하나님이 세우신 언약의 사람","passage":"사무엘하 23:1-7","scripture":"이스라엘의 하나님이 말씀하시고, 이스라엘의 반석이 나에게 이르시기를 '사람을 의롭게 다스리는 자, 하나님을 경외하면서 다스리는 자, 그는 아침 해가 떠오를 때의 아침 빛과 같고, 구름 없는 아침에 비가 온 뒤에 땅에서 새 풀이 돋아나게 하는 햇빛과 같다' 하셨다. (사무엘하 23:3-4, 새번역)","meditation":"다윗이 마지막으로 남긴 노래입니다. 평생을 돌아보며 다윗은 자기 자신이 대단해서가 아니라, 하나님이 자기와 언약을 맺어주셨기에 여기까지 왔다고 고백합니다. 양을 치던 소년이 왕이 되기까지, 그 길에는 언제나 하나님의 손길이 있었습니다.\n\n하나님을 경외하며 살아가는 사람은 아침 햇살과 같다고 말씀하십니다. 비 온 뒤 맑은 아침, 새 풀이 돋아나는 그 싱그러운 모습처럼, 하나님을 의지하는 사람의 삶은 주변에 생명과 따뜻함을 전해줍니다. 우리 태백에도 비가 오고 힘든 날이 있지만, 그 뒤에 찾아오는 맑은 아침이 얼마나 아름다운지 우리는 잘 압니다.\n\n다윗은 완벽한 사람이 아니었습니다. 넘어지기도 하고 실수도 많았습니다. 그러나 끝까지 하나님께 돌아왔고, 하나님은 그 언약을 끝까지 지켜주셨습니다. 우리도 마찬가지입니다. 부족하고 연약하지만, 하나님이 우리와 맺으신 사랑의 언약은 변하지 않습니다. 오늘도 그 언약을 붙잡고 감사하며 살아가는 하루가 되기를 바랍니다.","questions":["내 인생을 돌아볼 때, 하나님이 함께하셨다고 느꼈던 순간은 언제인가요?","비 온 뒤 맑은 아침처럼, 힘든 시간 뒤에 찾아온 하나님의 은혜가 있었나요?","하나님의 변치 않는 언약을 믿고 오늘 내려놓을 수 있는 걱정은 무엇인가요?"],"practice":"오늘 하루를 마치며, 내 삶에서 하나님이 지켜주신 순간 하나를 떠올리고 감사의 기도를 드립니다.","prayer":"신실하신 하나님, 부족한 저희와 변치 않는 언약을 맺어주셔서 감사합니다. 비 온 뒤 아침 햇살처럼 저희 삶에도 소망을 주시니 감사합니다. 오늘도 하나님을 경외하며, 이웃에게 따뜻한 빛이 되는 하루를 살게 해 주시옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"새벽빛이 비쳐오니 (찬송가 552장)"},{"date":"2026-07-06","title":"나의 힘이 되시는 하나님","passage":"사무엘하 22:32-51","scripture":"하나님 곧 나의 반석은 흠이 없으시다. 그가 나의 길을 완전하게 하시며, 나의 발을 암사슴의 발 같게 하시며, 나를 높은 곳에 세워 주신다. (사무엘하 22:33-34, 새번역)","meditation":"다윗은 평생 많은 어려움을 겪었습니다. 도망 다니던 시절, 전쟁의 시절, 가족 안에서의 아픔까지. 그런데 다윗은 그 모든 것을 지나고 나서 이렇게 고백합니다. '하나님이 나의 반석이시고, 나의 힘이시다.' 결국 나를 버티게 해주신 분은 하나님이셨다는 감사의 노래입니다.\n\n우리 삶도 마찬가지입니다. 탄광에서 일하시던 시절, 가족을 먹여 살리느라 고생하시던 날들, 몸이 아프고 외로운 시간들. 그 모든 세월을 돌아보면, 결국 우리를 붙들어 주신 분은 하나님이셨습니다. 내 힘으로 버틴 것 같지만, 사실은 하나님께서 암사슴의 발처럼 우리를 단단하게 세워 주셨습니다.\n\n오늘 말씀은 우리에게 묻습니다. '너의 반석은 누구냐?' 세상의 것들은 다 변합니다. 건강도, 재물도, 사람도 변합니다. 그러나 하나님만은 변하지 않으시고, 흠이 없으신 분이십니다. 오늘도 이 변함없는 하나님을 굳게 붙잡고, 감사와 찬양으로 하루를 시작합시다.","questions":["지나온 삶을 돌아볼 때, 하나님이 나의 반석이 되어주셨던 때는 언제였습니까?","지금 내가 의지하고 있는 것은 무엇이며, 그것이 변하지 않는 것입니까?","오늘 하나님의 힘을 믿고 내려놓아야 할 걱정이 있다면 무엇입니까?"],"practice":"오늘 하루 동안 '하나님은 나의 반석이십니다'를 세 번 소리 내어 고백하며, 지나온 날에 대한 감사를 드립니다.","prayer":"변함없이 우리를 지켜주시는 하나님, 연약한 우리의 발을 단단히 세워 주시니 감사합니다. 오늘도 주님만을 반석 삼아 의지하며 살게 하여 주시옵소서. 우리 교회 어르신들의 몸과 마음을 주님의 힘으로 채워 주시고, 평안한 하루가 되게 하여 주옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"반석 위에 내가 서리"},{"date":"2026-06-19","title":"주님이 나를 넓은 곳으로 이끄시니","passage":"사무엘하 22:17-31","scripture":"그가 높은 곳에서 손을 내밀어 나를 붙잡으시고, 깊은 물에서 나를 건져 주셨다. 나를 대적하는 강한 원수에게서, 나를 미워하는 자들에게서 나를 건져 주셨다. 그들이 나를 치려고 한 날, 그들은 이미 나보다 강하였으나, 주님께서 나의 버팀목이 되어 주셨다. 주님께서 나를 넓은 곳으로 이끌어 내시고, 나를 기뻐하시므로 나를 구해 주셨다. 주님은 나의 등불이시다. 나의 하나님이 나의 어둠을 밝혀 주신다. 하나님의 길은 완전하고, 주님의 말씀은 순수하다. 주님은 자기에게 피하는 모든 사람의 방패이시다.","meditation":"다윗은 온갖 환난과 고난 속에서 하나님을 찬양합니다. 사울에게 쫓기고, 전쟁터에서 생사를 넘나들던 그 모든 세월을 돌아보며, 하나님이 높은 곳에서 손을 내밀어 자기를 붙잡아 주셨다고 고백합니다. 깊은 물에 빠진 것 같은 절망의 순간에도 하나님은 결코 놓지 않으셨습니다.\n\n우리도 살면서 깊은 물 같은 시간을 지날 때가 있습니다. 몸이 아플 때, 외로울 때, 앞이 보이지 않을 때 우리는 깊은 곳에 빠진 것처럼 느낍니다. 그러나 다윗의 고백처럼 하나님은 그 깊은 곳에서 우리를 건져 주시고, 좁고 답답한 곳에서 넓은 곳으로 이끌어 주십니다. 하나님이 우리를 기뻐하시기 때문입니다.\n\n\"주님은 나의 등불이시다.\" 이 고백이 참 따뜻합니다. 캄캄한 밤에 작은 등불 하나가 얼마나 큰 위로가 됩니까. 탄광 속 깊은 어둠에서도 머리에 달린 등불 하나가 길을 밝혀 주듯이, 하나님은 우리 인생의 어둠을 밝혀 주시는 등불이십니다. 하나님께 피하는 사람에게 주님은 반드시 방패가 되어 주십니다. 오늘도 그 빛 안에서 평안하시길 빕니다.","questions":["내 인생에서 하나님이 깊은 물에서 건져 주신 경험이 있다면 언제였습니까?","지금 내가 넓은 곳으로 나아가기 위해 하나님께 맡겨야 할 것은 무엇입니까?","'주님은 나의 등불'이라는 고백이 내 삶에서 어떤 의미로 다가옵니까?"],"practice":"오늘 하루 지나온 삶 가운데 하나님이 지켜 주신 일 한 가지를 떠올리며, 감사의 기도를 드리겠습니다.","prayer":"사랑하는 하나님, 깊은 물 같은 어려움 속에서도 저를 붙잡아 주시고 넓은 곳으로 이끌어 주시니 감사합니다. 캄캄한 날에도 주님이 저의 등불이 되어 주시니 두렵지 않습니다. 오늘도 주님의 빛 안에서 평안히 걷게 하시고, 주님께 피하는 저에게 방패가 되어 주시옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"주 하나님 독생자를 (찬송가 278장)"},{"date":"2026-06-18","title":"나의 반석이신 하나님","passage":"사무엘하 22:1-16","scripture":"다윗이 주님께 이 노래의 말씀을 불렀다. 주님이 모든 원수의 손과 사울의 손에서 그를 건져 주신 날에 불렀다. 다윗이 노래하였다. \"주님은 나의 반석, 나의 요새, 나의 구원자이시다. 하나님은 나의 바위이시니, 내가 그 안에 피한다. 그는 나의 방패이시요, 나의 구원의 뿔이시요, 나의 높은 망대이시요, 나의 피난처이시요, 나의 구원자이시다.\"","meditation":"다윗은 평탄한 길을 걸어온 사람이 아닙니다. 사울에게 쫓기며 광야를 떠돌았고, 수많은 전쟁터에서 생명의 위협을 받았습니다. 그러나 그 모든 고난의 시간이 지나고 나서, 다윗이 가장 먼저 한 일은 하나님께 감사의 노래를 부르는 것이었습니다. 그는 하나님을 '나의 반석, 나의 요새, 나의 구원자'라고 고백합니다.\n\n우리가 사는 태백의 산골짜기도 때로는 험하고 외롭게 느껴질 때가 있습니다. 몸이 아프고, 자녀들은 멀리 떠나있고, 겨울은 길고 춥습니다. 그러나 돌아보면 그 모든 세월을 지켜주신 분이 계십니다. 탄광의 어둠 속에서도, 병원 침대 위에서도, 홀로 밥을 먹는 저녁 식탁에서도 하나님은 우리의 반석이 되어 주셨습니다.\n\n다윗처럼 오늘 우리도 고백합시다. '주님은 나의 반석이시다.' 지나온 날들을 돌아보며 하나님께 감사드릴 때, 앞으로 남은 날들도 하나님이 붙들어 주실 것이라는 믿음이 더욱 단단해집니다. 우리의 하나님은 변함없는 반석이십니다.","questions":["지나온 삶에서 하나님이 나를 지켜주셨다고 느꼈던 순간은 언제인가요?","내가 힘들 때 가장 먼저 의지하는 것은 무엇인가요? 하나님께 먼저 나아가고 있나요?","오늘 감사의 기도를 드린다면, 어떤 내용을 가장 먼저 말씀드리고 싶으신가요?"],"practice":"오늘 하루, 지나온 삶에서 하나님이 지켜주신 일 세 가지를 떠올리며 감사 기도를 드립니다.","prayer":"사랑하는 하나님, 지나온 모든 세월 동안 저를 반석처럼 붙들어 주셔서 감사합니다. 힘들고 외로웠던 날에도 함께하셨음을 고백합니다. 남은 날들도 주님만 의지하며 살아가게 하시고, 이 감사의 마음을 이웃과 나누는 하루가 되게 해 주세요. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"반석 위에 내가 서리"},{"date":"2026-06-17","title":"리스바의 한결같은 사랑","passage":"사무엘하 21:10-22","scripture":"사울의 첩 리스바 곧 아야의 딸이 굵은 베를 가져다가 바위 위에 펴고, 곡식을 거두기 시작할 때부터 하늘에서 비가 쏟아질 때까지, 낮에는 하늘의 새가 그 시체 위에 앉지 못하게 하고, 밤에는 들짐승이 접근하지 못하게 하였다. (사무엘하 21:10)","meditation":"리스바는 사울의 첩이었습니다. 그녀의 두 아들이 기브온 사람들의 요구로 목숨을 잃었습니다. 그녀가 할 수 있는 일은 아무것도 없었습니다. 권력도 없고, 힘도 없는 한 어머니였습니다. 그러나 리스바는 포기하지 않았습니다. 굵은 베를 펴고 바위 위에 앉아, 몇 달이 넘는 긴 시간 동안 밤낮으로 아들들의 시신을 지켰습니다. 새도 들짐승도 가까이 오지 못하게 하였습니다.\n\n이 소식을 들은 다윗 왕은 마음이 움직였습니다. 그래서 사울과 요나단의 유골까지 거두어 정성껏 장사를 지냈습니다. 한 어머니의 한결같은 사랑이 왕의 마음을 움직이고, 죽은 자들의 존엄을 회복시킨 것입니다. 아무도 알아주지 않아도 끝까지 자리를 지킨 리스바의 모습은 참으로 거룩합니다.\n\n우리 탄광촌에도 리스바 같은 어머니들이 계십니다. 자식들을 위해 평생을 묵묵히 헌신하신 분들, 아무도 알아주지 않아도 가정을 지키고 기도로 세워 오신 분들입니다. 하나님은 그 한결같은 사랑을 다 보고 계십니다. 리스바의 사랑이 다윗의 마음을 움직였듯이, 여러분의 사랑과 기도가 하나님의 마음을 움직이고 있습니다.","questions":["나는 누구를 위해 끝까지 포기하지 않고 기도하고 있습니까?","알아주는 사람 없어도 묵묵히 지켜온 자리가 있습니까?","리스바의 사랑처럼 하나님의 마음을 움직이는 사랑은 어떤 것일까요?"],"practice":"오늘 하루, 내가 묵묵히 지켜온 자리의 의미를 돌아보며, 함께 수고하는 이웃에게 감사의 말 한마디를 전하겠습니다.","prayer":"사랑의 하나님, 알아주는 이 없어도 묵묵히 자리를 지키며 살아온 우리의 수고를 주님은 알고 계심을 감사합니다. 리스바처럼 한결같은 사랑으로 가정과 이웃을 지키게 하여 주시고, 지치고 힘든 날에도 포기하지 않는 믿음을 허락하여 주옵소서. 우리의 작은 사랑이 주님의 마음에 닿는 오늘이 되게 하여 주옵소서. 예수님의 이름으로 기도합니다. 아멘.","hymnTitle":"어머니의 넓은 사랑 (찬송가 517장)"},{"date":"2026-06-11","title":"하나님은 오래된 약속도 기억하십니다","passage":"사무엘하 21:1-9","scripture":"다윗이 세 해에 여호와의 얼굴을 구하매 여호와께서 이르시되 이는 사울과 그 피를 흘린 집을 인함이니 그가 기브온 사람을 죽였음이니라","meditation":"다윗 시대에 3년 동안 기근이 계속되었습니다. 다윗이 하나님께 그 이유를 구하자, 하나님은 사울이 기브온 사람들과의 언약을 깨뜨린 것 때문이라고 말씀하셨습니다. 이 언약은 여호수아 시대에 맺은 것으로, 수백 년이 지난 것이었습니다.\n\n놀라운 사실은 하나님이 오래된 언약도 기억하고 계신다는 것입니다. 사울은 기브온 사람들을 죽이면서 아무렇지 않게 생각했을 것입니다. 그러나 하나님의 눈에 언약은 결코 가볍지 않았습니다.\n\n우리도 가볍게 한 약속, 잊어버린 약속들이 있지 않습니까? 사람은 잊어도 하나님은 기억하십니다. 말의 무게, 약속의 무게를 다시 한번 생각해 봅니다. 신실하신 하나님처럼 우리도 약속에 신실한 사람이 되어야 합니다.","questions":["내가 가볍게 여기고 지키지 못한 약속은 없는가?","하나님이 오래된 언약도 기억하신다는 사실이 나에게 어떤 의미인가?","말의 무게를 소중히 여기고 있는가?"],"practice":"오늘 내가 한 약속을 되돌아보고, 지키지 못한 것이 있다면 바로잡겠습니다. 말의 무게를 소중히 여기겠습니다.","prayer":"신실하신 하나님, 언약을 기억하시고 지키시는 주님을 찬양합니다. 저희도 약속에 신실한 사람이 되게 하소서. 우리 동산교회가 말에 신실한 공동체가 되게 하소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 392장 (나의 갈 길 다 가도록)"},{"date":"2026-06-10","title":"작은 자리에서 큰 역할을 하는 지혜","passage":"사무엘하 20:14-26","scripture":"그 성에서 지혜로운 여인 하나가 외쳐 이르되 들으라 들으라 요압에게 이리 가까이 오라고 하라 내가 그에게 말하겠노라","meditation":"세바가 아벨벳마아가 성에 숨자, 요압은 군대를 이끌고 성벽을 허물기 시작합니다. 이때 이름 없는 한 여인이 성벽 위에서 외칩니다. \"들으라! 들으라!\" 그녀는 요압과 대화하여 세바의 목만 넘기면 성을 치지 않겠다는 약속을 받아냅니다.\n\n이 여인은 왕도 아니고, 장군도 아니고, 선지자도 아닙니다. 그저 지혜로운 한 사람이었습니다. 그러나 그녀의 지혜로운 말 한마디가 성 전체를 구했습니다.\n\n하나님은 거창한 자리에 있는 사람만 사용하시는 것이 아닙니다. 작은 자리에서 지혜롭게 말하는 한 사람을 통해서도 역사하십니다. 당신의 지혜로운 한마디가 누군가의 삶을 구할 수 있습니다.","questions":["나는 내가 있는 자리에서 지혜로운 목소리를 내고 있는가?","갈등 상황에서 파괴가 아닌 화해의 말을 하고 있는가?","작은 자리라도 하나님이 쓰실 수 있음을 믿는가?"],"practice":"오늘 말하기 전에 한 번 더 생각하겠습니다. 갈등 상황에서 파괴가 아닌 화해의 말을 하는 사람이 되겠습니다.","prayer":"하나님, 지혜로운 한마디로 공동체를 살리는 사람이 되게 하소서. 작은 자리에서도 주님의 도구로 쓰임받는 기쁨을 누리게 하소서. 우리 동산교회 식구들 모두 지혜로운 말로 서로를 세우게 하소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 453장 (지금까지 지내온 것)"},{"date":"2026-06-09","title":"끊임없는 시련 앞에서 하나님을 의지하라","passage":"사무엘하 20:1-13","scripture":"마침 거기에 불량한 사람 하나가 있으니 그의 이름은 세바라 그가 나팔을 불며 이르되 우리는 다윗과 나눌 분깃이 없다","meditation":"다윗이 겨우 왕좌를 되찾았는데, 또다시 반란이 일어납니다. 베냐민 사람 세바가 나팔을 불며 이스라엘을 선동한 것입니다. 압살롬의 반란에서 겨우 돌아왔는데 왜 또 전쟁인가. 다윗의 마음이 얼마나 무거웠을까요.\n\n한 가지 위기가 지나면 또 다른 위기가 찾아옵니다. 이것이 인생입니다. 문제가 없는 삶이 아니라, 문제를 어떻게 대처하느냐가 중요합니다. 다윗은 지치고 힘들었지만 즉시 대응했습니다.\n\n우리의 삶에도 세바 같은 일들이 반복됩니다. 하나를 해결하면 또 하나가 생깁니다. 그러나 기억하십시오. 압살롬의 반란도 이기셨던 하나님이 세바의 반란도 이기게 하십니다. 지치지 마십시오.","questions":["반복되는 어려움 앞에서 나는 지치고 있는가, 아니면 하나님을 의지하고 있는가?","지난 위기를 이겨낸 경험이 오늘의 힘이 되고 있는가?","다윗처럼 즉시 대응하는 담대함이 있는가?"],"practice":"오늘 마주하는 문제 앞에서 \"또?\"라며 좌절하지 않고, \"이것도 이기게 하실 하나님\"을 신뢰하겠습니다.","prayer":"하나님, 끊임없이 찾아오는 문제 앞에서 지치지 않게 하소서. 어제의 승리를 주신 하나님이 오늘도 함께하심을 믿고 담대히 나아가게 하소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 384장 (주 예수 내 맘에 들어와)"},{"date":"2026-06-08","title":"보상을 바라지 않는 참된 섬김","passage":"사무엘하 19:31-43","scripture":"바르실래는 매우 늙어 나이가 팔십 세라 그가 왕이 마하나임에 있을 때에 왕을 먹였으니 심히 부한 사람이었더라","meditation":"80세의 바르실래가 다윗을 맞이하러 요단까지 나옵니다. 다윗이 광야로 도망갔을 때 음식과 잠자리를 제공했던 그 바르실래입니다. 다윗은 감사하여 예루살렘에서 함께 살자고 제안하지만, 바르실래는 사양합니다.\n\n\"종이 어찌 다시 먹고 마시는 것을 맛보겠습니까?\" 그는 자신의 한계를 알고 있었습니다. 대신 젊은 긴함을 보내며 왕의 은혜를 다음 세대에 넘깁니다.\n\n바르실래의 모습에서 진정한 충성이 무엇인지 배웁니다. 보상을 바라지 않는 섬김, 자기를 내세우지 않는 겸손, 다음 세대를 세우는 지혜. 이것이 하나님이 기뻐하시는 충성입니다.","questions":["나의 섬김은 보상을 기대하는 것인가, 순수한 사랑에서 나오는 것인가?","바르실래처럼 다음 세대를 세우는 마음이 있는가?","자신의 한계를 인정하는 겸손함을 가지고 있는가?"],"practice":"오늘 아무런 대가 없이 누군가를 섬기겠습니다. 바르실래처럼 보상보다 관계를 소중히 여기는 마음을 가지겠습니다.","prayer":"하나님, 바르실래의 겸손과 충성을 본받게 하소서. 보상을 바라지 않고 섬기며, 다음 세대를 세우는 지혜를 주옵소서. 우리 동산교회가 섬김의 공동체가 되게 하소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 430장 (너 근심 걱정 말아라)"},{"date":"2026-06-07","title":"왕 앞에 드러나는 각자의 진심","passage":"사무엘하 19:16-30","scripture":"시므이가 급히 유다 사람들과 함께 내려가서 다윗 왕을 맞으며","meditation":"다윗이 예루살렘으로 돌아오자 사람들이 그를 맞이하러 나옵니다. 그중에는 다윗이 도망칠 때 저주하며 돌을 던졌던 시므이도 있었습니다. 시므이는 엎드려 용서를 구했고, 다윗은 그를 죽이지 않겠다고 맹세합니다.\n\n또한 므비보셋도 찾아옵니다. 시바의 거짓말로 오해를 받았지만, 그는 다윗이 떠난 날부터 돌아오는 날까지 발도 씻지 않고 수염도 깎지 않으며 왕을 기다렸습니다. 다윗이 재산을 둘로 나누라 하자 므비보셋은 말합니다. \"왕께서 평안히 돌아오셨으니 시바가 다 가져도 좋습니다.\"\n\n돌아오는 왕 앞에 각자의 진심이 드러납니다. 시므이의 두려움, 므비보셋의 충성, 시바의 교활함. 주님이 다시 오실 때 우리는 어떤 모습으로 그분을 맞이하게 될까요?","questions":["주님 앞에 설 때 나의 진짜 마음은 어떤 모습일까?","므비보셋처럼 한결같은 마음으로 주님을 기다리고 있는가?","환경에 따라 태도가 바뀌는 시므이 같은 모습은 없는가?"],"practice":"겉으로 보이는 모습이 아니라 마음의 진실함을 점검하겠습니다. 므비보셋처럼 한결같은 마음으로 주님을 기다리겠습니다.","prayer":"하나님, 환경에 따라 흔들리지 않는 한결같은 마음을 주옵소서. 주님이 다시 오실 때 기쁨으로 맞이할 수 있는 신실한 종이 되게 하소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 288장 (나 주를 멀리 떠났다)"},{"date":"2026-06-06","title":"슬픔을 딛고 일어서는 믿음","passage":"사무엘하 19:1-15","scripture":"왕이 얼굴을 가리고 큰 소리로 부르짖어 이르되 내 아들 압살롬아 압살롬아 내 아들 내 아들아 하니","meditation":"압살롬이 죽은 후 다윗은 슬픔에 잠겨 나라를 돌보지 못했습니다. 승리한 군사들은 마치 패배한 것처럼 성으로 돌아왔고, 왕의 깊은 통곡 소리만 울려 퍼졌습니다.\n\n이때 요압이 다윗에게 직언합니다. \"왕이 오늘 왕의 생명과 아들딸의 생명을 구한 모든 신하의 낯을 부끄럽게 하셨습니다.\" 요압의 말은 거칠었지만 진실이었습니다. 리더의 슬픔이 공동체 전체를 무너뜨릴 수 있다는 경고였습니다.\n\n다윗은 마침내 슬픔에서 일어나 성문에 앉았습니다. 슬퍼할 때가 있고 일어설 때가 있습니다. 하나님은 우리의 눈물을 허락하시지만, 동시에 다시 일어서라고 부르십니다. 슬픔 속에 머무는 것이 아니라 슬픔을 딛고 일어서는 것이 믿음입니다.","questions":["나는 슬픔에 머물러 있는가, 아니면 다시 일어설 준비가 되어 있는가?","요압처럼 나에게 진실을 말해주는 사람이 있는가?","슬픔 속에서도 하나님의 부르심에 응답할 수 있는가?"],"practice":"오늘 마음속 슬픔이나 미련 하나를 하나님께 맡기고, 맡겨진 자리에서 한 걸음 내딛겠습니다.","prayer":"하나님, 슬퍼할 때 함께 울어주시고, 일어설 때 손을 잡아주시는 주님을 의지합니다. 슬픔에 머물지 않고 다시 일어서는 믿음을 주옵소서. 우리 동산교회 식구들에게도 일어서는 힘을 주옵소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 370장 (나의 생명 드리니)"},{"date":"2026-06-05","title":"차라리 내가 대신 죽었더라면","passage":"사무엘하 18:19-33","scripture":"왕이 심히 슬퍼하여 문루에 올라가며 울며 이르되 내 아들 압살롬아 내 아들 내 아들 압살롬아 차라리 내가 너를 대신하여 죽었더라면 압살롬 내 아들아 내 아들아 하니라","meditation":"전쟁은 끝났고 다윗은 승리했습니다. 그러나 아들 압살롬의 죽음 소식을 들은 다윗은 기쁨 대신 통곡합니다. \"내 아들 압살롬아, 차라리 내가 너를 대신하여 죽었더라면!\"\n\n왕으로서는 반역자를 제거한 승리였지만, 아버지로서는 자식을 잃은 참담한 패배였습니다. 다윗의 눈물은 자식을 대신해 죽겠다는 아버지의 처절한 사랑을 보여줍니다.\n\n이 장면은 우리를 위해 실제로 대신 죽으신 하나님의 사랑을 미리 보여줍니다. 다윗은 \"차라리 내가 죽었더라면\"이라고 말만 했지만, 하나님은 실제로 독생자를 보내어 우리를 대신하여 죽게 하셨습니다. 그것이 십자가의 사랑입니다. 우리를 대신하여 아들을 내어주신 그 사랑 앞에 오늘 무릎을 꿇습니다.","questions":["나를 대신하여 죽으신 예수 그리스도의 사랑이 오늘 나의 삶을 어떻게 변화시키고 있는가?","다윗의 통곡에서 하나님 아버지의 마음을 느낄 수 있는가?","십자가의 사랑을 묵상할 때 내 마음에 어떤 변화가 일어나는가?"],"practice":"십자가 앞에서 조용히 묵상하는 시간을 갖겠습니다. \"차라리 내가 죽었더라면\"이라는 아버지의 마음을 실제로 이루신 하나님의 사랑에 감사하겠습니다.","prayer":"사랑의 하나님, 말로만이 아니라 실제로 아들을 보내어 대신 죽게 하신 주님의 사랑이 너무나 크십니다. 그 사랑 앞에 무릎 꿇고 감사와 찬양을 드립니다. 우리 동산교회가 이 십자가의 사랑을 깊이 묵상하고, 그 사랑으로 서로를 섬기는 공동체가 되게 하여 주옵소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 150장 (죽으신 주를 생각할 때)"},{"date":"2026-06-04","title":"반역한 아들도 품는 아버지의 사랑","passage":"사무엘하 18:1-18","scripture":"왕이 요압과 아비새와 잇대에게 명령하여 이르되 내가 너희에게 부탁하노니 그 청년 압살롬을 너그럽게 대우하라 하니 왕이 모든 장수에게 압살롬을 위하여 부탁하는 것을 모든 백성이 들었더라","meditation":"전투를 앞두고 다윗은 장수들에게 단 하나의 부탁을 합니다. \"압살롬을 너그럽게 대우하라.\" 왕좌를 빼앗고 목숨을 위협하는 아들이지만, 다윗에게 그는 여전히 사랑하는 아들이었습니다.\n\n전투는 다윗의 군대가 승리했고, 압살롬은 노새를 타고 도망치다 상수리나무 가지에 머리가 걸려 매달렸습니다. 요압은 왕의 명령을 어기고 압살롬의 가슴에 창을 꽂았습니다.\n\n아버지의 마음은 반역한 자식조차 품으려 합니다. 이것은 우리를 향한 하나님의 마음이기도 합니다. 하나님을 떠나 반역하는 우리를 향해 여전히 \"너그럽게 대우하라\"고 말씀하시는 아버지의 사랑, 그것이 복음입니다. 자녀를 향한 부모의 사랑이 이토록 깊은데, 하물며 하나님 아버지의 사랑은 얼마나 더 크겠습니까.","questions":["나를 향한 하나님 아버지의 변함없는 사랑을 얼마나 깊이 느끼고 있는가?","나를 실망시킨 누군가를 다윗의 마음으로 용서할 수 있는가?","하나님이 나를 용서하셨듯이 나도 다른 사람을 용서하고 있는가?"],"practice":"나를 실망시킨 누군가를 떠올리며, 다윗의 마음으로 용서의 기도를 드리겠습니다. 하나님이 나를 용서하셨듯이 나도 그렇게 하겠습니다.","prayer":"아버지 하나님, 반역하는 자녀까지 사랑하시는 주님의 크신 사랑에 감사합니다. 그 사랑을 깊이 묵상하며, 저도 용서하고 품는 사람이 되게 하소서. 우리 동산교회가 하나님의 사랑을 닮아가는 가정이 되게 하여 주옵소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 305장 (나 같은 죄인 살리신)"},{"date":"2026-06-03","title":"광야에서도 먹이시는 하나님","passage":"사무엘하 17:15-29","scripture":"바르실래와 소비와 마길이 침상과 대야와 질그릇과 밀과 보리와 밀가루와 볶은 곡식과 콩과 팥과 볶은 녹두와 꿀과 엉긴 젖과 양과 치즈를 가져다가 다윗과 그 함께 있는 백성에게 먹게 하였으니 그들이 말하기를 이 백성이 광야에서 시장하고 피곤하고 목마를 것이라 하였더라","meditation":"다윗이 압살롬의 반란을 피해 광야로 도망갔을 때, 그는 가장 외롭고 지친 순간을 맞이하고 있었습니다. 왕좌에서 쫓겨난 자에게 누가 손을 내밀겠습니까?\n\n그런데 놀라운 일이 벌어졌습니다. 소비와 마길과 바르실래가 침상과 음식을 가져와 다윗의 무리를 먹이고 쉬게 한 것입니다. 그들은 \"이 백성이 광야에서 시장하고 피곤하고 목마를 것이라\"며 자발적으로 섬겼습니다.\n\n하나님은 도망자에게도 먹이는 손들을 준비해 두십니다. 우리가 가장 낮은 곳에 있을 때, 예상치 못한 곳에서 하나님의 손길이 찾아옵니다. 태백의 추운 겨울에도 따뜻한 손길을 보내주시는 분들이 있었습니다. 그것이 바로 하나님이 보내신 손입니다. 그리고 때로 우리가 바로 누군가를 위한 그 손이 되어야 합니다.","questions":["내 주변에 지치고 외로운 누군가에게 나는 어떤 손이 되고 있는가?","광야 같은 상황에서 하나님이 보내신 도움의 손길을 경험한 적이 있는가?","바르실래처럼 아무런 대가 없이 섬기는 마음을 가지고 있는가?"],"practice":"오늘 힘들어하는 한 사람에게 따뜻한 말 한마디, 작은 도움 하나를 건네겠습니다. 내가 받은 은혜를 나누는 통로가 되겠습니다.","prayer":"사랑의 하나님, 광야 같은 삶 속에서도 먹이시고 채우시는 주님을 찬양합니다. 저희도 누군가에게 주님의 손과 발이 되게 하소서. 우리 동산교회 식구들이 서로를 돌보고 섬기는 따뜻한 공동체가 되게 하여 주옵소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 461장 (나 같은 죄인 살리신)"},{"date":"2026-04-29","title":"점점 강해지는 하나님의 뜻","passage":"사무엘하 3:1-5","scripture":"사울의 집과 다윗의 집 사이에 오랫동안 전쟁이 계속되었다. 다윗은 점점 강해지고, 사울의 집은 점점 약해져 갔다. 헤브론에서 다윗이 얻은 아들들은 다음과 같다. 맏아들은 이스르엘 사람 아히노암에게서 난 암논이고, 둘째는 갈멜 사람 나발의 아내였던 아비가일에게서 난 길르압이고, 셋째는 그술 왕 달매의 딸 마아가에게서 난 압살롬이고, 넷째는 학깃에게서 난 아도니야이고, 다섯째는 아비달에게서 난 스바댜이고, 여섯째는 다윗의 아내 에글라에게서 난 이드르암이다. 이 아들들은 헤브론에서 다윗이 얻은 아들들이다.","meditation":"사울이 세상을 떠난 뒤에도 이스라엘에는 바로 평화가 찾아오지 않았습니다. 사울의 집안과 다윗의 집안 사이에 오랜 다툼이 이어졌습니다. 그러나 성경은 분명하게 말합니다. '다윗은 점점 강해지고, 사울의 집은 점점 약해져 갔다.' 하나님께서 세우신 사람은 비록 시간이 걸리더라도 반드시 일어서게 되어 있습니다.\n\n우리 삶에도 이런 '오랜 기다림의 시간'이 있습니다. 탄광이 문을 닫고 젊은이들이 떠나간 뒤, 태백의 겨울은 참 길고 춥습니다. 당장 눈에 보이는 변화가 없어도 낙심하기 쉽습니다. 그러나 하나님은 조용히, 그러나 확실하게 일하고 계십니다. 봄이 하루아침에 오지 않듯이, 하나님의 뜻도 '점점' 이루어집니다. 조급해하지 않아도 됩니다.\n\n다윗이 헤브론에서 가정을 이루며 하나님의 때를 기다렸듯이, 우리도 오늘 주어진 자리에서 성실하게 살아가면 됩니다. 하나님이 약속하신 것은 반드시 이루어집니다. 지금 힘드시더라도, 오늘 하루도 하나님이 우리를 '점점' 강하게 세워 가고 계심을 믿으시기 바랍니다.","questions":["내 삶에서 오랫동안 기다리고 있는 일이 있다면 무엇인가요?","하나님이 '점점' 일하고 계신다는 것을 느꼈던 경험이 있으신가요?","기다림의 시간에 나를 붙잡아 주는 믿음의 힘은 어디에서 오나요?"],"practice":"오늘 하루, 조급한 마음을 내려놓고 '하나님, 당신의 때를 믿습니다'라고 세 번 고백해 봅시다.","prayer":"사랑의 하나님, 빨리 이루어지지 않는다고 조급해하는 우리 마음을 어루만져 주옵소서. 주님께서 점점 강하게 세워 가시는 그 손길을 오늘도 믿고 의지하게 하옵소서. 기다림의 시간 속에서도 감사하며 살아가는 우리 교우들 되게 하여 주옵소서. 예수 그리스도의 이름으로 기도합니다. 아멘.","hymnTitle":"찬송가 384장 (반석 위에 내가 서니)"}];</script>
