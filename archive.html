<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설교·말씀 아카이브 — 동산감리교회</title>
<meta name="description" content="동산감리교회 설교말씀과 오늘의 말씀을 한눈에 찾아보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --brick:#b3593f; --brick2:#c96f52; --brick-deep:#8f4531;
  --moss:#7c9a68; --moss2:#5f7d4d; --gold:#c99a3f;
  --cream:#fbf3e7; --paper:#fffaf2; --warm:#f4e6d3; --stone:#e7d6bd;
  --text:#3a2e22; --text2:#6b5a45; --text3:#95836b; --white:#ffffff; --border:#e0cca9;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--text);font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:17px;line-height:1.7;word-break:keep-all;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:0 1.75rem}

nav{position:sticky;top:0;z-index:300;background:rgba(251,243,231,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);height:70px;display:flex;align-items:center}
.nav-inner{width:100%;max-width:1120px;margin:0 auto;padding:0 1.75rem;display:flex;align-items:center}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-mark{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(145deg,var(--brick2),var(--brick-deep));display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:'Gowun Batang',serif;font-weight:700;font-size:1.05rem}
.nav-name{font-family:'Gowun Batang',serif;font-size:1.05rem;font-weight:700;color:var(--brick-deep)}
.nav-sub{font-size:.66rem;color:var(--moss2);letter-spacing:.04em;margin-top:1px}
.nav-back{margin-left:auto;display:flex;align-items:center;gap:.4rem;font-size:.86rem;font-weight:700;color:var(--text2);padding:.55rem 1.1rem;border-radius:999px;border:1px solid var(--border);background:var(--white)}
.nav-back:hover{color:var(--brick-deep);border-color:var(--brick2)}

.hero{padding:3.4rem 0 1.6rem;text-align:center}
.hero h1{font-family:'Gowun Batang',serif;font-size:clamp(1.7rem,4vw,2.3rem);font-weight:700;margin-bottom:.6rem}
.hero p{color:var(--text2);font-size:.98rem}

.tools{position:sticky;top:70px;z-index:200;background:var(--cream);padding:1.2rem 0;border-bottom:1px solid var(--border)}
.tabs{display:flex;gap:.6rem;margin-bottom:.9rem}
.tab{flex:1;text-align:center;padding:.75rem;border-radius:12px;border:1px solid var(--border);background:var(--white);font-weight:700;font-size:.92rem;color:var(--text2);cursor:pointer}
.tab.active{background:var(--brick);color:var(--paper);border-color:var(--brick)}
.search{position:relative}
.search input{width:100%;padding:.85rem 1.1rem .85rem 2.6rem;border-radius:12px;border:1px solid var(--border);background:var(--white);font-family:inherit;font-size:.95rem;color:var(--text)}
.search input:focus{outline:none;border-color:var(--brick2)}
.search .ico{position:absolute;left:.95rem;top:50%;transform:translateY(-50%);opacity:.5}

.list{padding:1.6rem 0 4rem;display:flex;flex-direction:column;gap:.9rem}
.card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:1.2rem 1.4rem;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.card:hover{box-shadow:0 10px 26px rgba(143,69,49,.1);border-color:var(--brick2)}
.card-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.card-date{font-size:.78rem;font-weight:700;color:var(--gold)}
.card-series{font-size:.78rem;color:var(--text3)}
.card-title{font-family:'Gowun Batang',serif;font-size:1.12rem;font-weight:700;color:var(--text);margin-top:.4rem}
.card-scripture{font-size:.86rem;color:var(--text3);margin-top:.3rem}
.card-body{display:none;margin-top:1rem;padding-top:1rem;border-top:1px dashed var(--border);font-size:.92rem;color:var(--text2);line-height:1.8}
.card.open .card-body{display:block}
.card-body h4{font-size:.82rem;color:var(--moss2);font-weight:700;margin:.9rem 0 .4rem}
.card-body h4:first-child{margin-top:0}
.card-body ul{padding-left:1.2rem}
.card-body li{margin-bottom:.35rem}
.empty{text-align:center;color:var(--text3);padding:3rem 1rem;font-size:.92rem;line-height:1.9}
.cats{display:flex;gap:.5rem;flex-wrap:wrap;margin:.9rem 0 .2rem}
.cat{font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;padding:.55rem 1.1rem;
  border-radius:999px;border:1px solid var(--border);background:var(--paper);color:var(--text2)}
.cat.active{background:var(--brick);border-color:var(--brick);color:var(--paper)}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-mark">동</div>
      <div><div class="nav-name">동산감리교회</div><div class="nav-sub">DONGSAN METHODIST CHURCH</div></div>
    </a>
    <a href="index.html" class="nav-back">← 홈으로</a>
  </div>
</nav>

<header class="hero wrap">
  <h1>설교·말씀 아카이브</h1>
  <p>지난 설교와 오늘의 말씀을 한눈에 찾아보세요.</p>
</header>

<div class="tools wrap">
  <div class="tabs">
    <div class="tab active" id="tabSermon">📖 설교말씀</div>
    <div class="tab" id="tabDaily">✝ 오늘의 말씀</div>
  </div>
  <div class="cats" id="sermonCats"></div>
  <div class="search">
    <span class="ico">🔍</span>
    <input type="text" id="searchInput" placeholder="제목이나 본문(성경구절)으로 검색해보세요">
  </div>
</div>

<div class="wrap">
  <div class="list" id="list"></div>
</div>

<script>
// 설교는 sermons.json(담임목사가 올린 말씀 요약),
// 오늘의 말씀은 word-today.json(매일 아침 5시 자동 게시)에서 읽어 온다.
let sermons = [];
let dailywords = [];
let tab = 'sermon';
let sermonBook = '';
let sermonBooks = [];

async function loadData() {
  try {
    const r = await fetch('sermons.json', { cache: 'no-store' });
    const d = r.ok ? await r.json() : null;
    sermons = (d && Array.isArray(d.sermons)) ? d.sermons : [];
    sermonBooks = (d && Array.isArray(d.categories) && d.categories.length)
      ? d.categories.map(c => c.key)
      : [...new Set(sermons.map(x => x.book))];
    sermonBook = sermonBooks[0] || '';
  } catch (e) { sermons = []; sermonBooks = []; }

  try {
    const r = await fetch('word-today.json', { cache: 'no-store' });
    const d = r.ok ? await r.json() : null;
    dailywords = d && d.passage ? [{
      date: d.date, title: d.title, passage: d.passage,
      scripture: d.verseSnippet || '',
      meditation: (d.adult && d.adult.questions || []).join('  /  '),
      practice: d.kids && d.kids.mission ? '어린이 미션 · ' + d.kids.mission : '',
      prayer: d.adult && d.adult.prayer || ''
    }] : [];
  } catch (e) { dailywords = []; }

  render();
}

function esc(s) { return String(s || '').replace(/</g, '&lt;'); }

function sermonCard(s, i) {
  const points = (s.keyPoints || []).filter(Boolean);
  return `<div class="card" data-i="${i}">
    <div class="card-top">
      <span class="card-date">${esc(s.series || s.book || '')}</span>
    </div>
    <div class="card-title">${esc(s.title || '제목 없음')}</div>
    <div class="card-scripture">📖 ${esc(s.scripture) || '본문 미기재'}</div>
    <div class="card-body">
      ${s.summary ? `<h4>요약</h4><p>${esc(s.summary)}</p>` : ''}
      ${points.length ? `<h4>말씀의 흐름</h4><ul>${points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
      ${s.conclusion ? `<h4>맺는 말씀</h4><p>${esc(s.conclusion)}</p>` : ''}
      ${(s.hymns || []).length ? `<h4>찬송</h4><p>${(s.hymns || []).map(esc).join(' · ')}</p>` : ''}
    </div>
  </div>`;
}

function dailyCard(d, i) {
  return `<div class="card" data-i="${i}">
    <div class="card-top"><span class="card-date">${esc((d.date || '').replace(/-/g, '.'))}</span></div>
    <div class="card-title">${esc(d.title || '오늘의 말씀')}</div>
    <div class="card-scripture">📖 ${esc(d.passage) || ''}</div>
    <div class="card-body">
      ${d.scripture ? `<h4>말씀</h4><p>${esc(d.scripture)}</p>` : ''}
      ${d.meditation ? `<h4>묵상</h4><p>${esc(d.meditation)}</p>` : ''}
      ${d.practice ? `<h4>오늘의 실천</h4><p>${esc(d.practice)}</p>` : ''}
      ${d.prayer ? `<h4>기도</h4><p>${esc(d.prayer)}</p>` : ''}
      ${d.hymnTitle ? `<h4>찬송</h4><p>${esc(d.hymnTitle)}</p>` : ''}
    </div>
  </div>`;
}

function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = document.getElementById('list');
  const cats = document.getElementById('sermonCats');
  cats.style.display = tab === 'sermon' ? 'flex' : 'none';
  if (tab === 'sermon') renderCats();
  const source = tab === 'sermon'
    ? sermons.filter(x => x.book === sermonBook)
    : dailywords;
  const filtered = !q ? source : source.filter(x =>
    (x.title || '').toLowerCase().includes(q) ||
    (x.scripture || '').toLowerCase().includes(q) ||
    (x.passage || '').toLowerCase().includes(q)
  );
  if (!filtered.length) {
    const emptyMsg = tab === 'sermon'
      ? (sermons.length ? `${esc(sermonBook)} 설교가 아직 없습니다.` : '아직 등록된 설교가 없습니다.<br>새 말씀이 올라오면 요약과 함께 게시됩니다.')
      : '오늘의 말씀을 불러오지 못했습니다.<br>매일 아침 5시에 새 말씀이 올라옵니다.';
    list.innerHTML = `<div class="empty">${q ? '검색 결과가 없습니다.' : emptyMsg}</div>`;
    return;
  }
  list.innerHTML = filtered.map((x, i) => tab === 'sermon' ? sermonCard(x, i) : dailyCard(x, i)).join('');
  list.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => el.classList.toggle('open'));
  });
}

document.getElementById('tabSermon').addEventListener('click', () => {
  tab = 'sermon';
  document.getElementById('tabSermon').classList.add('active');
  document.getElementById('tabDaily').classList.remove('active');
  render();
});
document.getElementById('tabDaily').addEventListener('click', () => {
  tab = 'daily';
  document.getElementById('tabDaily').classList.add('active');
  document.getElementById('tabSermon').classList.remove('active');
  render();
});
function renderCats() {
  const wrap = document.getElementById('sermonCats');
  wrap.innerHTML = sermonBooks
    .map(b => `<button type="button" class="cat${b === sermonBook ? ' active' : ''}" data-book="${esc(b)}">${esc(b)}</button>`)
    .join('');
  wrap.querySelectorAll('.cat').forEach(btn => {
    btn.addEventListener('click', () => { sermonBook = btn.dataset.book; render(); });
  });
}
document.getElementById('searchInput').addEventListener('input', render);

loadData();
</script>
</body>
</html>
