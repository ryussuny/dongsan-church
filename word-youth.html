<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<script src="install-btn.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="동산 말씀">
<title>청년·청소년 말씀 — 동산감리교회</title>
<meta name="description" content="하루 3분, 오늘의 말씀과 질문 하나, 도전 하나. 동산감리교회 청년·청소년을 위한 아침 묵상.">
<meta name="theme-color" content="#1a2a52">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   B · 새벽빛 — 청년·청소년. 새벽 하늘 머리, 들으며 따라 읽기,
   「오늘의 한 구절」 카드(이미지·공유), 질문 → 도전
   어두운 화면이 기본 느낌이고, 밝은 화면에서도 머리는 새벽 하늘 그대로
   =========================================================== */
:root{--bg:#f3f1f7;--card:#ffffff;--ink:#141a33;--ink2:#4b5070;--ink3:#7a7f99;--line:#e1deec;--acc:#f2b84b;--acc-ink:#0e1830;--acc-tx:#8a5300;
  --soft:#eeebf6;--kv:#f4ead2;--kv-ink:#1c1a2e;--now:#fff1cf;--fs:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1830;--card:#17234a;--ink:#ece5d6;--ink2:#c9c1d9;--ink3:#9893b0;--line:#2c3b6d;--acc-tx:#f2b84b;--soft:#1f2c58;--now:#1f2c58}}
:root[data-theme="dark"]{--bg:#0e1830;--card:#17234a;--ink:#ece5d6;--ink2:#c9c1d9;--ink3:#9893b0;--line:#2c3b6d;--acc-tx:#f2b84b;--soft:#1f2c58;--now:#1f2c58}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:var(--fs);line-height:1.7;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 70px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.top a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;min-height:44px;display:flex;align-items:center}
#themeSlot{display:flex}
#themeSlot #themeBtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:17px;cursor:pointer}
.tag{font-size:12px;font-weight:700;color:var(--acc-ink);background:var(--acc);padding:4px 10px;border-radius:99px}
/* 새벽 하늘 머리 */
.hero{position:relative;border-radius:26px;overflow:hidden;background:#1a2a52;color:#fbf6ea}
.hero svg{display:block;width:100%;height:auto}
.hero .hx{position:absolute;left:20px;right:20px;top:16px}
.hero .chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;letter-spacing:.04em;background:rgba(14,24,48,.5);padding:5px 12px;border-radius:999px}
.hero .k{margin-top:14px;font-size:12.5px;font-weight:700;color:#f2b84b;letter-spacing:.06em}
.hero .ttl{font-family:'Gowun Batang',serif;font-size:29px;font-weight:700;line-height:1.3;margin-top:6px;max-width:80%}
.hero .ref{margin-top:6px;font-size:14px;color:#c9c1d9}
.hero .fe{display:inline-block;margin-left:6px;background:#f2b84b;color:#0e1830;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px}
.hero .nav{position:absolute;right:12px;top:12px;display:flex;gap:6px}
.hero .nav button{width:40px;height:40px;border-radius:50%;border:none;background:rgba(14,24,48,.5);color:#fbf6ea;font:inherit;font-size:20px;cursor:pointer}
.hero .nav button:disabled{opacity:.35}
/* 듣기 막대 */
.player{position:relative;margin:-22px 10px 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;
  box-shadow:0 8px 24px rgba(14,24,48,.12)}
.player[hidden]{display:none}
.pl-btn{flex:none;width:58px;height:58px;border-radius:50%;border:none;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pl-btn svg{width:24px;height:24px}
.pl-tx{flex:1;min-width:0}
.pl-tx b{display:block;font-size:16px}
.pl-tx small{display:block;font-size:13px;color:var(--ink3)}
.pl-rate{flex:none;min-width:52px;height:36px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.pl-bar{flex:1 1 100%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pl-bar i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .4s}
/* 본문 — 한 절씩 */
.sec{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
.sec h3{font-size:12.5px;font-weight:900;letter-spacing:.12em;color:var(--acc-tx);margin-bottom:10px}
.sec p{margin-bottom:10px;color:var(--ink2);line-height:1.85}
.sec p:last-child{margin-bottom:0}
details summary{cursor:pointer;font-weight:700;color:var(--ink);list-style:none;min-height:32px;display:flex;align-items:center;gap:6px}
details summary::-webkit-details-marker{display:none}
details summary::before{content:'▸';color:var(--acc-tx)}
details[open] summary::before{content:'▾'}
.bible{margin-top:12px;display:flex;flex-direction:column;gap:12px;font-family:'Gowun Batang',serif;font-size:1.1em;line-height:1.85}
.yl{display:block;border-radius:14px;transition:background-color .25s,opacity .25s}
.yl b{font-family:'Noto Sans KR',sans-serif;font-size:.62em;color:var(--ink3);margin-right:8px;vertical-align:.2em}
.yl.key b{color:var(--acc-tx)}
.yl.now{background:var(--now);padding:10px 14px;font-weight:700;font-size:1.08em}
.yl.now b{color:var(--acc-tx)}
.yl.past{opacity:.5}
.gos{background:var(--soft);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:.95em;color:var(--ink2)}
.gos b{display:block;font-size:12px;letter-spacing:.1em;color:var(--acc-tx);margin-bottom:2px}
/* 오늘의 한 구절 */
.kv{position:relative;overflow:hidden;margin-top:14px;border-radius:24px;background:var(--kv);color:var(--kv-ink);padding:24px 20px 18px}
.kv::before,.kv::after{content:'';position:absolute;border-radius:50%;pointer-events:none}
.kv::before{right:-24px;top:-24px;width:96px;height:96px;background:#f2b84b;opacity:.35}
.kv::after{right:-38px;top:-38px;width:124px;height:124px;border:1.5px solid #f2b84b;opacity:.45}
.kv small{display:block;font-size:12.5px;font-weight:900;letter-spacing:.12em;color:#7a4d12}
.kv .v{position:relative;margin-top:10px;font-family:'Gowun Batang',serif;font-size:22px;line-height:1.6;font-weight:700}
.kv .vr{margin-top:6px;font-size:13.5px;color:#5a5468}
.kv .one{margin-top:14px;padding-top:12px;border-top:1px solid rgba(28,26,46,.15);font-size:15px;font-weight:700;line-height:1.6}
.kv .acts{display:flex;gap:8px;margin-top:16px}
.kv .acts button{flex:1;min-height:48px;border-radius:14px;font:inherit;font-size:14.5px;font-weight:700;cursor:pointer;border:1.5px solid #1c1a2e;background:transparent;color:#1c1a2e}
.kv .acts button.f{background:#1c1a2e;color:#f4ead2}
.q{font-weight:500;font-size:1.06em;color:var(--ink);line-height:1.75}
label.f{display:block;margin-top:14px;font-size:13px;color:var(--ink3)}
textarea{width:100%;min-height:96px;margin-top:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-size:15px;line-height:1.6;resize:vertical}
.row{display:flex;gap:8px;margin-top:10px}
.row button,.chal button{flex:1;border:0;border-radius:14px;min-height:50px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
.b2{background:var(--acc);color:var(--acc-ink)}
.chal{display:flex;gap:12px;align-items:center}
.chal .t{flex:1;font-weight:700;color:var(--ink)}
.chal button{flex:none;min-width:96px;background:var(--acc);color:var(--acc-ink)}
.chal button.done{background:var(--soft);color:var(--acc-tx)}
.streak{font-size:12.5px;color:var(--ink3);margin-top:8px}
.read{width:100%;margin-top:16px;border:0;border-radius:18px;min-height:58px;font:inherit;font-weight:900;font-size:16px;cursor:pointer;background:var(--ink);color:var(--bg)}
.read.done{background:var(--soft);color:var(--acc-tx)}
#videoSlot{margin-top:4px}
.foot{text-align:center;font-size:13px;color:var(--ink3);margin-top:18px;line-height:2}
.foot a{color:var(--ink2);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="word.html">← 말씀</a><span style="display:flex;align-items:center;gap:8px"><span class="tag">청년 · 청소년</span><span id="themeSlot"></span></span></div>
  <div data-install-slot></div>
  <div class="hero" id="hero">
    <svg viewBox="0 0 390 300" aria-hidden="true">
      <rect width="390" height="300" fill="#1a2a52"/><rect y="120" width="390" height="180" fill="#2d3c6b"/><rect y="178" width="390" height="122" fill="#5a4f7a"/>
      <circle cx="292" cy="214" r="120" fill="none" stroke="#f2b84b" stroke-opacity=".14" stroke-width="1.5"/>
      <circle cx="292" cy="214" r="88" fill="none" stroke="#f2b84b" stroke-opacity=".28" stroke-width="1.5"/>
      <circle cx="292" cy="214" r="58" fill="#f2b84b"/>
      <path d="M0 238C70 204 130 214 190 232S320 222 390 200V300H0Z" fill="#24305a"/>
      <path d="M0 274C90 248 170 262 240 276S350 270 390 260V300H0Z" fill="#0e1830"/>
      <circle cx="40" cy="96" r="1.6" fill="#ece5d6" fill-opacity=".8"/><circle cx="120" cy="60" r="1.2" fill="#ece5d6" fill-opacity=".6"/>
      <circle cx="220" cy="100" r="1" fill="#ece5d6" fill-opacity=".5"/><circle cx="350" cy="84" r="1.4" fill="#ece5d6" fill-opacity=".7"/>
    </svg>
    <div class="hx">
      <div class="chip" id="dLabel"></div>
      <div class="k" id="dSeries"></div>
      <h1 class="ttl" id="hTitle"></h1>
      <div class="ref" id="hRef"></div>
    </div>
    <div class="nav">
      <button onclick="move(-1)" aria-label="어제 말씀">‹</button>
      <button id="fwdBtn" onclick="move(1)" aria-label="다음 날 말씀">›</button>
    </div>
  </div>

  <div class="player" id="player">
    <button type="button" class="pl-btn" id="listenBtn" onclick="listen()" aria-label="말씀 듣기 시작">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
    <div class="pl-tx"><b id="plT">듣고 따라 읽기</b><small id="plS">목소리 따라 글자가 밝아져요</small></div>
    <button type="button" class="pl-rate" id="rateBtn" onclick="cycleRate()" aria-label="읽는 빠르기">1.0×</button>
    <div class="pl-bar" aria-hidden="true"><i id="plBar"></i></div>
  </div>

  <div class="sec">
    <details id="bibleBox" open><summary id="bibleSum">오늘 본문</summary><div class="bible" id="bible">불러오는 중…</div></details>
    <div id="videoSlot"></div>
  </div>

  <div class="kv" id="kvBox">
    <small>오늘의 한 구절</small>
    <div class="v" id="kvV"></div>
    <div class="vr" id="kvR"></div>
    <div class="one" id="oneBox"><span id="one"></span></div>
    <div class="acts">
      <button type="button" class="f" onclick="saveImage()">이미지로 저장</button>
      <button type="button" onclick="shareText()">카톡으로 보내기</button>
    </div>
  </div>

  <div class="sec" id="medSec">
    <h3>3분 묵상</h3>
    <div id="med"></div>
    <div class="gos" id="gos"></div>
  </div>

  <div class="sec">
    <h3>오늘의 질문</h3>
    <div class="q" id="yq"></div>
    <label class="f" for="note">내 생각 (이 기기에만 저장돼요)</label>
    <textarea id="note" placeholder="떠오르는 생각을 한 줄로 적어 보세요" oninput="saveNote()"></textarea>
    <div class="row">
      <button class="b2" onclick="postNote(this)">교회 나눔에 올리기</button>
    </div>
  </div>

  <div class="sec">
    <h3>오늘의 도전</h3>
    <div class="chal"><div class="t" id="ya"></div><button id="chalBtn" onclick="toggleChal()">했어요</button></div>
    <div class="streak" id="chalStreak"></div>
  </div>

  <button class="read" id="readBtn" onclick="markRead()">✓ 오늘 말씀 읽었어요</button>

  <div class="foot">
    <span id="bookWrap"><a id="bookLink" href="word-book.html">📖 묵상집으로 보기</a> · </span><a href="word-adult.html">어른용 화면</a> · <a href="songs.html">🎵 찬양 듣기</a><br>
    읽고 듣는 것은 누구나 이름 없이 할 수 있어요. 친구에게 이 주소를 보내 주세요.<br>
    <a href="index.html">동산감리교회</a>
  </div>
</div>

<script src="word-data.js"></script>
<script src="word-config.js"></script>
<script src="word-core.js"></script>
<script src="word-video.js"></script>
<script>
var VER='adult',viewDate=WordData.today(),me=WordUser.get();
var KN='dongsan_youth_notes',KC='dongsan_youth_challenge';
function load(k){try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return {}}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function day(){return WordData.forDate(viewDate,WordStore.custom())}
function move(n){
  var next=WordData.shift(viewDate,n);
  if(WordData.locked(next)){wToast('내일 말씀은 내일 새벽 '+WordData.openHour+'시에 열려요');return}
  WordVoice.stop();viewDate=next;render();window.scrollTo(0,0);
}
function paras(t){return String(t||'').split(/\n\n+/).map(function(p){return '<p>'+wEsc(p)+'</p>'}).join('')}
/* 시리즈 밖의 날은 어른 묵상 질문과 누구나 할 수 있는 도전으로 채운다 */
function youth(d){
  if(d.youth)return d.youth;
  return {q:(d.adult.questions&&d.adult.questions[0])||'오늘 말씀에서 가장 마음에 남은 한 문장은 무엇인가요?',
          a:'오늘 말씀 한 구절을 잠금 화면이나 메모장에 적어 두고 세 번 다시 읽기'};
}
function keyVerse(d){return WordBible.ready?WordBible.one(d.kids.verseRef,true):''}
function render(){
  var d=day(),p=viewDate.split('-'),w=WordData.weekday(viewDate),isToday=viewDate===WordData.today();
  document.getElementById('dLabel').textContent=(+p[1])+'월 '+(+p[2])+'일 '+(w==='주일'?'주일':w+'요일')+(isToday?' · 오늘':'');
  var sr=WordData.series(viewDate);
  document.getElementById('dSeries').textContent=sr?(sr.title+' · DAY '+sr.day):(d.theme||'');
  document.getElementById('fwdBtn').disabled=WordData.locked(WordData.shift(viewDate,1));
  drawHero(d);
  WordVideo.mount(document.getElementById('videoSlot'),d.passage);
  document.getElementById('medSec').style.display=d.explain?'':'none';
  document.getElementById('med').innerHTML=paras(d.explain);
  document.getElementById('gos').style.display=d.gospel?'':'none';
  document.getElementById('gos').innerHTML=d.gospel?'<b>복음으로 보면</b>'+wEsc(d.gospel):'';
  document.getElementById('oneBox').style.display=d.remember?'':'none';
  document.getElementById('one').textContent=d.remember||'';
  var y=youth(d);
  document.getElementById('yq').textContent=y.q;
  document.getElementById('ya').textContent=y.a;
  document.getElementById('note').value=load(KN)[viewDate]||'';
  document.getElementById('bibleSum').textContent='오늘 본문 · '+d.passage+' · 개역개정';
  document.getElementById('bookLink').href='word-book.html?v=adult#'+viewDate;
  document.getElementById('bookWrap').style.display=WordData.series(viewDate)?'':'none';
  WordBible.load().then(function(){
    drawHero(d);
    var vs=WordBible.verses(d.passage,true);
    CUR_VS=vs;
    var key=keyRange(d);
    document.getElementById('bible').innerHTML=vs.length?vs.map(function(v,i){
      var n=String(v.v),c=n.indexOf(':')>0?n.split(':')[0]:(key&&key.base),m=+(n.indexOf(':')>0?n.split(':')[1]:n);
      var k=key&&c===key.ch&&m>=key.from&&m<=key.to;
      return '<span class="yl'+(k?' key':'')+'" data-i="'+i+'"><b>'+n+'</b>'+wEsc(v.t)+'</span>'}).join(''):'성경에서 '+wEsc(d.passage)+'을 찾아 읽어 보세요.';
  });
  refreshChal();refreshRead();
}
var CUR_VS=[];
/* 오늘의 핵심 절(암송 구절) */
function keyRange(d){
  var r=d.kids&&d.kids.verseRef?WordData.parseRef(d.kids.verseRef):null,p=WordData.parseRef(d.passage);
  if(!r||!p||r.book!==p.book||!r.from)return null;
  return {ch:String(r.chapter),base:String(p.chapter),from:+r.from,to:+(r.to||r.from)};
}
function drawHero(d){
  document.getElementById('hTitle').textContent=d.title;
  document.getElementById('hRef').innerHTML=wEsc(d.passage)+(d.feast?'<span class="fe">'+wEsc(d.feast)+'</span>':'');
  var v=keyVerse(d);
  document.getElementById('kvBox').style.display=(v||d.remember)?'':'none';
  document.getElementById('kvV').textContent=v?'“'+v+'”':'';
  document.getElementById('kvR').textContent=v?d.kids.verseRef:'';
}
/* 듣고 따라 읽기 — 한 절씩 읽으며 지금 절을 밝히고, 이어서 묵상과 오늘의 한 줄을 읽는다 */
var RATES=[1,1.2,.85],rateI=0;
try{rateI=Math.max(0,RATES.indexOf(+localStorage.getItem('dongsan_youth_rate')))}catch(e){}
function cycleRate(){rateI=(rateI+1)%RATES.length;try{localStorage.setItem('dongsan_youth_rate',RATES[rateI])}catch(e){}
  document.getElementById('rateBtn').textContent=RATES[rateI].toFixed(1)+'×';
  if(WordVoice.playing){WordVoice.stop();listen()}}
var PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>',
    PAUSE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
function hiLine(i){
  var n=CUR_VS.length,now=null;
  document.querySelectorAll('#bible .yl').forEach(function(e){var k=+e.dataset.i;e.classList.toggle('now',k===i);e.classList.toggle('past',i>=0&&k<i);if(k===i)now=e});
  if(now){var r=now.getBoundingClientRect();if(r.top<60||r.bottom>window.innerHeight-60)now.scrollIntoView({block:'center',behavior:'smooth'})}
  var on=WordVoice.playing;
  document.getElementById('plS').textContent=on&&i>=0&&i<n?(i+1)+' / '+n+'절 · 목소리 따라 글자가 밝아져요':(on&&i>=n?'묵상을 읽고 있어요':'목소리 따라 글자가 밝아져요');
  document.getElementById('plBar').style.width=on&&n&&i>=0?Math.min(100,Math.round((i+1)/n*100))+'%':'0';
}
function paintPlay(on){
  var b=document.getElementById('listenBtn');
  b.innerHTML=on?PAUSE:PLAY;b.setAttribute('aria-label',on?'멈추기':'말씀 듣기 시작');
  document.getElementById('plT').textContent=on?'말씀 듣는 중':'듣고 따라 읽기';
  if(!on)hiLine(-1);
}
function listen(){
  if(WordVoice.playing){WordVoice.stop();return}
  var d=day(),parts=CUR_VS.map(function(v){return v.t});
  if(!parts.length&&WordBible.ready)parts.push(WordBible.plain(d.passage,true));
  if(d.explain)parts.push('3분 묵상. '+d.explain.replace(/\n+/g,' '));
  if(d.remember)parts.push('오늘의 한 줄. '+d.remember);
  document.getElementById('bibleBox').open=true;
  WordVoice.speak(parts,{rate:RATES[rateI],onItem:hiLine,onChange:paintPlay});
}
function saveNote(){var n=load(KN),t=document.getElementById('note').value;if(t)n[viewDate]=t;else delete n[viewDate];store(KN,n)}
function postNote(btn){
  var t=document.getElementById('note').value.trim();
  if(!t){wToast('먼저 생각을 적어 주세요');return}
  if(!me.name){wAskName({title:'이름을 알려 주세요',sub:'교회 나눔에 이 이름이 적혀요. 한 번만 적으면 돼요.'},function(n){me=WordUser.set({name:n});postNote(btn)});return}
  wOnce(btn,'올리는 중…',function(){
    return WordStore.share({date:viewDate,name:me.name,ver:VER,text:'💭 '+youth(day()).q+'\n'+t}).then(function(){wToast('나눔에 올렸어요 🙌')});
  });
}
function chalStreak(){
  var c=load(KC),n=0,d=WordData.today();
  if(!c[d])d=WordData.shift(d,-1);
  while(c[d]){n++;d=WordData.shift(d,-1)}
  return n;
}
function refreshChal(){
  var c=load(KC),done=!!c[viewDate],b=document.getElementById('chalBtn');
  b.className=done?'done':'';b.textContent=done?'✓ 완료':'했어요';
  var n=chalStreak(),total=Object.keys(c).length;
  document.getElementById('chalStreak').textContent=total?('지금까지 '+total+'번 도전했어요'+(n>1?' · 연속 '+n+'일 🔥':'')):'작은 도전 하나가 하루를 바꿔요.';
}
function toggleChal(){
  if(viewDate>WordData.today())return;
  var c=load(KC);if(c[viewDate])delete c[viewDate];else{c[viewDate]=1;wToast('멋져요! 🔥')}
  store(KC,c);refreshChal();
}
function refreshRead(){
  var b=document.getElementById('readBtn');
  var done=me.name&&WordStore.myConfirms(me.name,VER).some(function(c){return c.date===viewDate});
  b.className='read'+(done?' done':'');b.textContent=done?'✓ 읽음 확인 완료':'✓ 오늘 말씀 읽었어요';
}
function markRead(){
  if(!me.name){wAskName({title:'이름을 알려 주세요',sub:'교회 읽음 기록에 이 이름이 적혀요.'},function(n){me=WordUser.set({name:n});markRead()});return}
  if(WordStore.myConfirms(me.name,VER).some(function(c){return c.date===viewDate})){wToast('이미 확인했어요 🙌');return}
  WordStore.confirm({date:viewDate,name:me.name,ver:VER}).then(function(){
    var s=wordStreak(me.name,VER);wToast(s.days>1?'연속 '+s.days+'일째 🔥':'확인했어요 🙌');refreshRead();
  },function(){wToast('보내지 못했어요. 잠시 뒤 다시 눌러 주세요')});
}
function shareText(){
  var d=day(),v=keyVerse(d),t='📖 '+d.passage+' · '+d.title;
  if(v)t+='\n\n“'+v+'” ('+d.kids.verseRef+')';
  if(d.remember)t+='\n\n📌 '+d.remember;
  t+='\n\n💭 '+youth(d).q+'\n\n👉 https://ryussuny.github.io/dongsan-church/word-youth.html';
  WordShare.send(t);
}
/* 인스타 스토리에 올리기 좋은 세로 이미지 (1080×1920) */
function wrapLines(ctx,text,max){
  var out=[],line='';
  String(text).split(' ').forEach(function(w){
    var t=line?line+' '+w:w;
    if(ctx.measureText(t).width>max&&line){out.push(line);line=w}else line=t;
  });
  if(line)out.push(line);return out;
}
function saveImage(){
  var d=day();
  WordBible.load().then(function(){return document.fonts?document.fonts.load('bold 60px "Gowun Batang"','가'):null}).then(function(){
    var v=keyVerse(d)||d.title,c=document.createElement('canvas');c.width=1080;c.height=1920;
    var x=c.getContext('2d'),g=x.createLinearGradient(0,0,1080,1920);
    g.addColorStop(0,'#1a2a52');g.addColorStop(.6,'#2d3c6b');g.addColorStop(1,'#5a4f7a');x.fillStyle=g;x.fillRect(0,0,1080,1920);
    /* 아래쪽에 떠오르는 해와 두 겹 언덕 */
    x.strokeStyle='rgba(242,184,75,.28)';x.lineWidth=4;x.beginPath();x.arc(800,1720,280,0,Math.PI*2);x.stroke();
    x.fillStyle='#f2b84b';x.beginPath();x.arc(800,1720,170,0,Math.PI*2);x.fill();
    x.fillStyle='#24305a';x.beginPath();x.moveTo(0,1660);x.bezierCurveTo(300,1560,600,1620,1080,1540);x.lineTo(1080,1920);x.lineTo(0,1920);x.fill();
    x.fillStyle='#0e1830';x.beginPath();x.moveTo(0,1780);x.bezierCurveTo(360,1720,700,1790,1080,1740);x.lineTo(1080,1920);x.lineTo(0,1920);x.fill();
    x.fillStyle='#f2b84b';x.font='700 38px "Noto Sans KR",sans-serif';x.fillText(d.passage,90,330);
    x.fillStyle='#fff';x.font='900 60px "Noto Sans KR",sans-serif';
    wrapLines(x,d.title,900).forEach(function(l,i){x.fillText(l,90,420+i*76)});
    x.font='700 64px "Gowun Batang",serif';
    var lines=wrapLines(x,'“'+v+'”',900),y=Math.max(700,1060-lines.length*52);
    lines.forEach(function(l,i){x.fillText(l,90,y+i*104)});
    x.fillStyle='rgba(255,255,255,.8)';x.font='700 36px "Noto Sans KR",sans-serif';
    x.fillText(d.kids.verseRef,90,y+lines.length*104+40);
    if(d.remember){x.font='700 40px "Noto Sans KR",sans-serif';x.fillStyle='#f4ead2';
      wrapLines(x,d.remember,900).forEach(function(l,i){x.fillText(l,90,1380+i*56)})}
    x.fillStyle='rgba(255,255,255,.6)';x.font='500 32px "Noto Sans KR",sans-serif';x.fillText('동산감리교회 · 오늘의 말씀',90,1860);
    c.toBlob(function(b){
      var f=new File([b],'dongsan-word-'+viewDate+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return}
      var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;a.click();wToast('이미지를 저장했어요');
    },'image/png');
  });
}
document.getElementById('rateBtn').textContent=RATES[rateI].toFixed(1)+'×';
if(!WordVoice.supported())document.getElementById('player').hidden=true;
WordStore.init().then(render);
